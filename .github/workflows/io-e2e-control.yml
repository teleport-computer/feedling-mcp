name: IO E2E tool
run-name: IO E2E · ${{ inputs.request_id }} · ${{ inputs.lane }} · ${{ inputs.runtime_target }} · persona x${{ inputs.persona_repetitions }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: UUID generated by the io-e2e client
        required: true
        type: string
      target_ref:
        description: Human-readable target ref (deployed_test currently requires test)
        required: true
        type: string
        default: test
      target_sha:
        description: Immutable 40-character target commit resolved by the io-e2e client
        required: true
        type: string
      lane:
        description: Execution lane
        required: true
        type: choice
        default: deployed_test
        options:
          - deployed_test
          - branch_preview
      suite:
        description: Qualification suite
        required: true
        type: choice
        default: full
        options:
          - full
      runtime_target:
        description: Runtime contract expected from the deployed endpoint
        required: true
        type: choice
        default: hosted_resident
        options:
          - deployed_current
          - hosted_resident
      persona_repetitions:
        description: Persona-memory depth (1 = smoke, 3 = release)
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "3"

permissions:
  contents: read
  deployments: read

jobs:
  authorize-request:
    name: authorize immutable target request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      deployed_sha: ${{ steps.deployed_image.outputs.sha }}
    steps:
      - name: Reject an untrusted controller or malformed request
        env:
          CONTROLLER_REF: ${{ github.ref }}
          CONTROLLER_REPOSITORY: ${{ github.repository }}
          REQUEST_ID: ${{ inputs.request_id }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_SHA: ${{ inputs.target_sha }}
          LANE: ${{ inputs.lane }}
          SUITE: ${{ inputs.suite }}
          PERSONA_REPETITIONS: ${{ inputs.persona_repetitions }}
        run: |
          set -euo pipefail
          if [ "$CONTROLLER_REPOSITORY" != "teleport-computer/feedling-mcp" ]; then
            echo "::error::IO E2E controller repository is not trusted"
            exit 1
          fi
          if [ "$CONTROLLER_REF" != "refs/heads/main" ]; then
            echo "::error::IO E2E controller must be dispatched from protected refs/heads/main"
            exit 1
          fi
          if [[ ! "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "::error::request_id must be a lowercase UUIDv4"
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::target_sha must be an immutable full Git SHA"
            exit 1
          fi
          if [[ -z "$TARGET_REF" || "$TARGET_REF" == -* || "$TARGET_REF" == *$'\n'* || ${#TARGET_REF} -gt 255 ]]; then
            echo "::error::target_ref is invalid"
            exit 1
          fi
          if [ "$SUITE" != "full" ]; then
            echo "::error::only the complete locked qualification suite is currently supported"
            exit 1
          fi
          if [ "$PERSONA_REPETITIONS" != "1" ] && [ "$PERSONA_REPETITIONS" != "3" ]; then
            echo "::error::persona_repetitions must be exactly 1 or 3"
            exit 1
          fi
          if [ "$LANE" = "branch_preview" ]; then
            echo "::error::branch_preview is not enabled: an isolated preview host and scoped provider broker are required"
            exit 1
          fi
          if [ "$LANE" != "deployed_test" ]; then
            echo "::error::unknown IO E2E lane"
            exit 1
          fi
          if [ "$TARGET_REF" != "test" ]; then
            echo "::error::deployed_test evaluates the shared test deployment and therefore requires target_ref=test"
            exit 1
          fi

      - name: Require protected controller and deployment branches
        env:
          GH_TOKEN: ${{ github.token }}
          TRUST_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in main test; do
            branch_json="$(gh api "repos/${TRUST_REPOSITORY}/branches/${branch}")"
            rules_json="$(gh api "repos/${TRUST_REPOSITORY}/rules/branches/${branch}")"
            if ! BRANCH="$branch" BRANCH_JSON="$branch_json" RULES_JSON="$rules_json" \
              python3 -I - <<'PY'
          import json
          import os

          branch = os.environ["BRANCH"]
          metadata = json.loads(os.environ["BRANCH_JSON"])
          rules = json.loads(os.environ["RULES_JSON"])
          if (
              not isinstance(metadata, dict)
              or metadata.get("name") != branch
              or metadata.get("protected") is not True
              or not isinstance(rules, list)
          ):
              raise SystemExit(1)
          rows = [row for row in rules if isinstance(row, dict)]
          types = {row.get("type") for row in rows}
          strict_review = False
          for row in rows:
              if row.get("type") != "pull_request":
                  continue
              parameters = row.get("parameters")
              if not isinstance(parameters, dict):
                  continue
              approvals = parameters.get("required_approving_review_count")
              strict_review = bool(
                  type(approvals) is int
                  and approvals >= 1
                  and parameters.get("dismiss_stale_reviews_on_push") is True
                  and parameters.get("require_last_push_approval") is True
                  and parameters.get("required_review_thread_resolution") is True
              )
              if strict_review:
                  break
          if not strict_review or not {"deletion", "non_fast_forward"}.issubset(types):
              raise SystemExit(1)
          PY
            then
              echo "::error::IO E2E requires reviewed, non-deletable, non-force-push ${branch}"
              exit 1
            fi
          done

      - name: Require branch-scoped no-reviewer QA environments
        env:
          GH_TOKEN: ${{ github.token }}
          TRUST_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          environments=(
            "io-e2e-agent-driven-test:main"
            "io-test-deploy:test"
          )
          for binding in "${environments[@]}"; do
            environment="${binding%%:*}"
            branch="${binding#*:}"
            metadata_json="$(gh api "repos/${TRUST_REPOSITORY}/environments/${environment}")"
            policies_json="$(gh api \
              "repos/${TRUST_REPOSITORY}/environments/${environment}/deployment-branch-policies")"
            if ! ENVIRONMENT_NAME="$environment" EXPECTED_BRANCH="$branch" \
              METADATA_JSON="$metadata_json" POLICIES_JSON="$policies_json" \
              python3 -I - <<'PY'
          import json
          import os

          environment = os.environ["ENVIRONMENT_NAME"]
          branch = os.environ["EXPECTED_BRANCH"]
          metadata = json.loads(os.environ["METADATA_JSON"])
          policies = json.loads(os.environ["POLICIES_JSON"])
          policy = (
              metadata.get("deployment_branch_policy")
              if isinstance(metadata, dict)
              else None
          )
          protection_rules = (
              metadata.get("protection_rules")
              if isinstance(metadata, dict)
              else None
          )
          rows = policies.get("branch_policies") if isinstance(policies, dict) else None
          valid = bool(
              isinstance(metadata, dict)
              and metadata.get("name") == environment
              and isinstance(protection_rules, list)
              and len(protection_rules) == 1
              and isinstance(protection_rules[0], dict)
              and protection_rules[0].get("type") == "branch_policy"
              and isinstance(policy, dict)
              and policy.get("protected_branches") is False
              and policy.get("custom_branch_policies") is True
              and policies.get("total_count") == 1
              and isinstance(rows, list)
              and len(rows) == 1
              and isinstance(rows[0], dict)
              and rows[0].get("type") == "branch"
              and rows[0].get("name") == branch
          )
          if not valid:
              raise SystemExit(1)
          PY
            then
              echo "::error::${environment} must allow only ${branch} with no reviewer"
              exit 1
            fi
          done

      - name: Resolve immutable target and serialized deployed image without secrets
        id: deployed
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: test
          fetch-depth: 0
          persist-credentials: false

      - name: Bind requested target SHA to deployed test history and image
        id: deployed_image
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test_head="$(git rev-parse --verify HEAD^{commit})"
          if [ "$test_head" != "$TARGET_SHA" ]; then
            echo "::error::test moved after the client resolved it; plan again before spending provider credits"
            exit 1
          fi

          compose_file="deploy/docker-compose.phala.test.yaml"
          mapfile -t images < <(
            awk '$1 == "image:" && $2 ~ /^ghcr\.io\/.*\/feedling:/ { print $2 }' "$compose_file"
          )
          if [ "${#images[@]}" -ne 2 ]; then
            echo "::error::test compose must contain exactly two Feedling backend images"
            exit 1
          fi
          image_owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          expected_prefix="ghcr.io/${image_owner}/feedling:"
          tags=()
          for image in "${images[@]}"; do
            if [[ "$image" != "${expected_prefix}"* ]]; then
              echo "::error::test compose image owner/repository is invalid"
              exit 1
            fi
            tags+=("${image#${expected_prefix}}")
          done
          mapfile -t tags < <(printf '%s\n' "${tags[@]}" | sort -u)
          if [ "${#tags[@]}" -ne 1 ] || [[ ! "${tags[0]}" =~ ^[a-f0-9]{7,40}$ ]]; then
            echo "::error::test compose must pin one hexadecimal Git revision"
            exit 1
          fi
          deployed_sha="$(git rev-parse --verify "${tags[0]}^{commit}")"
          if ! git merge-base --is-ancestor "$deployed_sha" "$test_head"; then
            echo "::error::deployed image revision is not in test history"
            exit 1
          fi
          echo "sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## IO E2E request"
            echo
            echo "- Request: \`${{ inputs.request_id }}\`"
            echo "- Requested ref: \`test\`"
            echo "- Resolved test head: \`${TARGET_SHA}\`"
            echo "- Deployed backend: \`${deployed_sha}\`"
            echo "- Lane: \`deployed_test\`"
            echo "- Suite: \`full\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write immutable request manifest
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_SHA: ${{ inputs.target_sha }}
          DEPLOYED_SHA: ${{ steps.deployed_image.outputs.sha }}
          LANE: ${{ inputs.lane }}
          SUITE: ${{ inputs.suite }}
          RUNTIME_TARGET: ${{ inputs.runtime_target }}
          PERSONA_REPETITIONS: ${{ inputs.persona_repetitions }}
          CONTROLLER_SHA: ${{ github.sha }}
          REQUEST_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          request_dir="${RUNNER_TEMP}/io-e2e-request-${REQUEST_ID}"
          mkdir -m 0700 "$request_dir"
          python3 -I - "$request_dir/request-manifest.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          payload = {
              "schema_version": 1,
              "request_id": os.environ["REQUEST_ID"],
              "repository": os.environ["REQUEST_REPOSITORY"],
              "controller_sha": os.environ["CONTROLLER_SHA"],
              "target_ref": os.environ["TARGET_REF"],
              "target_sha": os.environ["TARGET_SHA"],
              "deployed_sha": os.environ["DEPLOYED_SHA"],
              "lane": os.environ["LANE"],
              "suite": os.environ["SUITE"],
              "runtime_target": os.environ["RUNTIME_TARGET"],
              "persona_repetitions": int(os.environ["PERSONA_REPETITIONS"]),
          }
          destination = pathlib.Path(sys.argv[1])
          descriptor = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, sort_keys=True, separators=(",", ":"))
              handle.write("\n")
          PY

      - name: Retain request manifest with the same Actions run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: io-e2e-request-${{ inputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/io-e2e-request-${{ inputs.request_id }}/request-manifest.json
          if-no-files-found: error
          retention-days: 30

  qualify:
    name: run trusted deployed-test evaluator
    needs: authorize-request
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/api-key-e2e.yml
    with:
      expected_test_head_sha: ${{ inputs.target_sha }}
      expected_deployment_sha: ${{ needs.authorize-request.outputs.deployed_sha }}
      runtime_target: ${{ inputs.runtime_target }}
      persona_repetitions: ${{ inputs.persona_repetitions }}
