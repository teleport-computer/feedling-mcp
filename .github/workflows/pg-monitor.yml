# .github/workflows/pg-monitor.yml — 没有监控 = 没有备份（spec §3）
# 监控 **prod + pre** TEE Postgres 的 WAL-G 备份链（归档新鲜度 + WAL 堆积 +
# R2 落地）。test 库数据可弃，故不监控；pre 是发布验收环境，备份失效会让迁移
# 演练失真，因此与 prod 一起纳入定时检查。
name: PG backup monitor
on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [prod, pre]
    steps:
      - uses: actions/checkout@v4
      - name: Install psql 17 (direct TLS 需要 libpq>=17)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Archiver freshness + WAL 堆积（monitoring 角色，pg_monitor-only）
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PROD_MON_DSN: ${{ secrets.PROD_PG_MONITORING_DSN }}
          PRE_MON_DSN: ${{ secrets.PRE_PG_MONITORING_DSN }}
          PRE_CA_PEM: ${{ secrets.PRE_TEE_PG_CA_PEM }}
        run: |
          if [ "$ENVIRONMENT" = "prod" ]; then
            MON_DSN="$PROD_MON_DSN"
          else
            umask 077
            printf '%s' "$PRE_CA_PEM" > /tmp/pre-pg-ca.crt
            test -s /tmp/pre-pg-ca.crt || { echo "::error::pre monitoring CA is empty"; exit 1; }
            MON_DSN="$PRE_MON_DSN sslrootcert=/tmp/pre-pg-ca.crt"
          fi
          test -n "$MON_DSN" || { echo "::error::${ENVIRONMENT} monitoring DSN is empty"; exit 1; }
          PSQL=/usr/lib/postgresql/17/bin/psql
          # last_archived_time 在闲置库上不会刷新，不能单独证明归档死亡。真正的
          # fail-closed 信号是：最近失败尚无后续成功、.ready 文件持续堆积，或
          # pg_wal 超限。R2 步骤再把 last_archived_wal 与对象存储逐字对账。
          ROW=$($PSQL "$MON_DSN" -X -A -F '|' -t -c "
            WITH archive_status AS (
              SELECT
                count(*) FILTER (WHERE name LIKE '%.ready')::int AS ready_count,
                COALESCE(EXTRACT(EPOCH FROM now() - min(modification)
                  FILTER (WHERE name LIKE '%.ready'))::int, 0) AS oldest_ready_age
              FROM pg_ls_archive_statusdir()
            ), wal_dir AS (
              SELECT COALESCE(sum(size)/1024/1024, 0)::int AS wal_mb
              FROM pg_ls_waldir()
            )
            SELECT COALESCE(a.last_archived_wal, ''),
                   pg_walfile_name(pg_current_wal_lsn()),
                   CASE WHEN a.last_failed_time IS NOT NULL
                              AND (a.last_archived_time IS NULL
                                   OR a.last_failed_time > a.last_archived_time)
                        THEN 1 ELSE 0 END,
                   s.ready_count, s.oldest_ready_age, w.wal_mb
            FROM pg_stat_archiver a
            CROSS JOIN archive_status s
            CROSS JOIN wal_dir w;")
          IFS='|' read -r LAST_ARCHIVED_WAL CURRENT_WAL \
            UNRESOLVED_ARCHIVE_FAILURE READY_COUNT OLDEST_READY_AGE_SEC WAL_MB <<<"$ROW"
          export LAST_ARCHIVED_WAL CURRENT_WAL UNRESOLVED_ARCHIVE_FAILURE \
            READY_COUNT OLDEST_READY_AGE_SEC WAL_MB
          bash deploy/postgres/check-backup-health.sh archiver
          echo "LAST_ARCHIVED_WAL=$LAST_ARCHIVED_WAL" >> "$GITHUB_ENV"
      - name: R2 bucket freshness
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PROD_R2_ACCESS_KEY_ID: ${{ secrets.PROD_PG_BACKUP_R2_ACCESS_KEY_ID }}
          PROD_R2_SECRET_ACCESS_KEY: ${{ secrets.PROD_PG_BACKUP_R2_SECRET_ACCESS_KEY }}
          PROD_ENDPOINT: ${{ secrets.PROD_PG_BACKUP_R2_ENDPOINT }}
          PRE_R2_ACCESS_KEY_ID: ${{ secrets.PRE_PG_BACKUP_R2_ACCESS_KEY_ID }}
          PRE_R2_SECRET_ACCESS_KEY: ${{ secrets.PRE_PG_BACKUP_R2_SECRET_ACCESS_KEY }}
          PRE_ENDPOINT: ${{ secrets.PRE_PG_BACKUP_R2_ENDPOINT }}
          # GitHub runner has no default AWS region; `aws s3api` still demands
          # one even with --endpoint-url pointed at R2 (which ignores the
          # value but the CLI errors out client-side without it).
          AWS_DEFAULT_REGION: auto
          AWS_REGION: auto
        run: |
          if [ "$ENVIRONMENT" = "prod" ]; then
            AWS_ACCESS_KEY_ID="$PROD_R2_ACCESS_KEY_ID"
            AWS_SECRET_ACCESS_KEY="$PROD_R2_SECRET_ACCESS_KEY"
            ENDPOINT="$PROD_ENDPOINT"
          else
            AWS_ACCESS_KEY_ID="$PRE_R2_ACCESS_KEY_ID"
            AWS_SECRET_ACCESS_KEY="$PRE_R2_SECRET_ACCESS_KEY"
            ENDPOINT="$PRE_ENDPOINT"
          fi
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ENDPOINT
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" && test -n "$ENDPOINT" || {
            echo "::error::${ENVIRONMENT} R2 backup credentials are incomplete"; exit 1;
          }
          # aws CLI 会自动分页；每页可能各输出一个候选时间戳，所以排序后取全局
          # 最新。显式保存 aws 的退出码，避免管道把 R2 限流/网络错误误装成成功。
          # 瞬时错误退避重试三次，连续失败才判定“本次无法检查”。
          newest() {
            local prefix="$1" raw rc attempt
            for attempt in 1 2 3; do
              raw=$(aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" \
                --bucket io-in-enclave-db --prefix "$prefix" \
                --query 'sort_by(Contents,&LastModified)[-1].LastModified' \
                --output text) && rc=0 || rc=$?
              if [ "$rc" -eq 0 ]; then printf '%s\n' "$raw" | sort | tail -n1; return 0; fi
              echo "::warning::ListObjectsV2 '${prefix}' 第 ${attempt} 次失败 (rc=${rc})，退避重试" >&2
              sleep $((attempt * 10))
            done
            echo "::error::ListObjectsV2 '${prefix}' 连续 3 次失败 — R2 侧问题，本次无法判定备份新鲜度（不等于备份陈旧）" >&2
            return 1
          }
          BASE_TS=$(newest "${ENVIRONMENT}/wal-g/basebackups_005/")
          echo "newest base sentinel: $BASE_TS"

          age_seconds() {
            local ts="$1" age rc
            # && rc=0 || rc=$? 防 GHA 默认 bash -e 在赋值失败时直接终止、吞掉下面的诊断分支
            age=$(python3 -c "import sys, datetime as dt; s = sys.argv[1].strip(); sys.exit(3) if (not s or s == 'None') else None; s = s[:-1] + '+00:00' if s.endswith('Z') else s; d = dt.datetime.fromisoformat(s); d = d.replace(tzinfo=dt.timezone.utc) if d.tzinfo is None else d; print(int((dt.datetime.now(dt.timezone.utc) - d).total_seconds()))" "$ts") && rc=0 || rc=$?
            case $rc in
              3) echo "::error::BASE prefix EMPTY — WAL 无 base backup 不可恢复" >&2; return 1 ;;
              0) printf '%s\n' "$age" ;;
              *) echo "::error::BASE timestamp parse failed: '${ts}'" >&2; return 1 ;;
            esac
          }

          # 不再要求 R2 每小时出现新 WAL；闲置库没有新 segment 是正常状态。
          # 改为 HEAD 数据库明确报告的最后成功 WAL，对账比墙钟年龄更直接。
          NEWEST_WAL_KEY="${ENVIRONMENT}/wal-g/wal_005/${LAST_ARCHIVED_WAL}.lz4"
          for attempt in 1 2 3; do
            if aws s3api head-object --endpoint-url "$ENDPOINT" \
              --bucket io-in-enclave-db --key "$NEWEST_WAL_KEY" >/dev/null; then
              wal_found=1; break
            fi
            echo "::warning::HeadObject WAL 第 ${attempt} 次失败，退避重试" >&2
            sleep $((attempt * 10))
          done
          test "${wal_found:-0}" = 1 || {
            echo "::error::R2 缺少数据库最后成功归档的 WAL"; exit 1;
          }

          BASE_AGE_SEC=$(age_seconds "$BASE_TS")
          export NEWEST_WAL_KEY BASE_AGE_SEC
          bash deploy/postgres/check-backup-health.sh r2
