#
# Historical behavior: §4 day-0 decrypt continuity canary (PROD).
#
# It proved whether the live PROD enclave could still open an OLD envelope — the
# exact question the 2026-07 "decrypt failed" false alarm raised, which the §3
# deploy canary (new writes only) could not answer. It read the permanent canary
# user's OLDEST stored chat envelope from the prod DB and asked the prod enclave
# to decrypt it. A green result could redirect a "decrypt failed" investigation
# toward the client side.
#
# Historically ran daily + on demand. The schedule is deliberately absent now,
# so repository state also prevents an automatic run. The manual trigger is
# retained only for controlled revival work after the checklist above.
name: continuity-canary

on:
  workflow_dispatch: {}

concurrency:
  group: continuity-canary
  cancel-in-progress: false

jobs:
  prod-continuity:
    name: prod day-0 decrypt continuity
    runs-on: ubuntu-latest
    if: ${{ vars.CANARY_USER_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: python3 -m pip install --quiet "psycopg[binary]>=3.2"
      - name: Decrypt the aging canary envelope
        env:
          CANARY_USER_ID:               ${{ vars.CANARY_USER_ID }}
          DATABASE_URL:                 ${{ secrets.DATABASE_URL }}
          FEEDLING_RUNTIME_TOKEN_SECRET: ${{ secrets.FEEDLING_RUNTIME_TOKEN_SECRET }}
          FEEDLING_ENCLAVE_URL:         ${{ vars.PROD_MAIN_ENCLAVE_URL }}
        run: python3 tools/continuity_canary.py
