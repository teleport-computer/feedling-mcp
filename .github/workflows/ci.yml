# T798 temporary isolated-ref collector. NEVER merge this file to test/pre/main.
name: T798 test ingress read-only

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact independently reviewed collector commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: t798-test-ingress-readonly
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'teleport-computer/feedling-mcp' &&
      github.ref == 'refs/heads/fix/t798-test-ingress-readonly-r2' &&
      github.sha == inputs.expected_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect bounded evidence using Python standard library
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.TEST_PHALA_CLOUD_API_KEY }}
          EXPECTED_COLLECTOR_SHA: ${{ inputs.expected_sha }}
        run: python3 tools/test_ingress_readonly.py --out t798-ingress-evidence --run
      - name: Preserve only the sanitized report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: t798-ingress-${{ github.run_id }}-${{ github.run_attempt }}
          path: t798-ingress-evidence/report.json
          if-no-files-found: error
          retention-days: 3
