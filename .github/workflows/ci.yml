    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for ghcr.io image :<sha>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"  # fixed 7-char slice; must match docker-publish.yml COMMIT_SHORT (CI #906)
          IMAGE_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${IMAGE_OWNER}/feedling"
          echo "waiting for ${IMAGE}:$SHA_SHORT"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          for i in $(seq 1 60); do
            if docker manifest inspect "${IMAGE}:$SHA_SHORT" >/dev/null 2>&1; then
              echo "backend image :$SHA_SHORT available"
              exit 0
            fi
            sleep 10
          done
          echo "::error::backend image :$SHA_SHORT did not appear in 10 min — docker-publish.yml likely failed"
          exit 1

      - name: Pin Runtime V2 release images from triggering commit
        id: pin
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: >-
          ./deploy/pin-runtime-release.sh pre
          deploy/docker-compose.phala.pre.yaml
          deploy/docker-compose.phala.pre.runner.yaml

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1   # pin a concrete version: 'stable' makes foundryup hit the rate-limited GitHub API (403 in CI)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install phala CLI
        run: npm install -g phala@1.1.19  # pinned (§8 supply-chain); bump deliberately

      - name: Resolve CVM_ID
        id: cvmid
        run: |
          CVM_ID=$(tr -d '[:space:]' < deploy/pre-cvm-id.txt)
          if [ -z "$CVM_ID" ]; then
            echo "::error::deploy/pre-cvm-id.txt is empty — cannot target a CVM"
            exit 1
          fi
          echo "cvm_id=$CVM_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy CVM via phala
        env:
          # Pre env lives on the SAME Phala account as test (amiller-user) and
          # deliberately reuses its API key; only DB/contract/URLs are pre-specific.
          PHALA_CLOUD_API_KEY: ${{ secrets.TEST_PHALA_CLOUD_API_KEY }}
          CF_ZONE_ID:          ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN:        ${{ secrets.CF_API_TOKEN }}
          APNS_KEY_P8_B64:     ${{ secrets.APNS_KEY_P8_B64 }}
          APNS_KEY_ID:         ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID:        ${{ secrets.APNS_TEAM_ID }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          FEEDLING_ADMIN_TOKEN: ${{ secrets.FEEDLING_ADMIN_TOKEN }}
          DATABASE_URL:        ${{ secrets.PRE_DATABASE_URL }}
          CVM_ID:              ${{ steps.cvmid.outputs.cvm_id }}
          FEEDLING_RUNTIME_TOKEN_SECRET: ${{ secrets.TEST_FEEDLING_RUNTIME_TOKEN_SECRET }}
          FEEDLING_MIGRATE_ENABLE:      ${{ vars.TEST_FEEDLING_MIGRATE_ENABLE }}
          # gunicorn worker count (backend/gunicorn_conf.py reads it; empty → 1).
          # Encrypted env channel, NOT baked into compose_hash — flip without
          # on-chain re-auth. Gate: the deployed image must contain the leader-
          # election patch (core/leader.py) or N>1 double-binds :9998.
          FEEDLING_BACKEND_WORKERS:     ${{ vars.TEST_FEEDLING_BACKEND_WORKERS }}
          # R2 frame-ciphertext offload — TEST_-prefixed secrets, un-prefixed
          # container env. Empty = feature off; token MUST be scoped to the
          # frames bucket. See deploy/DEPLOYMENTS.md.
          R2_ENDPOINT:                  ${{ secrets.TEST_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID:             ${{ secrets.TEST_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:         ${{ secrets.TEST_R2_SECRET_ACCESS_KEY }}
          R2_FRAMES_BUCKET:             ${{ secrets.TEST_R2_FRAMES_BUCKET }}
        run: |
          echo ">>> deploy-pre-cvm target: $CVM_ID"
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PRE_DATABASE_URL secret is not set — backend has no datastore"
            exit 1
          fi
          phala deploy \
            --api-token "$PHALA_CLOUD_API_KEY" \
            --cvm-id "$CVM_ID" \
            -c deploy/docker-compose.phala.pre.yaml \
            -e "R2_ENDPOINT=$R2_ENDPOINT" \
            -e "R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID" \
            -e "R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY" \
            -e "R2_FRAMES_BUCKET=$R2_FRAMES_BUCKET" \
            -e "CF_ZONE_ID=$CF_ZONE_ID" \
            -e "CF_API_TOKEN=$CF_API_TOKEN" \
            -e "APNS_KEY_P8_B64=$APNS_KEY_P8_B64" \
            -e "APNS_KEY_ID=$APNS_KEY_ID" \
            -e "APNS_TEAM_ID=$APNS_TEAM_ID" \
            -e "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" \
            -e "FEEDLING_ADMIN_TOKEN=$FEEDLING_ADMIN_TOKEN" \
            -e "DATABASE_URL=$DATABASE_URL" \
            -e "FEEDLING_RUNTIME_TOKEN_SECRET=$FEEDLING_RUNTIME_TOKEN_SECRET" \
            -e "FEEDLING_MIGRATE_ENABLE=$FEEDLING_MIGRATE_ENABLE" \
            -e "FEEDLING_BACKEND_WORKERS=$FEEDLING_BACKEND_WORKERS" \
            -e "FEEDLING_V2_RUNNER_CVM_ID=$CVM_ID" \
            -e "FEEDLING_V2_DEPLOYED_BUILD=${GITHUB_SHA:0:7}" \
            --wait

      - name: Publish live compose_hash on Sepolia (pre contract)
        env:
          PRIVATE_KEY:                ${{ secrets.ETH_DEPLOYER_KEY }}
          ETH_SEPOLIA_RPC_URL:        ${{ vars.ETH_SEPOLIA_RPC_URL }}
          FEEDLING_APP_AUTH_CONTRACT: ${{ vars.PRE_FEEDLING_APP_AUTH_CONTRACT }}
          FEEDLING_CVM_ID:            ${{ steps.cvmid.outputs.cvm_id }}
          # Separate test account key (see deploy step above) — reads the live
          # CVM's compose_hash; publish itself is signed by ETH_DEPLOYER_KEY.
          PHALA_CLOUD_API_KEY:        ${{ secrets.TEST_PHALA_CLOUD_API_KEY }}
          FEEDLING_COMPOSE_FILE:      deploy/docker-compose.phala.pre.yaml
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml
          publish_status=1
          for attempt in 1 2 3; do
            if ./deploy/publish-compose-hash.sh eth_sepolia; then
              publish_status=0
              break
            fi
            # Do NOT capture `publish_status=$?` here: a failed `if cmd; then …; fi`
            # with no else makes the whole `if` statement exit 0, so $? reads 0 and
            # the step false-greens even when the publish reverted. Leave
            # publish_status=1 until an attempt actually succeeds above.
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::compose_hash publish failed (attempt $attempt/3); retrying in 20s"
              sleep 20
            fi
          done
          exit "$publish_status"

      # §2 attestation gate (pre). Inert until BOTH repo vars are set:
      #   PRE_MAIN_ENCLAVE_URL            = https://<pre-app-id>-5003s.dstack-pha-prod9.phala.network
      #   PRE_ENCLAVE_CONTENT_PK_BASELINE = <pre enclave content pk, from a manual /attestation read>
      - name: Post-deploy attestation gate (pre)
        env:
          ATTEST_BASE:  ${{ vars.PRE_MAIN_ENCLAVE_URL }}
          BASELINE_PK:  ${{ vars.PRE_ENCLAVE_CONTENT_PK_BASELINE }}
        run: ./deploy/attestation-gate.sh pre attestation-pre.json

      - name: Upload attestation snapshot (pre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attestation-pre-${{ github.sha }}
          path: attestation-pre.json
          retention-days: 90
          if-no-files-found: ignore

      # §3 post-deploy canary (pre). Inert until PRE_MAIN_ENCLAVE_URL is set.
      - name: Post-deploy canary round-trip (pre)
        if: ${{ vars.PRE_MAIN_ENCLAVE_URL != '' }}
        env:
          FEEDLING_API_URL:     ${{ vars.PRE_API_URL || 'https://pre-api.feedling.app' }}
          FEEDLING_ENCLAVE_URL: ${{ vars.PRE_MAIN_ENCLAVE_URL }}
        run: |
          python3 -m pip install --quiet cryptography
          python3 tools/deploy_canary.py

  # =========================================================================
  # DEPLOY — standalone V1 agent-runner worker CVM (pre)
  #
  # Deploys deploy/docker-compose.phala.pre.runner.yaml to a SEPARATE Phala CVM
  # that runs only the V1 agent-runner supervisor. Dual-runtime coexistence
  # (2026-07-21 design, Task 11): pooled Runtime V2 moved onto the main pre CVM
  # itself as the serve-worker container, so this CVM went back to V1-only form
  # — P1 uses the pair (this V1 runner + the main CVM's serve-worker) to
  # validate dual-fleet coexistence end to end before P3 touches production.
  # It shares the main CVM's PostgreSQL and token secret and reaches
  # backend/enclave over public/gateway paths.
  #
  # This deploy/readiness gate is mandatory for every CVM-affecting pre push
  # (mirrors deploy-test-runner-cvm's V1 form). Deployment remains serialized
  # because the runner must reach the new main CVM.
  # =========================================================================
  deploy-pre-runner-cvm:
    name: deploy runner CVM (pre)
    needs: [deploy-pre-cvm, detect-cvm-changes-pre]
    if: |
      github.ref == 'refs/heads/pre' &&
      github.event_name == 'push' &&
      needs.detect-cvm-changes-pre.outputs.cvm == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-pre-runner-cvm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.deploy-pre-cvm.outputs.pinned_sha }}

      - name: Wait for ghcr.io agent-runner image :<sha>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"  # fixed 7-char slice; must match docker-publish.yml COMMIT_SHORT (CI #906)
          IMAGE_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${IMAGE_OWNER}/feedling-agent-runner"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          for i in $(seq 1 60); do
            if docker manifest inspect "${IMAGE}:$SHA_SHORT" >/dev/null 2>&1; then
              echo "agent-runner image :$SHA_SHORT available"
              exit 0
            fi
            sleep 10
          done
          echo "::error::agent-runner image :$SHA_SHORT did not appear in 10 min"
          exit 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install phala CLI
        run: npm install -g phala@1.1.19  # pinned (§8 supply-chain); bump deliberately

      - name: Resolve runner CVM_ID
        id: cvmid
        run: |
          CVM_ID=$(tr -d '[:space:]' < deploy/pre-runner-cvm-id.txt)
          if [ -z "$CVM_ID" ]; then
            echo "::error::deploy/pre-runner-cvm-id.txt is empty — provision the runner CVM first"
            exit 1
          fi
          echo "cvm_id=$CVM_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy runner CVM via phala
        env:
          PHALA_CLOUD_API_KEY:          ${{ secrets.TEST_PHALA_CLOUD_API_KEY }}
          CVM_ID:                       ${{ steps.cvmid.outputs.cvm_id }}
          # Cross-CVM reach to the main CVM (repo vars — public URLs, not secrets):
          #   PRE_MAIN_API_URL     = https://pre-api.feedling.app
          #   PRE_MAIN_ENCLAVE_URL = https://<main-app-id>-5003s.dstack-pha-prod9.phala.network
          FEEDLING_API_URL:             ${{ vars.PRE_MAIN_API_URL }}
          FEEDLING_ENCLAVE_URL:         ${{ vars.PRE_MAIN_ENCLAVE_URL }}
          AGENT_MAX_CHILDREN:           ${{ vars.PRE_AGENT_MAX_CHILDREN }}
          # Shared with the main pre CVM — MUST match (esp. the token secret).
          DATABASE_URL:                 ${{ secrets.PRE_DATABASE_URL }}
          FEEDLING_RUNTIME_TOKEN_SECRET: ${{ secrets.TEST_FEEDLING_RUNTIME_TOKEN_SECRET }}
          AGENT_RUNTIME_USERS:          ${{ secrets.PRE_AGENT_RUNTIME_USERS }}
          AGENT_RUNTIME_AUTODISCOVER:   ${{ vars.PRE_AGENT_RUNTIME_AUTODISCOVER }}
          FEEDLING_HOST_ALL:            ${{ vars.PRE_FEEDLING_HOST_ALL }}
          FEEDLING_MIGRATE_ENABLE:      ${{ vars.TEST_FEEDLING_MIGRATE_ENABLE }}
        run: |
          echo ">>> deploy-runner-cvm target: $CVM_ID"
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PRE_DATABASE_URL not set — runner has no lease store"
            exit 1
          fi
          if [ -z "$FEEDLING_API_URL" ] || [ -z "$FEEDLING_ENCLAVE_URL" ]; then
            echo "::error::PRE_MAIN_API_URL / PRE_MAIN_ENCLAVE_URL not set — runner can't reach the main CVM"
            exit 1
          fi
          phala deploy \
            --api-token "$PHALA_CLOUD_API_KEY" \
            --cvm-id "$CVM_ID" \
            -c deploy/docker-compose.phala.pre.runner.yaml \
            -e "FEEDLING_API_URL=$FEEDLING_API_URL" \
            -e "FEEDLING_ENCLAVE_URL=$FEEDLING_ENCLAVE_URL" \
            -e "AGENT_MAX_CHILDREN=$AGENT_MAX_CHILDREN" \
            -e "DATABASE_URL=$DATABASE_URL" \
            -e "FEEDLING_RUNTIME_TOKEN_SECRET=$FEEDLING_RUNTIME_TOKEN_SECRET" \
            -e "AGENT_RUNTIME_USERS=$AGENT_RUNTIME_USERS" \
            -e "AGENT_RUNTIME_AUTODISCOVER=$AGENT_RUNTIME_AUTODISCOVER" \
            -e "FEEDLING_HOST_ALL=$FEEDLING_HOST_ALL" \
            -e "FEEDLING_MIGRATE_ENABLE=$FEEDLING_MIGRATE_ENABLE"
          # phala deploy --wait has a fixed 300-second ceiling; runner image
          # pulls routinely exceed it. Use the repo's explicit bounded poll.
          ./deploy/wait-cvm-ready.sh "$CVM_ID" "${CVM_READY_TIMEOUT_SEC:-900}"

      - name: Publish live runner compose_hash on Sepolia (pre contract)
        env:
          PRIVATE_KEY:                ${{ secrets.ETH_DEPLOYER_KEY }}
          ETH_SEPOLIA_RPC_URL:        ${{ vars.ETH_SEPOLIA_RPC_URL }}
          # The runner is a distinct dstack app → distinct compose_hash. Reuses the
          # same FeedlingAppAuth contract by default (addComposeHash is onlyOwner +
          # per-hash; the iOS audit card only checks the MAIN app's hashes, so the
          # runner hash is harmless there). Override with PRE_RUNNER_FEEDLING_APP_AUTH_CONTRACT.
          FEEDLING_APP_AUTH_CONTRACT: ${{ vars.PRE_RUNNER_FEEDLING_APP_AUTH_CONTRACT || vars.PRE_FEEDLING_APP_AUTH_CONTRACT }}
          FEEDLING_CVM_ID:            ${{ steps.cvmid.outputs.cvm_id }}
          PHALA_CLOUD_API_KEY:        ${{ secrets.TEST_PHALA_CLOUD_API_KEY }}
          FEEDLING_COMPOSE_FILE:      deploy/docker-compose.phala.pre.runner.yaml
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml
          publish_status=1
          for attempt in 1 2 3; do
            if ./deploy/publish-compose-hash.sh eth_sepolia; then
              publish_status=0
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::runner compose_hash publish failed (attempt $attempt/3); retrying in 20s"
              sleep 20
            fi
          done
          exit "$publish_status"
      # No post-deploy Runtime V2 fleet gate here — this CVM runs the V1
      # agent-runner, which has no v2_worker_heartbeats identity to check.
      # The main pre CVM's serve-worker still gets its own liveness proof via
      # the same admin heartbeat surface (see deploy-pre-cvm's canary step);
      # a dedicated dual-runtime post-deploy gate is tracked as follow-up work
      # (P1/P2 gates in the design doc §8), not part of Task 11's scope.

  # =========================================================================
  # DEPLOY — standalone production V1 agent-runner worker CVM(s)
  #
  # Dual-runtime coexistence (2026-07-21 design, Task 11): pooled Runtime V2
  # moved onto the main prod CVM itself as the serve-worker container, so this
  # fleet went back to V1 agent-runner (= prod's actual current topology; this
  # compose file is restored byte-for-byte from origin/test). One V1 supervisor
  # per CVM; scale out by listing more CVM ids in deploy/prod-runner-cvm-ids.txt
  # (one per line). Deploys the SAME deploy/docker-compose.phala.prod.runner.yaml
  # to each, sharing the main prod CVM's Postgres + secrets via the encrypted env
  # channel. See deploy/DEPLOYMENTS.md.
  #
  # This job runs alongside every production CVM change (§7b of the design doc:
  # "runner CVM: 不动" — the compose content only changes when this file itself
  # is edited, which after this commit it deliberately is not). The standalone
  # topology preflight is a soft warning now, not a hard "≥2 CVMs" gate — see
  # deploy/check-prod-runner-topology.sh.
  deploy-prod-runner-cvm:
    name: deploy runner CVM (prod)
    needs: [deploy-cvm, detect-cvm-changes]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.detect-cvm-changes.outputs.cvm == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-prod-runner-cvm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.deploy-cvm.outputs.pinned_sha }}

      - name: Wait for ghcr.io agent-runner image :<sha>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"  # fixed 7-char slice; must match docker-publish.yml's COMMIT_SHORT (see CI #906)
          IMAGE_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${IMAGE_OWNER}/feedling-agent-runner"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          for i in $(seq 1 60); do
            if docker manifest inspect "${IMAGE}:$SHA_SHORT" >/dev/null 2>&1; then
              echo "agent-runner image :$SHA_SHORT available"
              exit 0
            fi
            sleep 10
          done
          echo "::error::agent-runner image :$SHA_SHORT did not appear in 10 min"
          exit 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install phala CLI
        run: npm install -g phala@1.1.19  # pinned (§8 supply-chain); bump deliberately

      - name: Read prod runner CVM ids
        id: ids
        run: |
          # one id per line; ignore blank lines and # comments
          IDS=$(grep -vE '^[[:space:]]*(#|$)' deploy/prod-runner-cvm-ids.txt \
            | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
            | grep . || true)
          if [ -z "$IDS" ]; then
            echo "::error::deploy/prod-runner-cvm-ids.txt has no CVM ids — provision at least one runner CVM first"
            exit 1
          fi
          echo "count=$(printf '%s\n' "$IDS" | wc -l)"
          printf '%s\n' "$IDS"
          # stash newline-joined ids for later steps
          { echo 'ids<<EOF'; printf '%s\n' "$IDS"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Deploy each prod runner CVM via phala
        env:
          PHALA_CLOUD_API_KEY:           ${{ secrets.PHALA_CLOUD_API_KEY }}
          IDS:                           ${{ steps.ids.outputs.ids }}
          # Cross-CVM reach to the main prod CVM (repo vars — public URLs):
          #   PROD_MAIN_API_URL     = https://api.feedling.app
          #   PROD_MAIN_ENCLAVE_URL = https://<prod-app-id>-5003s.dstack-pha-prod9.phala.network
          FEEDLING_API_URL:              ${{ vars.PROD_MAIN_API_URL }}
          FEEDLING_ENCLAVE_URL:          ${{ vars.PROD_MAIN_ENCLAVE_URL }}
          AGENT_MAX_CHILDREN:            ${{ vars.AGENT_MAX_CHILDREN }}
          # Reused from the main prod CVM — MUST match (esp. the token secret).
          DATABASE_URL:                  ${{ secrets.DATABASE_URL }}
          FEEDLING_RUNTIME_TOKEN_SECRET: ${{ secrets.FEEDLING_RUNTIME_TOKEN_SECRET }}
          AGENT_RUNTIME_USERS:           ${{ secrets.AGENT_RUNTIME_USERS }}
          AGENT_RUNTIME_AUTODISCOVER:    ${{ vars.AGENT_RUNTIME_AUTODISCOVER }}
          FEEDLING_HOST_ALL:             ${{ vars.FEEDLING_HOST_ALL }}
          FEEDLING_MIGRATE_ENABLE:       ${{ vars.FEEDLING_MIGRATE_ENABLE }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL not set — runner has no lease store"; exit 1
          fi
          if [ -z "$FEEDLING_API_URL" ] || [ -z "$FEEDLING_ENCLAVE_URL" ]; then
            echo "::error::PROD_MAIN_API_URL / PROD_MAIN_ENCLAVE_URL not set — runner can't reach the main CVM"; exit 1
          fi
          printf '%s\n' "$IDS" | while IFS= read -r CVM_ID; do
            [ -z "$CVM_ID" ] && continue
            echo ">>> deploy prod runner CVM: $CVM_ID"
            phala deploy \
              --api-token "$PHALA_CLOUD_API_KEY" \
              --cvm-id "$CVM_ID" \
              -c deploy/docker-compose.phala.prod.runner.yaml \
              -e "FEEDLING_API_URL=$FEEDLING_API_URL" \
              -e "FEEDLING_ENCLAVE_URL=$FEEDLING_ENCLAVE_URL" \
              -e "AGENT_MAX_CHILDREN=$AGENT_MAX_CHILDREN" \
              -e "DATABASE_URL=$DATABASE_URL" \
              -e "FEEDLING_RUNTIME_TOKEN_SECRET=$FEEDLING_RUNTIME_TOKEN_SECRET" \
              -e "AGENT_RUNTIME_USERS=$AGENT_RUNTIME_USERS" \
              -e "AGENT_RUNTIME_AUTODISCOVER=$AGENT_RUNTIME_AUTODISCOVER" \
              -e "FEEDLING_HOST_ALL=$FEEDLING_HOST_ALL" \
              -e "FEEDLING_MIGRATE_ENABLE=$FEEDLING_MIGRATE_ENABLE"
            # NOT --wait: the CLI's readiness wait is hard-capped at 300s and
            # the runner image pull + boot regularly exceeds it. Poll with our
            # own configurable deadline instead (deploy/wait-cvm-ready.sh).
            ./deploy/wait-cvm-ready.sh "$CVM_ID" "${CVM_READY_TIMEOUT_SEC:-900}"
          done

      - name: Publish live prod runner compose_hash on Sepolia (per CVM)
        env:
          PRIVATE_KEY:                ${{ secrets.ETH_DEPLOYER_KEY }}
          ETH_SEPOLIA_RPC_URL:        ${{ vars.ETH_SEPOLIA_RPC_URL }}
          # Distinct dstack app per runner CVM → its own compose_hash (identical
          # compose ⇒ identical hash; addComposeHash is onlyOwner + per-hash, so
          # publishing per CVM is idempotent). Reuses the prod contract by default;
          # override with PROD_RUNNER_FEEDLING_APP_AUTH_CONTRACT.
          FEEDLING_APP_AUTH_CONTRACT: ${{ vars.PROD_RUNNER_FEEDLING_APP_AUTH_CONTRACT || vars.FEEDLING_APP_AUTH_CONTRACT }}
          PHALA_CLOUD_API_KEY:        ${{ secrets.PHALA_CLOUD_API_KEY }}
          FEEDLING_COMPOSE_FILE:      deploy/docker-compose.phala.prod.runner.yaml
          IDS:                        ${{ steps.ids.outputs.ids }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml
          printf '%s\n' "$IDS" | while IFS= read -r CVM_ID; do
            [ -z "$CVM_ID" ] && continue
            echo ">>> publish compose_hash for prod runner CVM: $CVM_ID"
            FEEDLING_CVM_ID="$CVM_ID"
            export FEEDLING_CVM_ID
            publish_status=1
            for attempt in 1 2 3; do
              if ./deploy/publish-compose-hash.sh eth_sepolia; then
                publish_status=0; break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::runner compose_hash publish failed for $CVM_ID (attempt $attempt/3); retrying in 20s"
                sleep 20
              fi
            done
            [ "$publish_status" -eq 0 ] || { echo "::error::publish failed for $CVM_ID"; exit 1; }
          done
      # No post-deploy Runtime V2 fleet gate here — these CVMs run the V1
      # agent-runner, which has no v2_worker_heartbeats identity to check.
      # The main prod CVM's serve-worker liveness is proved separately by the
      # deploy-cvm job's post-deploy canary/attestation gates.

  # =========================================================================
  # NOTIFY — Lark "deploy finished", sent only after the WHOLE prod deploy
  # (main CVM + runner CVM(s)) is done, not when the main CVM alone lands.
  # always() + result checks so it still fires when either deploy job fails;
  # gated on deploy-cvm having actually run so PR/test pushes stay silent.
  # Runner completion is part of the production deployment result.
  # =========================================================================
  notify-lark-prod-deploy:
    name: notify Lark (prod deploy finished)
    needs: [deploy-cvm, deploy-prod-runner-cvm]
    if: ${{ always() && needs.deploy-cvm.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Notify Lark deploy finished
        continue-on-error: true
        env:
          LARK_BOT_WEBHOOK: ${{ secrets.LARK_BOT_WEBHOOK }}
          LARK_BOT_SECRET: ${{ secrets.LARK_BOT_SECRET }}
          MAIN_STATUS: ${{ needs.deploy-cvm.result }}
          RUNNER_STATUS: ${{ needs.deploy-prod-runner-cvm.result }}
          CVM_ID: ${{ needs.deploy-cvm.outputs.cvm_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$LARK_BOT_WEBHOOK" ]; then
            echo "LARK_BOT_WEBHOOK is not configured; skip Lark deploy-finish notification."
            exit 0
          fi

          if [ "$MAIN_STATUS" = "success" ] && { [ "$RUNNER_STATUS" = "success" ] || [ "$RUNNER_STATUS" = "skipped" ]; }; then
            STATUS="success"
            PREFIX="[OK]"
          elif [ "$MAIN_STATUS" = "cancelled" ] || [ "$RUNNER_STATUS" = "cancelled" ]; then
            STATUS="cancelled"
            PREFIX="[CANCELLED]"
          else
            STATUS="failure"
            PREFIX="[FAIL]"
          fi

          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          COMMIT_URL="${SERVER_URL}/${REPOSITORY}/commit/${SHA}"
          SHORT_SHA="${SHA:0:7}"
          CONTENT=$(cat <<EOF
          $PREFIX Feedling MCP deploy finished: $STATUS

          repo: $REPOSITORY
          branch: $REF_NAME
          actor: $ACTOR
          commit: $SHORT_SHA
          cvm: $CVM_ID
          main CVM: $MAIN_STATUS
          runner CVM: $RUNNER_STATUS
          stage: main CVM + Runtime V2 worker CVM deploy

          actions: $RUN_URL
          commit: $COMMIT_URL
          EOF
          )

          SIGN_TS=""
          SIGN=""
          if [ -n "$LARK_BOT_SECRET" ]; then
            SIGN_TS=$(date +%s)
            export SIGN_TS LARK_BOT_SECRET
            SIGN=$(python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import os

          string_to_sign = f"{os.environ['SIGN_TS']}\n{os.environ['LARK_BOT_SECRET']}".encode("utf-8")
          print(base64.b64encode(hmac.new(string_to_sign, digestmod=hashlib.sha256).digest()).decode("utf-8"))
          PY
          )
          fi

          jq -n \
            --arg content "$CONTENT" \
            --arg timestamp "$SIGN_TS" \
            --arg sign "$SIGN" \
            'if $timestamp == "" then
               {msg_type:"text", content:{text:$content}}
             else
               {timestamp:$timestamp, sign:$sign, msg_type:"text", content:{text:$content}}
             end' \
            | curl -fsS -X POST "$LARK_BOT_WEBHOOK" \
                -H "Content-Type: application/json" \
                --data-binary @-
