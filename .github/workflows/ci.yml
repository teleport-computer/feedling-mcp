name: CI

on:
  push:
    branches: [main, test, pre]
  pull_request:
    branches: [main, test, pre]
  workflow_dispatch:

# Pull-request validation is replaceable, but branch pushes may already be
# between the main-CVM and runner-CVM mutations. Never cancel a release unit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------------------------------------------------------
  # Solidity — FeedlingAppAuth contract tests
  # -------------------------------------------------------------------------
  forge-test:
    name: forge test (contracts)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1   # pin a concrete version: 'stable' makes foundryup hit the rate-limited GitHub API (403 in CI)

      - name: forge build
        run: forge build --sizes

      - name: forge test
        run: forge test -vvv

      - name: forge coverage (report only, no gate yet)
        run: forge coverage --report summary
        continue-on-error: true

  # -------------------------------------------------------------------------
  # Python — backend API tests (multi-tenant only; SINGLE_USER mode retired)
  # -------------------------------------------------------------------------
  python-tests:
    name: test_api.py (multi-tenant)
    runs-on: ubuntu-24.04
    # All per-user data lives in Postgres now (see backend/db.py), so the
    # backend cannot start without a reachable DB. Provision a throwaway one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feedling_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps (hash-verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements.lock
          pip install requests  # test-only

      - name: Start backend
        env:
          FEEDLING_DATA_DIR: /tmp/feedling-data-ci
          FEEDLING_WS_PORT: "19998"
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/feedling_ci"
          # Hosted Runtime V2 needs the shared token secret; there is no
          # supervisor/host-all prerequisite after resident retirement.
          FEEDLING_RUNTIME_TOKEN_SECRET: "ci-smoke-secret"
        run: |
          mkdir -p "$FEEDLING_DATA_DIR"
          python backend/serve_dev.py > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          # wait for /healthz
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5001/healthz >/dev/null; then
              echo "backend up"; exit 0
            fi
            sleep 1
          done
          echo "backend never came up"
          cat /tmp/backend.log
          exit 1

      - name: Run test suite
        run: python tests/test_api.py http://127.0.0.1:5001 --multi-tenant

      - name: Stop test backend (the isolation suite spawns its own)
        if: always()
        run: |
          [ -f /tmp/backend.pid ] && kill $(cat /tmp/backend.pid) || true
          echo "=== backend log (last 50 lines) ==="
          tail -50 /tmp/backend.log || true

      # Multi-tenant isolation regression suite (tests/test_multi_tenant_*.py
      # +). Added after the 2026-05-11
      # P0 cross-tenant data leak — must stay green so we catch any future
      # auth / session / file-routing regression in CI before users see it.
      - name: Install pytest-asyncio (test-only)
        run: pip install pytest-asyncio

      # tests/test_pi_mcp_bridge.py drives the pi user-MCP bridge (JS) through a
      # node harness. Pinned to 22 to match the runner image, which installs
      # nodejs from setup_22.x (deploy/Dockerfile.agent-runner) — a CI/production
      # node skew would let CI bless code that breaks inside the CVM.
      # Pinning also keeps the harness's `skipif(which("node") is None)` from
      # firing silently: this repo has a documented silent-green history
      # (conftest's collect_ignore drops whole DB modules with ZERO skips
      # reported when Postgres is absent — "391 passed" against a real 2440).
      - name: Set up Node (pi bridge harness)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run isolation, CORS, and db regression suites
        # tests/conftest.py provisions a throwaway database from FEEDLING_TEST_PG
        # (the maintenance db) and exports DATABASE_URL for the spawned backends
        # and the db-layer unit tests.
        env:
          FEEDLING_TEST_PG: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
        run: >-
          python -m pytest
          tests/test_db.py
          tests/test_multi_tenant_isolation.py
          tests/test_asgi_cors.py
          tests/openapi/test_public_openapi.py
          -v

      - name: Run Round 3 V2 regression suite
        # Keep these focused: test_api.py is exercised by the server step above,
        # and enclave routes included here are dependency-mocked (no live TEE).
        env:
          FEEDLING_TEST_PG: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
        run: |
          python -m pytest \
            tests/test_proactive_store_v2.py \
            tests/test_proactive_runtime_v2.py \
            tests/test_proactive_scheduled_wake_v2.py \
            tests/test_proactive_dashboard_v2.py \
            tests/test_proactive_observability_v2.py \
            tests/test_proactive_tool_executor_v2.py \
            tests/test_perception_ingress_v2.py \
            tests/test_ios_perception_contract_v2.py \
            tests/test_perception.py \
            tests/test_proactive_jobs.py \
            tests/test_proactive_gate_eval.py \
            tests/test_screen_caption_backend.py \
            tests/test_screen_caption_flag.py \
            tests/test_enclave_frame_caption.py \
            tests/test_enclave_visual_plaintext.py \
            tests/test_proactive_agent_protocol_v2.py \
            tests/test_chat_resident_consumer.py \
            tests/test_runtime_v2_default_flag.py \
            tests/test_capture_prompt_v1.py \
            tests/test_dream_prompt_v1.py \
            tests/test_user_mcp_consumer.py \
            tests/test_pi_mcp_bridge.py \
            -v

      - name: Run Hosted Runtime V2 safety and prompt-cache suites
        env:
          FEEDLING_TEST_PG: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
        run: |
          python -m pytest \
            tests/test_ci_image_tag_width.py \
            tests/test_hosted_runtime_policy.py \
            tests/test_dual_runtime_coexistence.py \
            tests/test_dual_runtime_send_routing.py \
            tests/test_dual_runtime_flip_no_loss.py \
            tests/test_dual_runtime_db.py \
            tests/test_runtime_reconciler.py \
            tests/test_hosted_runtime_mode.py \
            tests/test_chat_send_v2_enqueue.py \
            tests/test_model_api_chat_send_routing.py \
            tests/test_model_api_profiles_endpoints.py \
            tests/test_provider_prompt_cache.py \
            tests/test_prompt_cache_canary.py \
            tests/test_provider_usage_normalize.py \
            tests/test_provider_malformed_tool_fallback.py \
            tests/test_mcp_client.py \
            tests/test_user_mcp_core.py \
            tests/test_user_mcp_probe.py \
            tests/test_user_mcp_routes.py \
            tests/test_v2_prompt_cache_key.py \
            tests/test_v2_prompt_frontier.py \
            tests/test_v2_metrics_endpoint.py \
            tests/test_prod_runner_fleet_gate.py \
            tests/test_v2_turn_metrics.py \
            tests/test_v2_whole_turn_metric.py \
            tests/test_v2_jobs_migration.py \
            tests/test_v2_jobs_store.py \
            tests/test_v2_serve_worker.py \
            tests/test_v2_p0_unified_loop.py \
            tests/test_v2_p0_history_safety.py \
            tests/test_v2_p0_pool_safety.py \
            tests/test_v2_dispatch_tool_calls.py \
            tests/test_v2_encrypted_effect_payload.py \
            tests/test_v2_mcp_tools.py \
            tests/test_v2_mixed_tool_dispatch.py \
            tests/test_v2_mutation_recovery.py \
            tests/test_v2_reconcile.py \
            tests/test_v2_tool_loop.py \
            tests/test_v2_tool_loop_mcp.py \
            tests/test_v2_worker_mcp.py \
            tests/test_v2_worker_tool_loop.py \
            tests/test_v2_atomic_reply_cursor.py \
            tests/test_v2_effect_outbox.py \
            tests/test_v2_watchdog.py \
            -v

  # -------------------------------------------------------------------------
  # Docker — confirm the hash-pinned build stays reproducible
  # -------------------------------------------------------------------------
  docker-build:
    name: docker compose build (hash-verified)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build images (no cache, --require-hashes enforced)
        run: docker compose -f deploy/docker-compose.yaml build --no-cache

      # Use the CI override to attach a throwaway Postgres (the prod compose
      # has no DB service — it targets an external managed Postgres). The
      # override is CI-only and never part of compose_hash.
      - name: Compose up + healthcheck
        run: |
          docker compose -f deploy/docker-compose.yaml -f deploy/docker-compose.ci.yml up -d
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5001/healthz >/dev/null; then
              echo "stack healthy"; exit 0
            fi
            sleep 2
          done
          echo "stack never went healthy"
          docker compose -f deploy/docker-compose.yaml -f deploy/docker-compose.ci.yml logs
          exit 1

      - name: Compose down
        if: always()
        run: docker compose -f deploy/docker-compose.yaml -f deploy/docker-compose.ci.yml down -v

  # -------------------------------------------------------------------------
  # Docker — the serve-worker's extra deps in the MAIN image
  #
  # web_fetch article extraction (trafilatura) runs in the V2 serve-worker,
  # which shares the main image (deploy/Dockerfile). docker-build above compiles
  # that image via `docker compose build`, so --require-hashes already gates
  # "does it install". This job additionally proves the C extension actually
  # imports under the image's own 3.12 interpreter — install-but-fail-to-import
  # is a real lxml failure mode a build-only gate misses. The V1 agent-runner
  # image intentionally does NOT carry trafilatura and is not checked here.
  # -------------------------------------------------------------------------
  docker-build-worker-deps:
    name: docker build (serve-worker deps in main image)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build main image (no cache, --require-hashes enforced)
        run: |
          docker build --no-cache \
            -f deploy/Dockerfile \
            -t feedling-main:ci .

      - name: trafilatura imports under the serve-worker interpreter (3.12)
        run: |
          docker run --rm feedling-main:ci python -c "
          import sys, trafilatura
          print('python', sys.version.split()[0], '| trafilatura', trafilatura.__version__)
          assert trafilatura.extract('<html><body><article><p>hello world</p></article></body></html>')
          "

  # -------------------------------------------------------------------------
  # Syntax + quick static checks
  # -------------------------------------------------------------------------
  lint:
    name: syntax + static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile all Python
        run: python -m compileall -q backend tools 2>/dev/null || python -m compileall -q backend

  # -------------------------------------------------------------------------
  # DCAP parser — Python reference tests
  # -------------------------------------------------------------------------
  dcap-python:
    name: DCAP parser (python reference)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run parser tests
        run: cd tools/dcap && python3 -m unittest test_dcap_parse.py -v

  # =========================================================================
  # DEPLOY — detect whether this push affects CVM image or compose
  #
  # The CVM is expensive to redeploy (on-chain tx + iOS consent modal) so
  # we skip it for docs-only / ci-only commits.
  # =========================================================================
  detect-cvm-changes:
    name: detect CVM changes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      cvm: ${{ steps.filter.outputs.cvm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cvm:
              - 'backend/**'
              - 'tools/deploy_canary.py'
              - 'deploy/attestation-gate.sh'
              - 'deploy/Dockerfile'
              - 'deploy/Dockerfile.agent-runner'
              - 'deploy/docker-compose.phala.yaml'
              - 'deploy/docker-compose.phala.prod.runner.yaml'
              - 'deploy/e2b/runtime-v2/**'
              - 'deploy/pin-runtime-release.sh'
              - 'deploy/prod-cvm-id.txt'
              - 'deploy/prod-runner-cvm-ids.txt'
              - 'deploy/check-prod-runner-topology.sh'
              - 'deploy/check-v2-runner-fleet.py'
              - 'deploy/publish-compose-hash.sh'
              - '.github/workflows/ci.yml'

  detect-cvm-changes-test:
    name: detect CVM changes (test)
    if: github.ref == 'refs/heads/test' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      cvm: ${{ steps.filter.outputs.cvm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cvm:
              - 'backend/**'
              - 'tools/deploy_canary.py'
              - 'deploy/attestation-gate.sh'
              - 'deploy/Dockerfile'
              - 'deploy/Dockerfile.agent-runner'
              - 'deploy/docker-compose.phala.test.yaml'
              - 'deploy/docker-compose.phala.runner.yaml'
              - 'deploy/e2b/runtime-v2/**'
              - 'deploy/pin-runtime-release.sh'
              - 'deploy/test-cvm-id.txt'
              - 'deploy/test-runner-cvm-id.txt'
              - 'deploy/publish-compose-hash.sh'
              - '.github/workflows/ci.yml'

  validate-test-runtime-prerequisites:
    name: validate test Runtime V2 deploy prerequisites
    needs: [detect-cvm-changes-test]
    if: |
      github.ref == 'refs/heads/test' &&
      github.event_name == 'push' &&
      needs.detect-cvm-changes-test.outputs.cvm == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Require independent main and runner CVMs
        run: |
          MAIN_CVM_ID=$(tr -d '[:space:]' < deploy/test-cvm-id.txt)
          RUNNER_CVM_ID=$(tr -d '[:space:]' < deploy/test-runner-cvm-id.txt)
          if [ -z "$MAIN_CVM_ID" ] || [ -z "$RUNNER_CVM_ID" ]; then
            echo "::error::test main and runner CVM IDs must both be provisioned"
            exit 1
          fi
          if [ "$MAIN_CVM_ID" = "$RUNNER_CVM_ID" ]; then
            echo "::error::test main and Runtime V2 runner must use independent CVMs"
            exit 1
          fi

      - name: Confirm both test CVMs exist before mutating the main CVM
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.TEST_PHALA_CLOUD_API_KEY }}
        run: |
          if [ -z "$PHALA_CLOUD_API_KEY" ]; then
            echo "::error::TEST_PHALA_CLOUD_API_KEY is required to validate the release unit"
            exit 1
          fi
          npm install -g phala@1.1.19
          for file in deploy/test-cvm-id.txt deploy/test-runner-cvm-id.txt; do
            CVM_ID=$(tr -d '[:space:]' < "$file")
            echo "validating test CVM $CVM_ID"
            if ! phala cvms get "$CVM_ID" --json --api-token "$PHALA_CLOUD_API_KEY" >/dev/null; then
              echo "::error::test CVM $CVM_ID does not exist or is not accessible"
              exit 1
            fi
          done

      - name: Require complete Runtime V2 configuration
        env:
          PHALA_CLOUD_API_KEY:           ${{ secrets.TEST_PHALA_CLOUD_API_KEY }}
          DATABASE_URL:                  ${{ secrets.TEST_DATABASE_URL }}
          FEEDLING_RUNTIME_TOKEN_SECRET: ${{ secrets.TEST_FEEDLING_RUNTIME_TOKEN_SECRET }}
          FEEDLING_API_URL:              ${{ vars.TEST_MAIN_API_URL }}
          FEEDLING_ENCLAVE_URL:          ${{ vars.TEST_MAIN_ENCLAVE_URL }}
          FEEDLING_ADMIN_TOKEN:          ${{ secrets.FEEDLING_ADMIN_TOKEN }}
          FEEDLING_V2_SANDBOX_PROVIDER:  ${{ vars.TEST_FEEDLING_V2_SANDBOX_PROVIDER || 'disabled' }}
          E2B_API_KEY:                    ${{ secrets.TEST_E2B_API_KEY || secrets.E2B_API_KEY }}
          FEEDLING_V2_E2B_TEMPLATE:       ${{ vars.TEST_FEEDLING_V2_E2B_TEMPLATE }}
        run: |
          missing=0
          for name in \
            PHALA_CLOUD_API_KEY \
            DATABASE_URL \
            FEEDLING_RUNTIME_TOKEN_SECRET \
            FEEDLING_API_URL \
            FEEDLING_ENCLAVE_URL \
            FEEDLING_ADMIN_TOKEN
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required before either test CVM is changed"
              missing=1
            fi
          done
          case "$FEEDLING_V2_SANDBOX_PROVIDER" in
            disabled|e2b) ;;
            *) echo "::error::test sandbox provider must be exactly disabled or e2b"; missing=1 ;;
          esac
          if [ "$FEEDLING_V2_SANDBOX_PROVIDER" = "e2b" ]; then
            if [ -z "$FEEDLING_V2_E2B_TEMPLATE" ]; then
              FEEDLING_V2_E2B_TEMPLATE=$(tr -d '[:space:]' < deploy/e2b/runtime-v2/template-tag.txt)
            fi
            if [ -z "$E2B_API_KEY" ] || [ -z "$FEEDLING_V2_E2B_TEMPLATE" ]; then
              echo "::error::test E2B sandbox requires an E2B key and content-addressed template"
              missing=1
            fi
          fi
          exit "$missing"

      - name: Build and verify the test E2B template
        if: ${{ vars.TEST_FEEDLING_V2_SANDBOX_PROVIDER == 'e2b' }}
        env:
          E2B_API_KEY:              ${{ secrets.TEST_E2B_API_KEY || secrets.E2B_API_KEY }}
          FEEDLING_V2_E2B_TEMPLATE: ${{ vars.TEST_FEEDLING_V2_E2B_TEMPLATE }}
        run: |
          python3 -m pip install --quiet e2b==2.34.0
          if [ -z "$FEEDLING_V2_E2B_TEMPLATE" ]; then
            FEEDLING_V2_E2B_TEMPLATE=$(tr -d '[:space:]' < deploy/e2b/runtime-v2/template-tag.txt)
            export FEEDLING_V2_E2B_TEMPLATE
          fi
          cd deploy/e2b/runtime-v2
          python3 build_template.py
          python3 verify_template.py

      - name: Preserve test E2B template build lock
        if: ${{ vars.TEST_FEEDLING_V2_SANDBOX_PROVIDER == 'e2b' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-e2b-template-${{ github.sha }}
          path: deploy/e2b/runtime-v2/e2b-template-build.json
          retention-days: 90

      - name: Require both Runtime V2 images before mutating either CVM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          IMAGE_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          for name in feedling feedling-agent-runner; do
            image="ghcr.io/${IMAGE_OWNER}/${name}:$SHA_SHORT"
            echo "waiting for $image"
            found=0
            for i in $(seq 1 60); do
              if docker manifest inspect "$image" >/dev/null 2>&1; then
                found=1
                break
              fi
              sleep 10
            done
            if [ "$found" != 1 ]; then
              echo "::error::$image did not appear in 10 min — no test CVM was changed"
              exit 1
            fi
          done

  # Dual-runtime coexistence (2026-07-21 design, Task 11): the prod runner
  # CVM(s) are V1 agent-runner again, so V1 resident is the fallback and the
  # standalone-runner topology gate is a soft warning (DEPLOY_PROD_RUNNER_CVM),
  # not a hard "≥2 Runtime V2 worker CVMs" block — see
  # deploy/check-prod-runner-topology.sh. Pooled Runtime V2 for the main-CVM
  # serve-worker still needs DATABASE_URL / FEEDLING_RUNTIME_TOKEN_SECRET, so
  # the rest of this job's prerequisite checks are unchanged.
  validate-prod-runner-topology:
    name: validate prod deploy prerequisites
    needs: [detect-cvm-changes]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.detect-cvm-changes.outputs.cvm == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Check standalone prod runner CVM topology
        env:
          DEPLOY_PROD_RUNNER_CVM: ${{ vars.DEPLOY_PROD_RUNNER_CVM || 'true' }}
        run: ./deploy/check-prod-runner-topology.sh deploy/prod-runner-cvm-ids.txt deploy/prod-cvm-id.txt "$DEPLOY_PROD_RUNNER_CVM"
      - name: Confirm every production CVM exists before mutating the main CVM
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          if [ -z "$PHALA_CLOUD_API_KEY" ]; then
            echo "::error::PHALA_CLOUD_API_KEY is required to validate the release fleet"
            exit 1
          fi
          npm install -g phala@1.1.19
          {
            cat deploy/prod-cvm-id.txt
            grep -vE '^[[:space:]]*(#|$)' deploy/prod-runner-cvm-ids.txt
          } | while IFS= read -r CVM_ID; do
            CVM_ID=$(printf '%s' "$CVM_ID" | tr -d '[:space:]')
            [ -z "$CVM_ID" ] && continue
            echo "validating production CVM $CVM_ID"
            if ! phala cvms get "$CVM_ID" --json --api-token "$PHALA_CLOUD_API_KEY" >/dev/null; then
              echo "::error::production CVM $CVM_ID does not exist or is not accessible"
              exit 1
            fi
          done

      - name: Require complete production Runtime V2 configuration
        env:
          DATABASE_URL:                  ${{ secrets.DATABASE_URL }}
          FEEDLING_RUNTIME_TOKEN_SECRET: ${{ secrets.FEEDLING_RUNTIME_TOKEN_SECRET }}
          FEEDLING_API_URL:              ${{ vars.PROD_MAIN_API_URL }}
          FEEDLING_ENCLAVE_URL:          ${{ vars.PROD_MAIN_ENCLAVE_URL }}
          FEEDLING_ADMIN_TOKEN:          ${{ secrets.FEEDLING_ADMIN_TOKEN }}
          FEEDLING_V2_SANDBOX_PROVIDER:  ${{ vars.PROD_FEEDLING_V2_SANDBOX_PROVIDER || 'disabled' }}
          E2B_API_KEY:                    ${{ secrets.E2B_API_KEY }}
          FEEDLING_V2_E2B_TEMPLATE:       ${{ vars.PROD_FEEDLING_V2_E2B_TEMPLATE }}
        run: |
          missing=0
          for name in \
            DATABASE_URL \
            FEEDLING_RUNTIME_TOKEN_SECRET \
            FEEDLING_API_URL \
            FEEDLING_ENCLAVE_URL \
            FEEDLING_ADMIN_TOKEN
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required before any production CVM is changed"
              missing=1
            fi
          done
          case "$FEEDLING_V2_SANDBOX_PROVIDER" in
            disabled|e2b) ;;
            *) echo "::error::production sandbox provider must be exactly disabled or e2b"; missing=1 ;;
          esac
          if [ "$FEEDLING_V2_SANDBOX_PROVIDER" = "e2b" ]; then
            if [ -z "$FEEDLING_V2_E2B_TEMPLATE" ]; then
              FEEDLING_V2_E2B_TEMPLATE=$(tr -d '[:space:]' < deploy/e2b/runtime-v2/template-tag.txt)
            fi
            if [ -z "$E2B_API_KEY" ] || [ -z "$FEEDLING_V2_E2B_TEMPLATE" ]; then
              echo "::error::production E2B sandbox requires a key and content-addressed template"
              missing=1
            fi
          fi
          exit "$missing"

      - name: Build and verify the production E2B template
        if: ${{ vars.PROD_FEEDLING_V2_SANDBOX_PROVIDER == 'e2b' }}
        env:
          E2B_API_KEY:              ${{ secrets.E2B_API_KEY }}
          FEEDLING_V2_E2B_TEMPLATE: ${{ vars.PROD_FEEDLING_V2_E2B_TEMPLATE }}
        run: |
          python3 -m pip install --quiet e2b==2.34.0
          if [ -z "$FEEDLING_V2_E2B_TEMPLATE" ]; then
            FEEDLING_V2_E2B_TEMPLATE=$(tr -d '[:space:]' < deploy/e2b/runtime-v2/template-tag.txt)
            export FEEDLING_V2_E2B_TEMPLATE
          fi
          cd deploy/e2b/runtime-v2
          python3 build_template.py
          python3 verify_template.py

      - name: Preserve production E2B template build lock
        if: ${{ vars.PROD_FEEDLING_V2_SANDBOX_PROVIDER == 'e2b' }}
        uses: actions/upload-artifact@v4
        with:
          name: prod-e2b-template-${{ github.sha }}
          path: deploy/e2b/runtime-v2/e2b-template-build.json
          retention-days: 90

      - name: Require both production images before mutating either CVM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          IMAGE_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          for name in feedling feedling-agent-runner; do
            image="ghcr.io/${IMAGE_OWNER}/${name}:$SHA_SHORT"
            echo "waiting for $image"
            found=0
            for i in $(seq 1 60); do
              if docker manifest inspect "$image" >/dev/null 2>&1; then
                found=1
                break
              fi
              sleep 10
            done
            if [ "$found" != 1 ]; then
              echo "::error::$image did not appear in 10 min — no production CVM was changed"
              exit 1
            fi
          done

  detect-cvm-changes-pre:
    name: detect CVM changes (pre)
    if: github.ref == 'refs/heads/pre' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      cvm: ${{ steps.filter.outputs.cvm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cvm:
              - 'backend/**'
              - 'tools/deploy_canary.py'
              - 'tools/prompt_cache_canary.py'
              - 'deploy/attestation-gate.sh'
              - 'deploy/Dockerfile'
              - 'deploy/Dockerfile.agent-runner'
              - 'deploy/docker-compose.phala.pre.yaml'
              - 'deploy/docker-compose.phala.pre.runner.yaml'
              - 'deploy/e2b/runtime-v2/**'
              - 'deploy/pin-runtime-release.sh'
              - 'deploy/pre-cvm-id.txt'
              - 'deploy/pre-runner-cvm-id.txt'
              - 'deploy/publish-compose-hash.sh'
              - '.github/workflows/ci.yml'

  # Dual-runtime coexistence (2026-07-21 design, Task 11): the pre runner CVM
  # is V1 agent-runner again (P1 dual-fleet validation), and pooled Runtime V2
  # now also runs on the main CVM as the serve-worker container. Validate the
  # complete two-CVM release unit before changing the main CVM, so a missing
  # runner image or configuration cannot leave either fleet unservable. The E2B
  # sandbox checks below are effectively inert under this topology (the main
  # CVM's serve-worker hardcodes FEEDLING_V2_SANDBOX_PROVIDER=disabled and the
  # V1 runner has no sandbox concept); left in place as a harmless no-op for
  # any future operator who explicitly re-enables it via the PRE_ vars.
  validate-pre-runtime-prerequisites:
    name: validate pre Runtime V2 deploy prerequisites
    needs: [detect-cvm-changes-pre]
    if: |
      github.ref == 'refs/heads/pre' &&
      github.event_name == 'push' &&
      needs.detect-cvm-changes-pre.outputs.cvm == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Require independent main and runner CVMs
        run: |
          MAIN_CVM_ID=$(tr -d '[:space:]' < deploy/pre-cvm-id.txt)
          RUNNER_CVM_ID=$(tr -d '[:space:]' < deploy/pre-runner-cvm-id.txt)
          if [ -z "$MAIN_CVM_ID" ] || [ -z "$RUNNER_CVM_ID" ]; then
            echo "::error::pre main and runner CVM IDs must both be provisioned"
            exit 1
          fi
          if [ "$MAIN_CVM_ID" = "$RUNNER_CVM_ID" ]; then
            echo "::error::pre main and Runtime V2 runner must use independent CVMs"
            exit 1
          fi

      - name: Confirm both pre CVMs exist before mutating the main CVM
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.TEST_PHALA_CLOUD_API_KEY }}
        run: |
          if [ -z "$PHALA_CLOUD_API_KEY" ]; then
            echo "::error::TEST_PHALA_CLOUD_API_KEY is required to validate the release unit"
            exit 1
          fi
          npm install -g phala@1.1.19
          for file in deploy/pre-cvm-id.txt deploy/pre-runner-cvm-id.txt; do
            CVM_ID=$(tr -d '[:space:]' < "$file")
            echo "validating pre CVM $CVM_ID"
            if ! phala cvms get "$CVM_ID" --json --api-token "$PHALA_CLOUD_API_KEY" >/dev/null; then
              echo "::error::pre CVM $CVM_ID does not exist or is not accessible"
              exit 1
            fi
          done

      - name: Require complete Runtime V2 configuration
        env:
          PHALA_CLOUD_API_KEY:           ${{ secrets.TEST_PHALA_CLOUD_API_KEY }}
          DATABASE_URL:                  ${{ secrets.PRE_DATABASE_URL }}
          FEEDLING_RUNTIME_TOKEN_SECRET: ${{ secrets.TEST_FEEDLING_RUNTIME_TOKEN_SECRET }}
          FEEDLING_API_URL:              ${{ vars.PRE_MAIN_API_URL }}
          FEEDLING_ENCLAVE_URL:          ${{ vars.PRE_MAIN_ENCLAVE_URL }}
          FEEDLING_ADMIN_TOKEN:          ${{ secrets.FEEDLING_ADMIN_TOKEN }}
          FEEDLING_V2_SANDBOX_PROVIDER:  ${{ vars.PRE_FEEDLING_V2_SANDBOX_PROVIDER || 'disabled' }}
          E2B_API_KEY:                    ${{ secrets.PRE_E2B_API_KEY || secrets.E2B_API_KEY }}
          FEEDLING_V2_E2B_TEMPLATE:       ${{ vars.PRE_FEEDLING_V2_E2B_TEMPLATE }}
        run: |
          missing=0
          for name in \
            PHALA_CLOUD_API_KEY \
            DATABASE_URL \
            FEEDLING_RUNTIME_TOKEN_SECRET \
            FEEDLING_API_URL \
            FEEDLING_ENCLAVE_URL \
            FEEDLING_ADMIN_TOKEN
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required before either pre CVM is changed"
              missing=1
            fi
          done
          case "$FEEDLING_V2_SANDBOX_PROVIDER" in
            disabled|e2b) ;;
            *) echo "::error::pre sandbox provider must be exactly disabled or e2b"; missing=1 ;;
          esac
          if [ "$FEEDLING_V2_SANDBOX_PROVIDER" = "e2b" ]; then
            if [ -z "$FEEDLING_V2_E2B_TEMPLATE" ]; then
              FEEDLING_V2_E2B_TEMPLATE=$(tr -d '[:space:]' < deploy/e2b/runtime-v2/template-tag.txt)
            fi
            if [ -z "$E2B_API_KEY" ] || [ -z "$FEEDLING_V2_E2B_TEMPLATE" ]; then
              echo "::error::pre E2B sandbox requires an E2B key and content-addressed template"
              missing=1
            fi
          fi
          exit "$missing"

      - name: Build and verify the content-addressed E2B template
        if: ${{ vars.PRE_FEEDLING_V2_SANDBOX_PROVIDER == 'e2b' }}
        env:
          E2B_API_KEY:               ${{ secrets.PRE_E2B_API_KEY || secrets.E2B_API_KEY }}
          FEEDLING_V2_E2B_TEMPLATE:  ${{ vars.PRE_FEEDLING_V2_E2B_TEMPLATE }}
        run: |
          python3 -m pip install --quiet e2b==2.34.0
          if [ -z "$FEEDLING_V2_E2B_TEMPLATE" ]; then
            FEEDLING_V2_E2B_TEMPLATE=$(tr -d '[:space:]' < deploy/e2b/runtime-v2/template-tag.txt)
            export FEEDLING_V2_E2B_TEMPLATE
          fi
          cd deploy/e2b/runtime-v2
          python3 build_template.py
          python3 verify_template.py

      - name: Preserve E2B template build lock
        if: ${{ vars.PRE_FEEDLING_V2_SANDBOX_PROVIDER == 'e2b' }}
        uses: actions/upload-artifact@v4
        with:
          name: pre-e2b-template-${{ github.sha }}
          path: deploy/e2b/runtime-v2/e2b-template-build.json
          retention-days: 90

      - name: Require both Runtime V2 images before mutating either CVM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          IMAGE_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          for name in feedling feedling-agent-runner; do
            image="ghcr.io/${IMAGE_OWNER}/${name}:$SHA_SHORT"
            echo "waiting for $image"
            found=0
            for i in $(seq 1 60); do
              if docker manifest inspect "$image" >/dev/null 2>&1; then
                found=1
                break
              fi
              sleep 10
            done
            if [ "$found" != 1 ]; then
              echo "::error::$image did not appear in 10 min — no pre CVM was changed"
              exit 1
            fi
          done

  # =========================================================================
  # DEPLOY — CVM (compose_hash on-chain + phala deploy)
  #
  # Chain:  (1) wait for ghcr.io/.../feedling:<sha> image published by
  #             docker-publish.yml
  #         (2) atomically pin backend + runner tags from the triggering SHA
  #             into one compare-and-swap [skip ci] release commit
  #         (3) compute compose_hash from the pinned compose, authorize it
  #             on-chain via FeedlingAppAuth.addComposeHash (idempotent)
  #         (4) phala deploy --cvm-id <uuid>, then poll readiness with our
  #             own deadline via deploy/wait-cvm-ready.sh (the CLI's --wait is
  #             hard-capped at 300s, which the main CVM boot regularly exceeds)
  #
  # iOS side: audit card sees new compose_hash and prompts consent. By
  # design — this is the trust boundary the user explicitly accepts.
  # =========================================================================
  deploy-cvm:
    name: deploy CVM
    needs: [forge-test, python-tests, docker-build, docker-build-worker-deps, lint, dcap-python, detect-cvm-changes, validate-prod-runner-topology]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.detect-cvm-changes.outputs.cvm == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    concurrency:
      group: deploy-cvm
      cancel-in-progress: false
    outputs:
      cvm_id: ${{ steps.cvmid.outputs.cvm_id }}
      pinned_sha: ${{ steps.pin.outputs.pinned_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for ghcr.io image :<sha>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"  # fixed 7-char slice; must match docker-publish.yml's COMMIT_SHORT (see CI #906)
          IMAGE_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${IMAGE_OWNER}/feedling"
          echo "waiting for ${IMAGE}:$SHA_SHORT"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          for i in $(seq 1 60); do
            if docker manifest inspect "${IMAGE}:$SHA_SHORT" >/dev/null 2>&1; then
              echo "backend image :$SHA_SHORT available"
              exit 0
            fi
            sleep 10
          done
          echo "::error::backend image :$SHA_SHORT did not appear in 10 min — docker-publish.yml likely failed"
          exit 1

      - name: Pin Runtime V2 release images from triggering commit
        id: pin
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: >-
          ./deploy/pin-runtime-release.sh main
          deploy/docker-compose.phala.yaml
          deploy/docker-compose.phala.prod.runner.yaml

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1   # pin a concrete version: 'stable' makes foundryup hit the rate-limited GitHub API (403 in CI)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install phala CLI
        run: npm install -g phala@1.1.19  # pinned (§8 supply-chain); bump deliberately

      # Deploy FIRST so we can read the live compose_hash back from dstack.
      # Pre-computing the hash from the local compose file doesn't work:
      # dstack injects `features`, bumps `pre_launch_script` version, etc.
      # at deploy time, so synthesis always drifts. The CVM itself is the
      # only source of truth for what hash was actually computed at boot.
      - name: Resolve CVM_ID
        id: cvmid
        run: |
          CVM_ID=$(tr -d '[:space:]' < deploy/prod-cvm-id.txt)
          if [ -z "$CVM_ID" ]; then
            echo "::error::deploy/prod-cvm-id.txt is empty — cannot target a CVM"
            exit 1
          fi
          echo "cvm_id=$CVM_ID" >> "$GITHUB_OUTPUT"

      - name: Notify Lark deploy starting
        continue-on-error: true
        env:
          LARK_BOT_WEBHOOK: ${{ secrets.LARK_BOT_WEBHOOK }}
          LARK_BOT_SECRET: ${{ secrets.LARK_BOT_SECRET }}
          CVM_ID: ${{ steps.cvmid.outputs.cvm_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$LARK_BOT_WEBHOOK" ]; then
            echo "LARK_BOT_WEBHOOK is not configured; skip Lark deploy-start notification."
            exit 0
          fi

          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          COMMIT_URL="${SERVER_URL}/${REPOSITORY}/commit/${SHA}"
          SHORT_SHA="${SHA:0:7}"
          CONTENT=$(cat <<EOF
          [START] Feedling MCP deploy starting

          repo: $REPOSITORY
          branch: $REF_NAME
          actor: $ACTOR
          commit: $SHORT_SHA
          cvm: $CVM_ID
          stage: before phala deploy

          actions: $RUN_URL
          commit: $COMMIT_URL
          EOF
          )

          SIGN_TS=""
          SIGN=""
          if [ -n "$LARK_BOT_SECRET" ]; then
            SIGN_TS=$(date +%s)
            export SIGN_TS LARK_BOT_SECRET
            SIGN=$(python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import os

          string_to_sign = f"{os.environ['SIGN_TS']}\n{os.environ['LARK_BOT_SECRET']}".encode("utf-8")
          print(base64.b64encode(hmac.new(string_to_sign, digestmod=hashlib.sha256).digest()).decode("utf-8"))
          PY
          )
          fi

          jq -n \
            --arg content "$CONTENT" \
            --arg timestamp "$SIGN_TS" \
            --arg sign "$SIGN" \
            'if $timestamp == "" then
               {msg_type:"text", content:{text:$content}}
             else
               {timestamp:$timestamp, sign:$sign, msg_type:"text", content:{text:$content}}
             end' \
            | curl -fsS -X POST "$LARK_BOT_WEBHOOK" \
                -H "Content-Type: application/json" \
                --data-binary @-

      - name: Deploy CVM via phala
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          CF_ZONE_ID:          ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN:        ${{ secrets.CF_API_TOKEN }}
          # APNs private key (base64-encoded .p8). Injected via the
          # encrypted env channel — NOT baked into compose_hash. KEY_ID +
          # TEAM_ID are passed separately so key rotation does not require
          # changing backend defaults. If the key secret isn't set, the
          # backend logs-only and the iOS push is silently dropped.
          APNS_KEY_P8_B64:     ${{ secrets.APNS_KEY_P8_B64 }}
          APNS_KEY_ID:         ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID:        ${{ secrets.APNS_TEAM_ID }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          FEEDLING_ADMIN_TOKEN: ${{ secrets.FEEDLING_ADMIN_TOKEN }}
          FEEDLING_ADMIN_PASSWORD: ${{ secrets.FEEDLING_ADMIN_PASSWORD }}
          # External Postgres connection string (with sslmode=require). Injected
          # via the encrypted env channel — carries DB credentials, NOT baked
          # into compose_hash. The backend fails fast at boot if this is empty.
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}
          # TEE 明文影子库双写（feedling-io-db-prod 独立 pg CVM）。best-effort 镜像，
          # mirror 永不 raise。两个都空 = OFF。app 角色 DSN、sslmode=require。加密 env
          # 通道，不烧 compose_hash（同 DATABASE_URL）。⚠️ 开启触发 prod enclave 全量
          # 回填 —— 首开建议 PROD_FEEDLING_TEE_DUAL_WRITE 留空、健康后再挑低峰翻开。
          TEE_DATABASE_URL:        ${{ secrets.PROD_TEE_DATABASE_URL }}
          FEEDLING_TEE_DUAL_WRITE: ${{ secrets.PROD_FEEDLING_TEE_DUAL_WRITE }}
          CVM_ID:              ${{ steps.cvmid.outputs.cvm_id }}
          FEEDLING_RUNTIME_TOKEN_SECRET: ${{ secrets.FEEDLING_RUNTIME_TOKEN_SECRET }}
          FEEDLING_MIGRATE_ENABLE:      ${{ vars.FEEDLING_MIGRATE_ENABLE }}
          # gunicorn worker counts (compose reads them; empty → compose default
          # 4/backend, 2/enclave). Encrypted env, NOT baked into compose_hash —
          # flip via repo var without on-chain re-auth. Gate: the deployed image
          # must contain the leader-election patch (core/leader.py) for backend
          # N>1 or it double-binds :9998; the current image has it.
          FEEDLING_BACKEND_WORKERS:     ${{ vars.FEEDLING_BACKEND_WORKERS }}
          FEEDLING_ENCLAVE_WORKERS:     ${{ vars.FEEDLING_ENCLAVE_WORKERS }}
          # R2 frame-ciphertext offload (backend/object_storage.py). Encrypted
          # env channel; empty = feature off. The token MUST be scoped to the
          # frames bucket. See deploy/DEPLOYMENTS.md.
          R2_ENDPOINT:                  ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID:             ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:         ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_FRAMES_BUCKET:             ${{ secrets.R2_FRAMES_BUCKET }}
        run: |
          echo ">>> deploy-cvm target: $CVM_ID"
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — backend has no datastore to connect to"
            exit 1
          fi
          phala deploy \
            --api-token "$PHALA_CLOUD_API_KEY" \
            --cvm-id "$CVM_ID" \
            -c deploy/docker-compose.phala.yaml \
            -e "R2_ENDPOINT=$R2_ENDPOINT" \
            -e "R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID" \
            -e "R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY" \
            -e "R2_FRAMES_BUCKET=$R2_FRAMES_BUCKET" \
            -e "CF_ZONE_ID=$CF_ZONE_ID" \
            -e "CF_API_TOKEN=$CF_API_TOKEN" \
            -e "APNS_KEY_P8_B64=$APNS_KEY_P8_B64" \
            -e "APNS_KEY_ID=$APNS_KEY_ID" \
            -e "APNS_TEAM_ID=$APNS_TEAM_ID" \
            -e "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" \
            -e "FEEDLING_ADMIN_TOKEN=$FEEDLING_ADMIN_TOKEN" \
            -e "FEEDLING_ADMIN_PASSWORD=$FEEDLING_ADMIN_PASSWORD" \
            -e "DATABASE_URL=$DATABASE_URL" \
            -e "TEE_DATABASE_URL=$TEE_DATABASE_URL" \
            -e "FEEDLING_TEE_DUAL_WRITE=$FEEDLING_TEE_DUAL_WRITE" \
            -e "FEEDLING_RUNTIME_TOKEN_SECRET=$FEEDLING_RUNTIME_TOKEN_SECRET" \
            -e "FEEDLING_MIGRATE_ENABLE=$FEEDLING_MIGRATE_ENABLE" \
            -e "FEEDLING_BACKEND_WORKERS=$FEEDLING_BACKEND_WORKERS" \
            -e "FEEDLING_ENCLAVE_WORKERS=$FEEDLING_ENCLAVE_WORKERS" \
            -e "FEEDLING_V2_RUNNER_CVM_ID=$CVM_ID" \
            -e "FEEDLING_V2_DEPLOYED_BUILD=${GITHUB_SHA:0:7}"
          # serve-worker now rides the main CVM: fleet identity (runner_identity.py)
          # requires CVM id + the 7-char build sha matching the baked image commit.
          # NOT --wait: the CLI's readiness wait is hard-capped at 300s and the
          # main CVM image pull + backend/enclave boot regularly exceeds it. Poll
          # with our own configurable deadline instead (deploy/wait-cvm-ready.sh).
          ./deploy/wait-cvm-ready.sh "$CVM_ID" "${CVM_READY_TIMEOUT_SEC:-900}"

      - name: Publish live compose_hash on Sepolia
        env:
          PRIVATE_KEY:                ${{ secrets.ETH_DEPLOYER_KEY }}
          ETH_SEPOLIA_RPC_URL:        ${{ vars.ETH_SEPOLIA_RPC_URL }}
          FEEDLING_APP_AUTH_CONTRACT: ${{ vars.FEEDLING_APP_AUTH_CONTRACT }}
          # Live-CVM mode: publish whatever hash dstack actually computed at
          # boot, not our local synthesis (which always drifts — see the
          # block comment in publish-compose-hash.sh).
          FEEDLING_CVM_ID:            ${{ steps.cvmid.outputs.cvm_id }}
          PHALA_CLOUD_API_KEY:        ${{ secrets.PHALA_CLOUD_API_KEY }}
          FEEDLING_COMPOSE_FILE:      deploy/docker-compose.phala.yaml
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml
          publish_status=1
          for attempt in 1 2 3; do
            if ./deploy/publish-compose-hash.sh eth_sepolia; then
              publish_status=0
              break
            fi
            # Do NOT capture `publish_status=$?` here: a failed `if cmd; then …; fi`
            # with no else makes the whole `if` statement exit 0, so $? reads 0 and
            # the step false-greens even when the publish reverted. Leave
            # publish_status=1 until an attempt actually succeeds above.
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::compose_hash publish failed (attempt $attempt/3); retrying in 20s"
              sleep 20
            fi
          done
          exit "$publish_status"

      # §2 incident guardrail: fail the deploy RED within minutes if the live
      # enclave content pk ever diverges from the recorded baseline (a real KMS /
      # OS / config key event), instead of a user reporting "decrypt failed" days
      # later. DEFENSIVE: inert (skips, never fails) until BOTH repo vars are set —
      #   PROD_MAIN_ENCLAVE_URL      = https://<prod-app-id>-5003s.dstack-pha-prod9.phala.network
      #   ENCLAVE_CONTENT_PK_BASELINE = 2d642ec1f54719d8c6088e8cbaf394961cb804a533bd4d7366d48d1d543f5620
      # A legitimate planned key change = update ENCLAVE_CONTENT_PK_BASELINE in the same PR.
      - name: Post-deploy attestation gate
        env:
          ATTEST_BASE:  ${{ vars.PROD_MAIN_ENCLAVE_URL }}
          BASELINE_PK:  ${{ vars.ENCLAVE_CONTENT_PK_BASELINE }}
        run: ./deploy/attestation-gate.sh prod attestation-prod.json

      - name: Upload attestation snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attestation-prod-${{ github.sha }}
          path: attestation-prod.json
          retention-days: 90
          if-no-files-found: ignore

      # §3 post-deploy canary: register → whoami==attestation → seal → enclave
      # decrypt → reset, proving the whole write/seal/decrypt loop on the live
      # CVM. Inert until PROD_MAIN_ENCLAVE_URL is set (same gate as §2). The
      # canary self-cleans its throwaway account (finally: /v1/account/reset).
      # Transient transport/gateway failures (post-restart respawn storm, run
      # #664) are absorbed by the canary's built-in retries (~62s budget), so
      # this is a hard gate again.
      #
      # TEMP (2026-07-14): downgraded to non-blocking while the prod register
      # write path (transport timeouts, run #884) is under investigation. Restore
      # the hard gate — delete continue-on-error — once that is resolved.
      - name: Post-deploy canary round-trip
        if: ${{ vars.PROD_MAIN_ENCLAVE_URL != '' }}
        continue-on-error: true
        env:
          FEEDLING_API_URL:     ${{ vars.PROD_API_URL || 'https://api.feedling.app' }}
          FEEDLING_ENCLAVE_URL: ${{ vars.PROD_MAIN_ENCLAVE_URL }}
        run: |
          python3 -m pip install --quiet cryptography
          python3 tools/deploy_canary.py

      # The "deploy finished" Lark notification is NOT sent here — the prod
      # deploy isn't done until the runner CVM(s) redeploy. It lives in the
      # notify-lark-prod-deploy job (needs: deploy-cvm + deploy-prod-runner-cvm).

  deploy-test-cvm:
    name: deploy CVM (test)
    needs: [forge-test, python-tests, docker-build, docker-build-worker-deps, lint, dcap-python, detect-cvm-changes-test, validate-test-runtime-prerequisites]
    if: |
      github.ref == 'refs/heads/test' &&
      github.event_name == 'push' &&
      needs.detect-cvm-changes-test.outputs.cvm == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    concurrency:
      group: deploy-test-cvm
      cancel-in-progress: false
    outputs:
      pinned_sha: ${{ steps.pin.outputs.pinned_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for ghcr.io image :<sha>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"  # fixed 7-char slice; must match docker-publish.yml's COMMIT_SHORT (see CI #906)
          IMAGE_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${IMAGE_OWNER}/feedling"
          echo "waiting for ${IMAGE}:$SHA_SHORT"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          for i in $(seq 1 60); do
            if docker manifest inspect "${IMAGE}:$SHA_SHORT" >/dev/null 2>&1; then
              echo "backend image :$SHA_SHORT available"
              exit 0
            fi
            sleep 10
          done
          echo "::error::backend image :$SHA_SHORT did not appear in 10 min — docker-publish.yml likely failed"
          exit 1

      - name: Pin Runtime V2 release images from triggering commit
        id: pin
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: >-
          ./deploy/pin-runtime-release.sh test
          deploy/docker-compose.phala.test.yaml
          deploy/docker-compose.phala.runner.yaml

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1   # pin a concrete version: 'stable' makes foundryup hit the rate-limited GitHub API (403 in CI)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install phala CLI
        run: npm install -g phala@1.1.19  # pinned (§8 supply-chain); bump deliberately

      - name: Resolve CVM_ID
        id: cvmid
        run: |
          CVM_ID=$(tr -d '[:space:]' < deploy/test-cvm-id.txt)
          if [ -z "$CVM_ID" ]; then
            echo "::error::deploy/test-cvm-id.txt is empty — cannot target a CVM"
            exit 1
          fi
          echo "cvm_id=$CVM_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy CVM via phala
        env:
          # Test env runs on a SEPARATE Phala account (amiller-user) from prod.
          # Uses its own secret so flipping test never touches prod's key.
          PHALA_CLOUD_API_KEY: ${{ secrets.TEST_PHALA_CLOUD_API_KEY }}
          CF_ZONE_ID:          ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN:        ${{ secrets.CF_API_TOKEN }}
          APNS_KEY_P8_B64:     ${{ secrets.APNS_KEY_P8_B64 }}
          APNS_KEY_ID:         ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID:        ${{ secrets.APNS_TEAM_ID }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          FEEDLING_ADMIN_TOKEN: ${{ secrets.FEEDLING_ADMIN_TOKEN }}
          FEEDLING_ADMIN_PASSWORD: ${{ secrets.TEST_FEEDLING_ADMIN_PASSWORD }}
          DATABASE_URL:        ${{ secrets.TEST_DATABASE_URL }}
          # TEE 明文影子库双写（feedling-io-db-test 独立 pg CVM）。best-effort
          # 镜像，mirror 永不 raise。两个都空 = OFF。app 角色 DSN、sslmode=require。
          # 加密 env 通道，不烧 compose_hash（同 DATABASE_URL）。
          TEE_DATABASE_URL:        ${{ secrets.TEST_TEE_DATABASE_URL }}
          FEEDLING_TEE_DUAL_WRITE: ${{ secrets.TEST_FEEDLING_TEE_DUAL_WRITE }}
          CVM_ID:              ${{ steps.cvmid.outputs.cvm_id }}
          FEEDLING_RUNTIME_TOKEN_SECRET: ${{ secrets.TEST_FEEDLING_RUNTIME_TOKEN_SECRET }}
          FEEDLING_MIGRATE_ENABLE:      ${{ vars.TEST_FEEDLING_MIGRATE_ENABLE }}
          # gunicorn worker count (backend/gunicorn_conf.py reads it; empty → 1).
          # Encrypted env channel, NOT baked into compose_hash — flip without
          # on-chain re-auth. Gate: the deployed image must contain the leader-
          # election patch (core/leader.py) or N>1 double-binds :9998.
          FEEDLING_BACKEND_WORKERS:     ${{ vars.TEST_FEEDLING_BACKEND_WORKERS }}
          # R2 frame-ciphertext offload — TEST_-prefixed secrets, un-prefixed
          # container env. Empty = feature off; token MUST be scoped to the
          # frames bucket. See deploy/DEPLOYMENTS.md.
          R2_ENDPOINT:                  ${{ secrets.TEST_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID:             ${{ secrets.TEST_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:         ${{ secrets.TEST_R2_SECRET_ACCESS_KEY }}
          R2_FRAMES_BUCKET:             ${{ secrets.TEST_R2_FRAMES_BUCKET }}
        run: |
          echo ">>> deploy-test-cvm target: $CVM_ID"
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::TEST_DATABASE_URL secret is not set — backend has no datastore"
            exit 1
          fi
          phala deploy \
            --api-token "$PHALA_CLOUD_API_KEY" \
            --cvm-id "$CVM_ID" \
            -c deploy/docker-compose.phala.test.yaml \
            -e "R2_ENDPOINT=$R2_ENDPOINT" \
            -e "R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID" \
            -e "R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY" \
            -e "R2_FRAMES_BUCKET=$R2_FRAMES_BUCKET" \
            -e "CF_ZONE_ID=$CF_ZONE_ID" \
            -e "CF_API_TOKEN=$CF_API_TOKEN" \
            -e "APNS_KEY_P8_B64=$APNS_KEY_P8_B64" \
            -e "APNS_KEY_ID=$APNS_KEY_ID" \
            -e "APNS_TEAM_ID=$APNS_TEAM_ID" \
            -e "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" \
            -e "FEEDLING_ADMIN_TOKEN=$FEEDLING_ADMIN_TOKEN" \
            -e "FEEDLING_ADMIN_PASSWORD=$FEEDLING_ADMIN_PASSWORD" \
            -e "DATABASE_URL=$DATABASE_URL" \
            -e "TEE_DATABASE_URL=$TEE_DATABASE_URL" \
            -e "FEEDLING_TEE_DUAL_WRITE=$FEEDLING_TEE_DUAL_WRITE" \
            -e "FEEDLING_RUNTIME_TOKEN_SECRET=$FEEDLING_RUNTIME_TOKEN_SECRET" \
            -e "FEEDLING_MIGRATE_ENABLE=$FEEDLING_MIGRATE_ENABLE" \
            -e "FEEDLING_BACKEND_WORKERS=$FEEDLING_BACKEND_WORKERS" \
            -e "FEEDLING_V2_RUNNER_CVM_ID=$CVM_ID" \
            -e "FEEDLING_V2_DEPLOYED_BUILD=${GITHUB_SHA:0:7}"
          # serve-worker now rides the main CVM: fleet identity (runner_identity.py)
          # requires CVM id + the 7-char build sha matching the baked image commit.
          # NOT --wait: the CLI's readiness wait is hard-capped at 300s and the
          # main CVM image pull + backend/enclave boot regularly exceeds it. Poll
          # with our own configurable deadline instead (deploy/wait-cvm-ready.sh).
          ./deploy/wait-cvm-ready.sh "$CVM_ID" "${CVM_READY_TIMEOUT_SEC:-900}"

      - name: Publish live compose_hash on Sepolia (test contract)
        env:
          PRIVATE_KEY:                ${{ secrets.ETH_DEPLOYER_KEY }}
          ETH_SEPOLIA_RPC_URL:        ${{ vars.ETH_SEPOLIA_RPC_URL }}
          FEEDLING_APP_AUTH_CONTRACT: ${{ vars.TEST_FEEDLING_APP_AUTH_CONTRACT }}
          FEEDLING_CVM_ID:            ${{ steps.cvmid.outputs.cvm_id }}
          # Separate test account key (see deploy step above) — reads the live
          # CVM's compose_hash; publish itself is signed by ETH_DEPLOYER_KEY.
          PHALA_CLOUD_API_KEY:        ${{ secrets.TEST_PHALA_CLOUD_API_KEY }}
          FEEDLING_COMPOSE_FILE:      deploy/docker-compose.phala.test.yaml
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml
          publish_status=1
          for attempt in 1 2 3; do
            if ./deploy/publish-compose-hash.sh eth_sepolia; then
              publish_status=0
              break
            fi
            # Do NOT capture `publish_status=$?` here: a failed `if cmd; then …; fi`
            # with no else makes the whole `if` statement exit 0, so $? reads 0 and
            # the step false-greens even when the publish reverted. Leave
            # publish_status=1 until an attempt actually succeeds above.
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::compose_hash publish failed (attempt $attempt/3); retrying in 20s"
              sleep 20
            fi
          done
          exit "$publish_status"

      # §2 attestation gate (test). Inert until BOTH repo vars are set:
      #   TEST_MAIN_ENCLAVE_URL            = https://<test-app-id>-5003s.dstack-pha-prod9.phala.network
      #   TEST_ENCLAVE_CONTENT_PK_BASELINE = <test enclave content pk, from a manual /attestation read>
      - name: Post-deploy attestation gate (test)
        env:
          ATTEST_BASE:  ${{ vars.TEST_MAIN_ENCLAVE_URL }}
          BASELINE_PK:  ${{ vars.TEST_ENCLAVE_CONTENT_PK_BASELINE }}
        run: ./deploy/attestation-gate.sh test attestation-test.json

      - name: Upload attestation snapshot (test)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attestation-test-${{ github.sha }}
          path: attestation-test.json
          retention-days: 90
          if-no-files-found: ignore

      # §3 post-deploy canary (test). Inert until TEST_MAIN_ENCLAVE_URL is set.
      - name: Post-deploy canary round-trip (test)
        if: ${{ vars.TEST_MAIN_ENCLAVE_URL != '' }}
        env:
          FEEDLING_API_URL:     ${{ vars.TEST_API_URL || 'https://test-api.feedling.app' }}
          FEEDLING_ENCLAVE_URL: ${{ vars.TEST_MAIN_ENCLAVE_URL }}
        run: |
          python3 -m pip install --quiet cryptography
          python3 tools/deploy_canary.py

  # =========================================================================
  # DEPLOY — standalone V1 agent-runner worker CVM (test)
  #
  # Deploys deploy/docker-compose.phala.runner.yaml to a separate Phala CVM
  # that runs only the V1 agent-runner supervisor. Dual-runtime coexistence
  # (2026-07-21 design, Task 11, post-review correction): the test environment
  # is V1-hosted TODAY (this compose has always been agent-runner form on
  # origin/test — the branch's earlier Runtime-V2-only migration work had
  # drifted it to a serve-worker-only shape without a live redeploy; restored
  # here byte-for-byte from origin/test alongside prod's runner, matching how
  # test/prod/pre now all default `FEEDLING_HOSTED_RUNTIME_POLICY=dual` with a
  # `resident` day-1 fence). Pooled Runtime V2 also runs on the main test CVM
  # itself as the serve-worker container (see docker-compose.phala.test.yaml).
  # It shares PostgreSQL + the runtime-token secret with the main CVM and reaches
  # the backend/enclave over their public/gateway paths.
  # =========================================================================
  deploy-test-runner-cvm:
    name: deploy runner CVM (test)
    needs: [deploy-test-cvm, detect-cvm-changes-test]
    if: |
      github.ref == 'refs/heads/test' &&
      github.event_name == 'push' &&
      needs.detect-cvm-changes-test.outputs.cvm == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-test-runner-cvm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.deploy-test-cvm.outputs.pinned_sha }}

      - name: Wait for ghcr.io agent-runner image :<sha>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"  # fixed 7-char slice; must match docker-publish.yml's COMMIT_SHORT (see CI #906)
          IMAGE_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${IMAGE_OWNER}/feedling-agent-runner"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          for i in $(seq 1 60); do
            if docker manifest inspect "${IMAGE}:$SHA_SHORT" >/dev/null 2>&1; then
              echo "agent-runner image :$SHA_SHORT available"
              exit 0
            fi
            sleep 10
          done
          echo "::error::agent-runner image :$SHA_SHORT did not appear in 10 min"
          exit 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install phala CLI
        run: npm install -g phala@1.1.19  # pinned (§8 supply-chain); bump deliberately

      - name: Resolve runner CVM_ID
        id: cvmid
        run: |
          CVM_ID=$(tr -d '[:space:]' < deploy/test-runner-cvm-id.txt)
          if [ -z "$CVM_ID" ]; then
            echo "::error::deploy/test-runner-cvm-id.txt is empty — provision the runner CVM first"
            exit 1
          fi
          echo "cvm_id=$CVM_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy runner CVM via phala
        env:
          PHALA_CLOUD_API_KEY:          ${{ secrets.TEST_PHALA_CLOUD_API_KEY }}
          CVM_ID:                       ${{ steps.cvmid.outputs.cvm_id }}
          # Cross-CVM reach to the main CVM (repo vars — public URLs, not secrets):
          #   TEST_MAIN_API_URL     = https://test-api.feedling.app
          #   TEST_MAIN_ENCLAVE_URL = https://<main-app-id>-5003s.dstack-pha-prod9.phala.network
          FEEDLING_API_URL:             ${{ vars.TEST_MAIN_API_URL }}
          FEEDLING_ENCLAVE_URL:         ${{ vars.TEST_MAIN_ENCLAVE_URL }}
          AGENT_MAX_CHILDREN:           ${{ vars.TEST_AGENT_MAX_CHILDREN }}
          # Shared with the main test CVM — MUST match (esp. the token secret).
          DATABASE_URL:                 ${{ secrets.TEST_DATABASE_URL }}
          FEEDLING_RUNTIME_TOKEN_SECRET: ${{ secrets.TEST_FEEDLING_RUNTIME_TOKEN_SECRET }}
          AGENT_RUNTIME_USERS:          ${{ secrets.TEST_AGENT_RUNTIME_USERS }}
          AGENT_RUNTIME_AUTODISCOVER:   ${{ vars.TEST_AGENT_RUNTIME_AUTODISCOVER }}
          FEEDLING_HOST_ALL:            ${{ vars.TEST_FEEDLING_HOST_ALL }}
          FEEDLING_MIGRATE_ENABLE:      ${{ vars.TEST_FEEDLING_MIGRATE_ENABLE }}
        run: |
          echo ">>> deploy-runner-cvm target: $CVM_ID"
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::TEST_DATABASE_URL not set — runner has no lease store"
            exit 1
          fi
          if [ -z "$FEEDLING_API_URL" ] || [ -z "$FEEDLING_ENCLAVE_URL" ]; then
            echo "::error::TEST_MAIN_API_URL / TEST_MAIN_ENCLAVE_URL not set — runner can't reach the main CVM"
            exit 1
          fi
          phala deploy \
            --api-token "$PHALA_CLOUD_API_KEY" \
            --cvm-id "$CVM_ID" \
            -c deploy/docker-compose.phala.runner.yaml \
            -e "FEEDLING_API_URL=$FEEDLING_API_URL" \
            -e "FEEDLING_ENCLAVE_URL=$FEEDLING_ENCLAVE_URL" \
            -e "AGENT_MAX_CHILDREN=$AGENT_MAX_CHILDREN" \
            -e "DATABASE_URL=$DATABASE_URL" \
            -e "FEEDLING_RUNTIME_TOKEN_SECRET=$FEEDLING_RUNTIME_TOKEN_SECRET" \
            -e "AGENT_RUNTIME_USERS=$AGENT_RUNTIME_USERS" \
            -e "AGENT_RUNTIME_AUTODISCOVER=$AGENT_RUNTIME_AUTODISCOVER" \
            -e "FEEDLING_HOST_ALL=$FEEDLING_HOST_ALL" \
            -e "FEEDLING_MIGRATE_ENABLE=$FEEDLING_MIGRATE_ENABLE"
          # NOT --wait: the CLI's readiness wait is hard-capped at 300s and the
          # runner image pull + boot regularly exceeds it. Poll with our own
          # configurable deadline instead (deploy/wait-cvm-ready.sh).
          ./deploy/wait-cvm-ready.sh "$CVM_ID" "${CVM_READY_TIMEOUT_SEC:-900}"

      - name: Publish live runner compose_hash on Sepolia (test contract)
        env:
          PRIVATE_KEY:                ${{ secrets.ETH_DEPLOYER_KEY }}
          ETH_SEPOLIA_RPC_URL:        ${{ vars.ETH_SEPOLIA_RPC_URL }}
          # The runner is a distinct dstack app → distinct compose_hash. Reuses the
          # same FeedlingAppAuth contract by default (addComposeHash is onlyOwner +
          # per-hash; the iOS audit card only checks the MAIN app's hashes, so the
          # runner hash is harmless there). Override with TEST_RUNNER_FEEDLING_APP_AUTH_CONTRACT.
          FEEDLING_APP_AUTH_CONTRACT: ${{ vars.TEST_RUNNER_FEEDLING_APP_AUTH_CONTRACT || vars.TEST_FEEDLING_APP_AUTH_CONTRACT }}
          FEEDLING_CVM_ID:            ${{ steps.cvmid.outputs.cvm_id }}
          PHALA_CLOUD_API_KEY:        ${{ secrets.TEST_PHALA_CLOUD_API_KEY }}
          FEEDLING_COMPOSE_FILE:      deploy/docker-compose.phala.runner.yaml
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml
          publish_status=1
          for attempt in 1 2 3; do
            if ./deploy/publish-compose-hash.sh eth_sepolia; then
              publish_status=0
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::runner compose_hash publish failed (attempt $attempt/3); retrying in 20s"
              sleep 20
            fi
          done
          exit "$publish_status"
      # No post-deploy Runtime V2 fleet gate here — this CVM runs the V1
      # agent-runner, which has no v2_worker_heartbeats identity to check.
      # The main test CVM's serve-worker liveness is proved separately by the
      # deploy-test-cvm job's post-deploy canary/attestation gates.

  deploy-pre-cvm:
    name: deploy CVM (pre)
    needs: [forge-test, python-tests, docker-build, docker-build-worker-deps, lint, dcap-python, detect-cvm-changes-pre, validate-pre-runtime-prerequisites]
    if: |
      github.ref == 'refs/heads/pre' &&
      github.event_name == 'push' &&
      needs.detect-cvm-changes-pre.outputs.cvm == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    concurrency:
      group: deploy-pre-cvm
