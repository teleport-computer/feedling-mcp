# Temporary T798 diagnostic: NEVER merge to test/pre/main.
name: T798 one CVM access diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact independently reviewed commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: t798-cvm-access-once
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'teleport-computer/feedling-mcp' &&
      github.ref == 'refs/heads/fix/t798-cvm-access-once' &&
      github.run_attempt == 1 && github.sha == inputs.expected_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One bounded metadata GET
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.TEST_PHALA_CLOUD_API_KEY }}
          EXPECTED_DIAGNOSTIC_SHA: ${{ inputs.expected_sha }}
        run: python3 tools/t798_cvm_access_once.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: t798-cvm-access-${{ github.run_id }}-${{ github.run_attempt }}
          path: t798-cvm-access.json
          if-no-files-found: error
          retention-days: 3
