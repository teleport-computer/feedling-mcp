name: recover-dream-churn

# Manually-dispatched runner for tools/recover_memory_dream_churn.py.
# Exists so database DSNs never leave GitHub secrets: the recovery script is
# operator-only, dry-run by default, double-confirmed for apply,
# and performs zero hard deletes (see tests/test_recover_memory_dream_churn.py).

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Target user id (usr_ + 16 hex)"
        required: true
        type: string
      apply:
        description: "Set to APPLY to actually write; anything else = dry-run"
        required: false
        default: "dry-run"
        type: string
      env:
        description: "test or prod"
        required: false
        default: "test"
        type: string
      since:
        description: "Optional inclusive ISO churn-window start (for example 2026-07-29)"
        required: false
        default: ""
        type: string
      retire_sources:
        description: "Comma-separated card sources to retire inside the window (default memory_dream)"
        required: false
        default: "memory_dream"
        type: string

permissions:
  contents: read

concurrency:
  group: recover-dream-churn
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psycopg
        run: pip install 'psycopg[binary]'
      - name: Run recovery (dry-run unless apply=APPLY)
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RECOVERY_SINCE: ${{ inputs.since }}
          RECOVERY_RETIRE_SOURCES: ${{ inputs.retire_sources }}
        run: |
          set -euo pipefail
          recovery_args=(
            --env "${{ inputs.env }}"
            --user-id "${{ inputs.user_id }}"
          )
          if [ -n "$RECOVERY_SINCE" ]; then
            recovery_args+=(--since "$RECOVERY_SINCE")
          fi
          IFS=',' read -ra retire_sources <<< "${RECOVERY_RETIRE_SOURCES:-memory_dream}"
          for retire_source in "${retire_sources[@]}"; do
            retire_source="$(echo "$retire_source" | xargs)"
            [ -n "$retire_source" ] && recovery_args+=(--retire-source "$retire_source")
          done
          if [ "${{ inputs.apply }}" = "APPLY" ]; then
            python3 tools/recover_memory_dream_churn.py "${recovery_args[@]}" \
              --apply --confirm-user-id "${{ inputs.user_id }}" \
              --confirm-churn-stopped
          else
            python3 tools/recover_memory_dream_churn.py "${recovery_args[@]}"
          fi
