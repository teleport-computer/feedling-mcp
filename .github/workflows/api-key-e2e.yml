name: Agentic API-key qualification (self-service)

on:
  workflow_dispatch:
    inputs:
      runtime_target:
        description: Test the current deployed runtime or require strict Hosted Runtime V2 proof
        required: true
        type: choice
        default: hosted_resident
        options:
          - deployed_current
          - hosted_resident
      persona_repetitions:
        description: Persona-memory depth (1 = developer smoke, 3 = release depth)
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "3"
  # The default-branch controller invokes the same trusted revision and passes
  # only the narrow repository-scoped synthetic-account credential. Provider,
  # Codex, and runner credentials remain Environment-scoped in this workflow.
  workflow_call:
    inputs:
      runtime_target:
        description: Runtime qualification target
        required: true
        type: string
      persona_repetitions:
        description: Persona-memory repetitions (1 or 3)
        required: false
        type: string
        default: "1"
    secrets:
      IO_E2E_ADMIN_TOKEN:
        description: Narrow credential accepted only by test /v1/admin/qa/* routes
        required: true

permissions:
  contents: read

concurrency:
  group: io-e2e-agent-driven-test
  cancel-in-progress: false

jobs:
  validate-dispatch:
    name: validate trusted default-branch controller
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject qualification from any untrusted controller ref
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REPOSITORY: ${{ github.repository }}
          PERSONA_REPETITIONS: ${{ inputs.persona_repetitions }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REPOSITORY" != "teleport-computer/feedling-mcp" ]; then
            echo "::error::qualification controller repository is not trusted"
            exit 1
          fi
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "::error::qualification must be dispatched from protected refs/heads/main; got $DISPATCH_REF"
            exit 1
          fi
          if [[ ! "$CONTROLLER_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::controller revision must be an immutable full Git SHA"
            exit 1
          fi
          if [ "$PERSONA_REPETITIONS" != "1" ] && [ "$PERSONA_REPETITIONS" != "3" ]; then
            echo "::error::persona_repetitions must be exactly 1 or 3"
            exit 1
          fi

  resolve-test-deployment:
    name: resolve deployed test SHA without secrets
    needs: validate-dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.deployment_target.outputs.sha }}
    steps:
      - name: Check out deployed test metadata without secrets
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: test
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current serialized test deployment target
        id: deployment_target
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          compose_file="deploy/docker-compose.phala.test.yaml"

          mapfile -t images < <(
            awk '$1 == "image:" && $2 ~ /^ghcr\.io\/.*\/feedling:/ { print $2 }' \
              "$compose_file"
          )
          if [ "${#images[@]}" -ne 2 ]; then
            echo "::error::test compose must contain exactly the enclave and backend Feedling images"
            exit 1
          fi

          image_owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          expected_prefix="ghcr.io/${image_owner}/feedling:"
          tags=()
          for image in "${images[@]}"; do
            if [[ "$image" != "${expected_prefix}"* ]]; then
              echo "::error::test compose Feedling image owner/repository is invalid"
              exit 1
            fi
            tag="${image#${expected_prefix}}"
            if [[ ! "$tag" =~ ^[a-f0-9]{7,64}$ ]]; then
              echo "::error::test compose Feedling image must use a hexadecimal Git tag"
              exit 1
            fi
            tags+=("$tag")
          done
          mapfile -t tags < <(printf '%s\n' "${tags[@]}" | sort -u)
          if [ "${#tags[@]}" -ne 1 ]; then
            echo "::error::test compose must pin every Feedling backend image to one Git tag"
            exit 1
          fi

          full_sha="$(git rev-parse --verify "${tags[0]}^{commit}")"
          test_head="$(git rev-parse --verify "HEAD^{commit}")"
          if [[ ! "$full_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::test compose image tag did not resolve to a full Git SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$full_sha" "$test_head"; then
            echo "::error::pinned test deployment SHA is not in current test history"
            exit 1
          fi
          echo "sha=$full_sha" >> "$GITHUB_OUTPUT"

  provision-aws-runner:
    name: provision disposable JIT AWS evaluator
    needs: [validate-dispatch, resolve-test-deployment]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: io-e2e-agent-driven-test
    permissions:
      contents: read
      id-token: write
    outputs:
      runner_group: ${{ steps.runner_identity.outputs.group }}
      runner_label: ${{ steps.runner_identity.outputs.label }}
      runner_name: ${{ steps.runner_identity.outputs.name }}
      runner_id: ${{ steps.jit_config.outputs.runner_id }}
      instance_id: ${{ steps.launch.outputs.instance_id }}
      expires_at: ${{ steps.launch.outputs.expires_at }}
    steps:
      - name: Check out immutable trusted runner controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted runner controller checkout
        env:
          CONTROLLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD)"
          if [ "$checked_out_sha" != "$CONTROLLER_SHA" ]; then
            echo "::error::runner controller checkout moved"
            exit 1
          fi

      - name: Derive unique one-job runner identity
        id: runner_identity
        env:
          RUNNER_GROUP_NAME: ${{ vars.QA_RUNNER_GROUP_NAME }}
        run: |
          set -euo pipefail
          if [[ ! "$RUNNER_GROUP_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "::error::runner group name is invalid"
            exit 1
          fi
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          runner_identity="io-e2e-agent-driven-test-${run_key}"
          echo "group=$RUNNER_GROUP_NAME" >> "$GITHUB_OUTPUT"
          echo "run_key=$run_key" >> "$GITHUB_OUTPUT"
          echo "name=$runner_identity" >> "$GITHUB_OUTPUT"
          echo "label=$runner_identity" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token for JIT registration
        id: github_app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.1
        with:
          app-id: ${{ vars.QA_RUNNER_GITHUB_APP_ID }}
          private-key: ${{ secrets.QA_RUNNER_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Generate private one-job runner configuration
        id: jit_config
        env:
          GH_APP_TOKEN: ${{ steps.github_app.outputs.token }}
          RUNNER_GROUP_ID: ${{ vars.QA_RUNNER_GROUP_ID }}
          RUNNER_GROUP_NAME: ${{ steps.runner_identity.outputs.group }}
          RUNNER_LABEL: ${{ steps.runner_identity.outputs.label }}
          RUNNER_NAME: ${{ steps.runner_identity.outputs.name }}
          RUN_KEY: ${{ steps.runner_identity.outputs.run_key }}
        run: |
          set -euo pipefail
          umask 077
          request_path="${RUNNER_TEMP}/io-e2e-jit-request-${RUN_KEY}.json"
          group_response_path="${RUNNER_TEMP}/io-e2e-runner-group-${RUN_KEY}.json"
          group_runners_prefix="${RUNNER_TEMP}/io-e2e-runner-group-members-${RUN_KEY}"
          response_path="${RUNNER_TEMP}/io-e2e-jit-response-${RUN_KEY}.json"
          jit_config_file="${RUNNER_TEMP}/io-e2e-jit-config-${RUN_KEY}"
          group_page_paths=()

          remove_group_pages() {
            if [ "${#group_page_paths[@]}" -gt 0 ]; then
              rm -f -- "${group_page_paths[@]}"
            fi
            group_page_paths=()
          }
          cleanup_jit_step() {
            remove_group_pages
            rm -f -- "$request_path" "$group_response_path" "$response_path" "$jit_config_file"
          }
          trap cleanup_jit_step EXIT

          python3 - "$request_path" <<'PY'
          import json
          import os
          import sys

          raw_group = os.environ.get("RUNNER_GROUP_ID", "")
          if not raw_group.isascii() or not raw_group.isdecimal():
              raise SystemExit("runner group id must be a positive integer")
          runner_group_id = int(raw_group)
          if runner_group_id <= 0:
              raise SystemExit("runner group id must be a positive integer")
          identity = os.environ["RUNNER_NAME"]
          label = os.environ["RUNNER_LABEL"]
          if identity != label or not identity.startswith("io-e2e-agent-driven-test-"):
              raise SystemExit("runner identity is invalid")
          payload = {
              "name": identity,
              "runner_group_id": runner_group_id,
              "labels": ["self-hosted", "linux", "x64", "io-e2e-agent-driven-test", label],
              "work_folder": "_work",
          }
          path = sys.argv[1]
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, separators=(",", ":"), sort_keys=True)
              handle.write("\n")
          PY

          curl --fail --silent --show-error \
            --proto '=https' \
            --connect-timeout 5 \
            --max-time 20 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_APP_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$group_response_path" \
            "https://api.github.com/orgs/${GITHUB_REPOSITORY_OWNER}/actions/runner-groups/${RUNNER_GROUP_ID}"
          python3 - "$group_response_path" <<'PY'
          import json
          import os
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  group = json.load(handle)
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit("GitHub returned an invalid runner group response") from exc
          if not isinstance(group, dict):
              raise SystemExit("GitHub returned an invalid runner group response")
          expected_id = int(os.environ["RUNNER_GROUP_ID"])
          expected_name = os.environ["RUNNER_GROUP_NAME"]
          if group.get("id") != expected_id or group.get("name") != expected_name:
              raise SystemExit("runner group id and name do not identify the same group")
          if group.get("default") is not False:
              raise SystemExit("qualification runners require a dedicated non-default group")
          if group.get("allows_public_repositories") is not False:
              raise SystemExit("qualification runner group must deny public repositories")
          if group.get("restricted_to_workflows") is not True:
              raise SystemExit("qualification runner group must restrict selected workflows")
          selected_workflows = group.get("selected_workflows")
          expected_workflow = (
              f"{os.environ['GITHUB_REPOSITORY']}/.github/workflows/"
              "api-key-e2e.yml@refs/heads/main"
          )
          if (
              not isinstance(selected_workflows, list)
              or any(not isinstance(item, str) for item in selected_workflows)
              or selected_workflows != [expected_workflow]
          ):
              raise SystemExit(
                  "qualification runner group must select only the protected main workflow"
              )
          PY

          curl --fail --silent --show-error \
            --request POST \
            --proto '=https' \
            --connect-timeout 5 \
            --max-time 30 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_APP_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@${request_path}" \
            --output "$response_path" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/generate-jitconfig"

          runner_id="$(python3 - "$response_path" "$jit_config_file" <<'PY'
          import json
          import os
          import re
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  response = json.load(handle)
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit("GitHub returned an invalid JIT response") from exc
          if not isinstance(response, dict):
              raise SystemExit("GitHub returned an invalid JIT response")
          encoded = response.get("encoded_jit_config")
          runner = response.get("runner")
          if (
              not isinstance(encoded, str)
              or not 1 <= len(encoded) <= 65536
              or re.fullmatch(r"[A-Za-z0-9_+/=-]+", encoded) is None
          ):
              raise SystemExit("GitHub returned an invalid JIT configuration")
          if not isinstance(runner, dict):
              raise SystemExit("GitHub returned an invalid JIT runner")
          runner_id = runner.get("id")
          if (
              not isinstance(runner_id, int)
              or isinstance(runner_id, bool)
              or runner_id <= 0
              or runner.get("name") != os.environ["RUNNER_NAME"]
          ):
              raise SystemExit("GitHub returned an invalid JIT runner")
          labels = runner.get("labels")
          if not isinstance(labels, list) or any(not isinstance(item, dict) for item in labels):
              raise SystemExit("GitHub returned invalid JIT runner labels")
          if os.environ["RUNNER_LABEL"] not in {item.get("name") for item in labels}:
              raise SystemExit("GitHub JIT runner is missing its unique label")
          descriptor = os.open(sys.argv[2], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="ascii") as handle:
              handle.write(encoded)
          print(runner_id)
          PY
          )"
          if ! [[ "$runner_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GitHub returned an invalid JIT runner id"
            exit 1
          fi
          # Persist the exact returned id before the eventually-consistent
          # group-membership read. Downstream cleanup can then delete this
          # registration even if the proof below never becomes visible.
          echo "runner_id=$runner_id" >> "$GITHUB_OUTPUT"

          runner_bound=false
          membership_attempts=12
          for ((attempt = 1; attempt <= membership_attempts; attempt++)); do
            remove_group_pages
            first_page_path="${group_runners_prefix}-attempt-${attempt}-page-1.json"
            group_page_paths+=("$first_page_path")
            pagination=""
            if curl --fail --silent --show-error \
              --proto '=https' \
              --connect-timeout 5 \
              --max-time 20 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_APP_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$first_page_path" \
              "https://api.github.com/orgs/${GITHUB_REPOSITORY_OWNER}/actions/runner-groups/${RUNNER_GROUP_ID}/runners?per_page=100&page=1"
            then
              pagination="$(python3 - "$first_page_path" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit("GitHub returned an invalid runner-group membership response") from exc
          if not isinstance(payload, dict):
              raise SystemExit("GitHub returned an invalid runner-group membership response")
          runners = payload.get("runners")
          total_count = payload.get("total_count")
          if (
              not isinstance(total_count, int)
              or isinstance(total_count, bool)
              or total_count < 0
              or not isinstance(runners, list)
              or any(not isinstance(item, dict) for item in runners)
              or len(runners) > 100
              or len(runners) > total_count
          ):
              raise SystemExit("GitHub returned an invalid runner-group membership response")
          page_count = max(1, (total_count + 99) // 100)
          # This remains a bounded control-plane proof while supporting normal
          # GitHub pagination well beyond the first page.
          if page_count > 100:
              raise SystemExit("runner group is too large to verify safely")
          print(total_count, page_count)
          PY
              )" || pagination=""
            fi

            snapshot_complete=false
            if [[ "$pagination" =~ ^([0-9]+)[[:space:]]+([1-9][0-9]*)$ ]]; then
              total_count="${BASH_REMATCH[1]}"
              page_count="${BASH_REMATCH[2]}"
              snapshot_complete=true
              for ((page = 2; page <= page_count; page++)); do
                page_path="${group_runners_prefix}-attempt-${attempt}-page-${page}.json"
                group_page_paths+=("$page_path")
                if ! curl --fail --silent --show-error \
                  --proto '=https' \
                  --connect-timeout 5 \
                  --max-time 20 \
                  --header "Accept: application/vnd.github+json" \
                  --header "Authorization: Bearer ${GH_APP_TOKEN}" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  --output "$page_path" \
                  "https://api.github.com/orgs/${GITHUB_REPOSITORY_OWNER}/actions/runner-groups/${RUNNER_GROUP_ID}/runners?per_page=100&page=${page}"
                then
                  snapshot_complete=false
                  break
                fi
              done
            fi

            if [ "$snapshot_complete" = true ] && \
              python3 - "$runner_id" "$total_count" "${group_page_paths[@]}" <<'PY'
          import json
          import os
          import sys

          expected_id = int(sys.argv[1])
          expected_total = int(sys.argv[2])
          paths = sys.argv[3:]
          expected_pages = max(1, (expected_total + 99) // 100)
          if len(paths) != expected_pages:
              raise SystemExit("GitHub returned an incomplete runner-group membership snapshot")

          all_runners = []
          for path in paths:
              try:
                  with open(path, encoding="utf-8") as handle:
                      payload = json.load(handle)
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  raise SystemExit(
                      "GitHub returned an invalid runner-group membership response"
                  ) from exc
              if not isinstance(payload, dict):
                  raise SystemExit("GitHub returned an invalid runner-group membership response")
              runners = payload.get("runners")
              total_count = payload.get("total_count")
              if (
                  not isinstance(total_count, int)
                  or isinstance(total_count, bool)
                  or total_count != expected_total
                  or not isinstance(runners, list)
                  or len(runners) > 100
                  or any(not isinstance(item, dict) for item in runners)
              ):
                  raise SystemExit("GitHub returned an invalid runner-group membership response")
              all_runners.extend(runners)

          if len(all_runners) != expected_total:
              raise SystemExit("GitHub returned an incomplete runner-group membership snapshot")
          runner_ids = [item.get("id") for item in all_runners]
          if (
              any(
                  not isinstance(item, int) or isinstance(item, bool) or item <= 0
                  for item in runner_ids
              )
              or len(set(runner_ids)) != len(runner_ids)
          ):
              raise SystemExit("GitHub returned invalid runner ids in the dedicated group")
          matches = [item for item in all_runners if item.get("id") == expected_id]
          if len(matches) != 1:
              raise SystemExit("JIT runner is not present in the dedicated runner group")
          runner = matches[0]
          if runner.get("name") != os.environ["RUNNER_NAME"]:
              raise SystemExit("JIT runner group membership has the wrong name")
          labels = runner.get("labels")
          if not isinstance(labels, list) or any(not isinstance(item, dict) for item in labels):
              raise SystemExit("JIT runner group membership has invalid labels")
          if os.environ["RUNNER_LABEL"] not in {item.get("name") for item in labels}:
              raise SystemExit("JIT runner group membership is missing its unique label")
          PY
            then
              runner_bound=true
              remove_group_pages
              break
            fi
            remove_group_pages
            if [ "$attempt" -lt "$membership_attempts" ]; then
              backoff=$((1 << (attempt - 1)))
              if [ "$backoff" -gt 10 ]; then
                backoff=10
              fi
              sleep "$backoff"
            fi
          done
          if [ "$runner_bound" != true ]; then
            echo "::error::GitHub JIT runner was not bound to the dedicated runner group"
            exit 1
          fi

          chmod 600 "$jit_config_file"
          echo "jit_config_file=$jit_config_file" >> "$GITHUB_OUTPUT"
          rm -f -- "$request_path" "$group_response_path" "$response_path"
          trap - EXIT

      - name: Configure short-lived AWS credentials for provisioning
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.0
        with:
          role-to-assume: ${{ vars.QA_AWS_ROLE_ARN }}
          aws-region: ${{ vars.QA_AWS_REGION }}
          role-session-name: io-e2e-agent-driven-test-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          mask-aws-account-id: true

      - name: Launch disposable AWS evaluator
        id: launch
        env:
          AWS_REGION: ${{ vars.QA_AWS_REGION }}
          QA_AWS_AMI_ID: ${{ vars.QA_AWS_AMI_ID }}
          QA_AWS_SUBNET_ID: ${{ vars.QA_AWS_SUBNET_ID }}
          QA_AWS_SECURITY_GROUP_ID: ${{ vars.QA_AWS_SECURITY_GROUP_ID }}
          CONTROLLER_SHA: ${{ github.sha }}
          TARGET_SHA: ${{ needs.resolve-test-deployment.outputs.sha }}
          JIT_CONFIG_FILE: ${{ steps.jit_config.outputs.jit_config_file }}
        run: |
          set -euo pipefail
          python3 qa/aws/launch.py \
            --region "$AWS_REGION" \
            --ami-id "$QA_AWS_AMI_ID" \
            --subnet-id "$QA_AWS_SUBNET_ID" \
            --security-group-id "$QA_AWS_SECURITY_GROUP_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --target-sha "$TARGET_SHA" \
            --controller-sha "$CONTROLLER_SHA" \
            --jit-config-file "$JIT_CONFIG_FILE" \
            --ttl-seconds 21600 \
            --github-output "$GITHUB_OUTPUT"
          rm -f -- "$JIT_CONFIG_FILE"

      - name: Wait for exact JIT evaluator to become ready
        id: runner_ready
        env:
          AWS_REGION: ${{ vars.QA_AWS_REGION }}
          GH_APP_TOKEN: ${{ steps.github_app.outputs.token }}
          INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
          RUNNER_ID: ${{ steps.jit_config.outputs.runner_id }}
          RUNNER_LABEL: ${{ steps.runner_identity.outputs.label }}
          RUNNER_NAME: ${{ steps.runner_identity.outputs.name }}
          RUN_KEY: ${{ steps.runner_identity.outputs.run_key }}
        run: |
          set -euo pipefail
          response_path="${RUNNER_TEMP}/io-e2e-runner-status-${RUN_KEY}.json"
          trap 'rm -f -- "$response_path"' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            rm -f -- "$response_path"
            if curl --fail --silent --show-error \
              --proto '=https' \
              --connect-timeout 5 \
              --max-time 20 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_APP_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$response_path" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/${RUNNER_ID}"
            then
              state="$(python3 - "$response_path" <<'PY'
          import json
          import os
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  response = json.load(handle)
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit("GitHub returned an invalid runner response") from exc
          if not isinstance(response, dict):
              raise SystemExit("GitHub returned an invalid runner response")
          expected_name = os.environ["RUNNER_NAME"]
          expected_id = int(os.environ["RUNNER_ID"])
          runner = response
          if runner.get("id") != expected_id or runner.get("name") != expected_name:
              raise SystemExit("GitHub returned the wrong exact runner")
          labels = runner.get("labels")
          if not isinstance(labels, list) or any(not isinstance(item, dict) for item in labels):
              raise SystemExit("GitHub returned invalid runner labels")
          label_names = {item.get("name") for item in labels}
          if os.environ["RUNNER_LABEL"] not in label_names:
              raise SystemExit("exact-name runner is missing its unique label")
          if runner.get("status") == "online" and runner.get("busy") is False:
              print("ready")
          else:
              print("waiting")
          PY
              )"
              if [ "$state" = "ready" ]; then
                ready=1
                break
              fi
            fi
            sleep 10
          done
          rm -f -- "$response_path"
          if [ "$ready" -ne 1 ]; then
            args=(
              --region "$AWS_REGION"
              --repository "$GITHUB_REPOSITORY"
              --run-id "$GITHUB_RUN_ID"
              --run-attempt "$GITHUB_RUN_ATTEMPT"
            )
            if [ -n "$INSTANCE_ID" ]; then
              args+=(--instance-id "$INSTANCE_ID")
            fi
            python3 qa/aws/terminate.py "${args[@]}"
            echo "::error::JIT evaluator did not become ready before the deadline"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Remove local JIT configuration
        id: jit_cleanup
        if: always()
        env:
          JIT_CONFIG_FILE: ${{ steps.jit_config.outputs.jit_config_file }}
          RUN_KEY: ${{ steps.runner_identity.outputs.run_key }}
        run: |
          set -euo pipefail
          expected="${RUNNER_TEMP}/io-e2e-jit-config-${RUN_KEY}"
          if [ -n "$JIT_CONFIG_FILE" ] && [ "$JIT_CONFIG_FILE" != "$expected" ]; then
            echo "::error::refusing unexpected JIT cleanup path"
            exit 1
          fi
          rm -f -- "$expected"

      - name: Roll back failed AWS provisioning attempt
        if: ${{ always() && (steps.launch.outcome == 'failure' || steps.launch.outcome == 'cancelled' || steps.runner_ready.outcome == 'failure' || steps.runner_ready.outcome == 'cancelled' || steps.jit_cleanup.outcome == 'failure') }}
        env:
          AWS_REGION: ${{ vars.QA_AWS_REGION }}
          INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
        run: |
          set -euo pipefail
          args=(
            --region "$AWS_REGION"
            --repository "$GITHUB_REPOSITORY"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          )
          if [ -n "$INSTANCE_ID" ]; then
            args+=(--instance-id "$INSTANCE_ID")
          fi
          python3 qa/aws/terminate.py "${args[@]}"

  qualify-api-key-runtime:
    name: qualify eight API-key profiles
    needs: [validate-dispatch, resolve-test-deployment, provision-aws-runner]
    environment: io-e2e-agent-driven-test
    runs-on:
      group: ${{ needs.provision-aws-runner.outputs.runner_group }}
      labels: ${{ needs.provision-aws-runner.outputs.runner_label }}
    timeout-minutes: 330

    steps:
      - name: Check out immutable trusted controller revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Candidate/deployed code is metadata only. Secret-bearing steps run
          # exclusively from the immutable controller revision that GitHub
          # selected before the dispatch started.
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable trusted controller checkout
        env:
          CONTROLLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD)"
          if [ "$checked_out_sha" != "$CONTROLLER_SHA" ]; then
            echo "::error::controller checkout moved: expected $CONTROLLER_SHA, got $checked_out_sha"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qa/requirements.lock

      - name: Install hash-locked qualification dependencies
        run: python -m pip install --require-hashes -r qa/requirements.lock

      - name: Verify Codex authoring schema projection
        run: python qa/codex_output_schema.py --check

      - name: Prepare isolated run directories
        id: context
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ needs.resolve-test-deployment.outputs.sha }}
          PERSONA_REPETITIONS: ${{ inputs.persona_repetitions }}
        run: |
          set -euo pipefail

          run_id="api-key-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          private_root="${RUNNER_TEMP}/${run_id}-private"
          artifact_dir="${GITHUB_WORKSPACE}/qualification-artifacts/${run_id}"
          manifest="${private_root}/profiles.json"
          profile_manifest_dir="${private_root}/profile-manifests"
          memory_manifest="${profile_manifest_dir}/memory-contract.json"
          memory_receipt="${artifact_dir}/memory-contract.json"
          worker_root="${private_root}/workers"
          worker_output_root="${private_root}/worker-raw"
          aggregation_input_root="${private_root}/aggregation-inputs"
          supervisor_home="${private_root}/supervisor-home"
          supervisor_tmp="${private_root}/supervisor-tmp"
          supervisor_work="${private_root}/supervisor-work"
          persona_judge_root="${private_root}/persona-judge"
          persona_judge_scratch_root="${private_root}/persona-judge-scratch"
          persona_import_work="${private_root}/persona-import-work"
          persona_pool_manifest="${private_root}/persona-account-pool.json"
          persona_readiness_receipt="${private_root}/persona-readiness.json"
          persona_import_pre_receipt="${private_root}/persona-import-deployment-pre.json"
          persona_import_post_receipt="${private_root}/persona-import-deployment-post.json"
          persona_run_pre_receipt="${private_root}/persona-run-deployment-pre.json"
          persona_run_post_receipt="${private_root}/persona-run-deployment-post.json"
          persona_result="${private_root}/persona-result.json"
          persona_cleanup_receipt="${private_root}/persona-cleanup-receipt.json"
          persona_arm_receipt="${private_root}/persona-arm-receipt.json"
          codex_home="${private_root}/codex-home"
          orchestration_receipt="${private_root}/orchestration-receipt.json"
          private_result="${private_root}/agent-run-result.json"
          pre_deployment_receipt="${private_root}/deployment-receipt-pre.json"
          post_deployment_receipt="${private_root}/deployment-receipt-post.json"

          umask 077
          mkdir -m 700 "$private_root"
          mkdir -m 700 \
            "${private_root}/raw-codex" \
            "$profile_manifest_dir" \
            "$worker_root" \
            "$worker_output_root" \
            "$aggregation_input_root" \
            "$supervisor_home" \
            "$supervisor_tmp" \
            "$supervisor_work" \
            "$persona_judge_root" \
            "${persona_judge_root}/home" \
            "${persona_judge_root}/tmp" \
            "${persona_judge_root}/work" \
            "$persona_judge_scratch_root" \
            "$persona_import_work" \
            "$codex_home"
          for agent_type in \
            profile_official_deepseek \
            profile_official_anthropic \
            profile_official_openai \
            profile_official_gemini \
            profile_openrouter_claude \
            profile_openrouter_openai \
            profile_openrouter_glm \
            profile_relay_kongbeiqie
          do
            mkdir -m 700 "${worker_root}/${agent_type}"
            mkdir -m 700 \
              "${worker_root}/${agent_type}/home" \
              "${worker_root}/${agent_type}/tmp" \
              "${worker_root}/${agent_type}/work"
          done
          mkdir -m 700 "$artifact_dir"

          {
            echo "run_id=$run_id"
            echo "private_root=$private_root"
            echo "manifest=$manifest"
            echo "profile_manifest_dir=$profile_manifest_dir"
            echo "memory_manifest=$memory_manifest"
            echo "memory_receipt=$memory_receipt"
            echo "worker_root=$worker_root"
            echo "worker_output_root=$worker_output_root"
            echo "aggregation_input_root=$aggregation_input_root"
            echo "supervisor_home=$supervisor_home"
            echo "supervisor_tmp=$supervisor_tmp"
            echo "supervisor_work=$supervisor_work"
            echo "persona_judge_root=$persona_judge_root"
            echo "persona_judge_scratch_root=$persona_judge_scratch_root"
            echo "persona_import_work=$persona_import_work"
            echo "persona_pool_manifest=$persona_pool_manifest"
            echo "persona_readiness_receipt=$persona_readiness_receipt"
            echo "persona_import_pre_receipt=$persona_import_pre_receipt"
            echo "persona_import_post_receipt=$persona_import_post_receipt"
            echo "persona_run_pre_receipt=$persona_run_pre_receipt"
            echo "persona_run_post_receipt=$persona_run_post_receipt"
            echo "persona_result=$persona_result"
            echo "persona_cleanup_receipt=$persona_cleanup_receipt"
            echo "persona_arm_receipt=$persona_arm_receipt"
            echo "persona_repetitions=$PERSONA_REPETITIONS"
            echo "codex_home=$codex_home"
            echo "orchestration_receipt=$orchestration_receipt"
            echo "private_result=$private_result"
            echo "pre_deployment_receipt=$pre_deployment_receipt"
            echo "post_deployment_receipt=$post_deployment_receipt"
            echo "artifact_dir=$artifact_dir"
            echo "expected_sha=$EXPECTED_DEPLOYMENT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Verify deployed endpoint and selected runtime target before qualification
        id: deployment_pre
        env:
          IO_E2E_BASE_URL: https://test-api.feedling.app
          IO_E2E_ADMIN_TOKEN: ${{ secrets.IO_E2E_ADMIN_TOKEN }}
          QA_EXPECTED_DEPLOYMENT_SHA: ${{ steps.context.outputs.expected_sha }}
          QA_EXPECTED_RUNTIME: ${{ inputs.runtime_target }}
        run: |
          set -euo pipefail
          umask 077
          python qa/verify_deployment.py \
            --expected-sha "$QA_EXPECTED_DEPLOYMENT_SHA" \
            --expected-runtime "$QA_EXPECTED_RUNTIME" \
            --receipt "${{ steps.context.outputs.pre_deployment_receipt }}"

      - name: Install and verify isolated headless Codex runtime
        id: codex_preflight
        env:
          QA_PRIVATE_ROOT: ${{ steps.context.outputs.private_root }}
          QA_ARTIFACT_DIR: ${{ steps.context.outputs.artifact_dir }}
          QA_MANIFEST: ${{ steps.context.outputs.manifest }}
          QA_PROFILE_MANIFEST_DIR: ${{ steps.context.outputs.profile_manifest_dir }}
          QA_MEMORY_MANIFEST: ${{ steps.context.outputs.memory_manifest }}
          QA_WORKER_ROOT: ${{ steps.context.outputs.worker_root }}
          QA_WORKER_OUTPUT_ROOT: ${{ steps.context.outputs.worker_output_root }}
          QA_AGGREGATION_INPUT_ROOT: ${{ steps.context.outputs.aggregation_input_root }}
          QA_SUPERVISOR_HOME: ${{ steps.context.outputs.supervisor_home }}
          QA_SUPERVISOR_TMP: ${{ steps.context.outputs.supervisor_tmp }}
          QA_SUPERVISOR_WORK: ${{ steps.context.outputs.supervisor_work }}
          QA_PERSONA_JUDGE_ROOT: ${{ steps.context.outputs.persona_judge_root }}
          QA_PERSONA_JUDGE_SCRATCH_ROOT: ${{ steps.context.outputs.persona_judge_scratch_root }}
          QA_CODEX_HOME: ${{ steps.context.outputs.codex_home }}
          QA_ORCHESTRATION_RECEIPT: ${{ steps.context.outputs.orchestration_receipt }}
          QA_CODEX_MODEL: ${{ vars.QA_CODEX_MODEL }}
          QA_CODEX_AUTH_JSON_B64: ${{ secrets.QA_CODEX_AUTH_JSON_B64 }}
        run: |
          set -euo pipefail
          umask 077
          codex_bin="$(command -v codex || true)"
          if [ -z "$codex_bin" ] || [ ! -x "$codex_bin" ]; then
            echo "::error::Codex CLI is not installed on the trusted E2E runner"
            exit 1
          fi
          if [ -f "$HOME/.codex/auth.json" ]; then
            echo "::error::persistent Codex auth is forbidden on the E2E runner"
            exit 1
          fi
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::the trusted E2E runner must run as an unprivileged user"
            exit 1
          fi
          if [ "$($codex_bin --version)" != "codex-cli 0.144.3" ]; then
            echo "::error::trusted E2E runner must pin codex-cli 0.144.3"
            exit 1
          fi
          if [ -z "$QA_CODEX_AUTH_JSON_B64" ]; then
            echo "::error::QA_CODEX_AUTH_JSON_B64 is required"
            exit 1
          fi
          if [ -z "$QA_CODEX_MODEL" ]; then
            echo "::error::QA_CODEX_MODEL is required"
            exit 1
          fi

          # Validate the setup-python runtime boundary before decoding any
          # long-lived OAuth material or provisioning a synthetic account.
          python_prefix="$(python -c 'import pathlib, sys; print(pathlib.Path(sys.prefix).resolve())')"
          python_base_prefix="$(python -c 'import pathlib, sys; print(pathlib.Path(sys.base_prefix).resolve())')"
          python_executable="$(python -c 'import pathlib, sys; print(pathlib.Path(sys.executable).resolve())')"
          python qa/write_codex_config.py \
            --output "$QA_CODEX_HOME/config.toml" \
            --source-root "$GITHUB_WORKSPACE" \
            --artifact-root "$QA_ARTIFACT_DIR" \
            --full-manifest "$QA_MANIFEST" \
            --profile-manifest-dir "$QA_PROFILE_MANIFEST_DIR" \
            --supervisor-home "$QA_SUPERVISOR_HOME" \
            --supervisor-tmp "$QA_SUPERVISOR_TMP" \
            --supervisor-work "$QA_SUPERVISOR_WORK" \
            --persona-judge-root "$QA_PERSONA_JUDGE_ROOT" \
            --persona-judge-scratch-root "$QA_PERSONA_JUDGE_SCRATCH_ROOT" \
            --worker-root "$QA_WORKER_ROOT" \
            --worker-output-root "$QA_WORKER_OUTPUT_ROOT" \
            --aggregation-input-root "$QA_AGGREGATION_INPUT_ROOT" \
            --orchestration-receipt "$QA_ORCHESTRATION_RECEIPT" \
            --codex-model "$QA_CODEX_MODEL" \
            --allowed-host test-api.feedling.app \
            --worker-python "$python_executable" \
            --qualification-mode release \
            --runtime-read-root "$python_prefix" \
            --runtime-read-root "$python_base_prefix"

          python - \
            "$QA_CODEX_HOME/config.toml" \
            "$QA_CODEX_HOME/persona_memory_judge.config.toml" <<'PY'
          import os
          import stat
          import sys
          from pathlib import Path

          for raw in sys.argv[1:]:
              path = Path(raw)
              metadata = path.lstat()
              if (
                  not stat.S_ISREG(metadata.st_mode)
                  or metadata.st_uid != os.geteuid()
                  or metadata.st_nlink != 1
                  or stat.S_IMODE(metadata.st_mode) != 0o600
              ):
                  raise SystemExit("Codex strict configuration file is unsafe")
          PY

          printf '%s' "$QA_CODEX_AUTH_JSON_B64" | \
            python qa/install_codex_auth.py --codex-home "$QA_CODEX_HOME"
          unset QA_CODEX_AUTH_JSON_B64

          env -i \
            HOME="$QA_SUPERVISOR_HOME" \
            PATH="$PATH" \
            CODEX_HOME="$QA_CODEX_HOME" \
            LANG="C.UTF-8" \
            TMPDIR="$QA_SUPERVISOR_TMP" \
            "$codex_bin" login status > "${QA_PRIVATE_ROOT}/codex-login-status.txt"
          "$codex_bin" exec --help > "${QA_PRIVATE_ROOT}/codex-exec-help.txt"
          "$codex_bin" sandbox --help > "${QA_PRIVATE_ROOT}/codex-sandbox-help.txt"
          grep -q -- "--output-schema" "${QA_PRIVATE_ROOT}/codex-exec-help.txt"
          grep -q -- "--strict-config" "${QA_PRIVATE_ROOT}/codex-exec-help.txt"
          grep -q -- "--permission-profile" "${QA_PRIVATE_ROOT}/codex-sandbox-help.txt"

          mcp_servers="$(cd "$QA_SUPERVISOR_WORK" && env -i \
            HOME="$QA_SUPERVISOR_HOME" \
            PATH="$PATH" \
            CODEX_HOME="$QA_CODEX_HOME" \
            "$codex_bin" mcp list --json)"
          MCP_SERVERS="$mcp_servers" python - <<'PY'
          import json
          import os

          if json.loads(os.environ["MCP_SERVERS"]) != []:
              raise SystemExit("unexpected MCP server configured for qualification")
          PY

          # Deterministic sandbox probes validate the actual permission profile.
          worker_tmp="${QA_WORKER_ROOT}/profile_official_deepseek/tmp"
          worker_work="${QA_WORKER_ROOT}/profile_official_deepseek/work"
          env -i \
            HOME="${QA_WORKER_ROOT}/profile_official_deepseek/home" \
            PATH="$PATH" \
            CODEX_HOME="$QA_CODEX_HOME" \
            LANG="C.UTF-8" \
            TMPDIR="$worker_tmp" \
            "$codex_bin" sandbox -p profile_official_deepseek \
              -P io-e2e-agent-driven-test-official-deepseek \
              --include-managed-config -C "$worker_work" -- \
              /bin/sh -eu -c '
                test -r "$1"
                printf "tmp\n" > "$2"
                rm -f "$2"
                printf "work\n" > "$3"
                rm -f "$3"
                for denied in "$4" "$5" "$6" "$7" "$8" "$9" "${10}"; do
                  test ! -r "$denied"
                done
                if printf "forbidden\n" > "${11}" 2>/dev/null; then
                  rm -f "${11}"
                  exit 1
                fi
              ' sh \
              "$GITHUB_WORKSPACE/qa/SOP.md" \
              "${worker_tmp}/.preflight" \
              "${worker_work}/.preflight" \
              "$QA_MANIFEST" \
              "$QA_WORKER_OUTPUT_ROOT" \
              "$QA_AGGREGATION_INPUT_ROOT" \
              "$QA_ORCHESTRATION_RECEIPT" \
              "$QA_SUPERVISOR_HOME" \
              "$QA_MEMORY_MANIFEST" \
              "$QA_CODEX_HOME/auth.json" \
              "$QA_ARTIFACT_DIR/.sandbox-write-must-fail"

          env -i \
            HOME="${QA_WORKER_ROOT}/profile_official_deepseek/home" \
            PATH="$PATH" \
            CODEX_HOME="$QA_CODEX_HOME" \
            LANG="C.UTF-8" \
            TMPDIR="$worker_tmp" \
            "$codex_bin" sandbox -p profile_official_deepseek \
              -P io-e2e-agent-driven-test-official-deepseek \
              --include-managed-config -C "$worker_work" -- \
              /bin/sh -eu -c '
                command -v curl >/dev/null 2>&1
                if curl --silent --show-error --proto "=https" \
                  --max-redirs 0 --connect-timeout 5 --max-time 10 \
                  --output /dev/null https://test-api.feedling.app/; then
                  exit 1
                fi
                if curl --silent --show-error --proto "=https" \
                  --max-redirs 0 --connect-timeout 5 --max-time 10 \
                  --output /dev/null https://example.com/; then
                  exit 1
                fi
                if curl --noproxy "*" --insecure --silent --show-error \
                  --proto "=https" --max-redirs 0 --connect-timeout 5 --max-time 10 \
                  --output /dev/null https://1.1.1.1/; then
                  exit 1
                fi
              '

          # Prove the fixed interpreter survives the named profile's real shell
          # policy and can import the deterministic COT probe before any account
          # or provider credential is created.
          env -i \
            HOME="${QA_WORKER_ROOT}/profile_official_deepseek/home" \
            PATH="$PATH" \
            CODEX_HOME="$QA_CODEX_HOME" \
            LANG="C.UTF-8" \
            TMPDIR="$worker_tmp" \
            "$codex_bin" sandbox -p profile_official_deepseek \
              -P io-e2e-agent-driven-test-official-deepseek \
              --include-managed-config -C "$worker_work" -- \
              /bin/sh -eu -c '
                test "$QA_PYTHON_BIN" = "$1"
                test "$QA_QUALIFICATION_MODE" = "release"
                exec "$QA_PYTHON_BIN" -I -B "$2" --help
              ' feedling-worker-runtime-preflight \
              "$python_executable" \
              "$GITHUB_WORKSPACE/qa/cot_delivery_probe.py"

          # One real top-level profile run proves OAuth, strict config, profile
          # selection, and Structured Outputs before provider keys are touched.
          preflight_schema="${QA_PRIVATE_ROOT}/preflight-schema.json"
          preflight_result="${QA_PRIVATE_ROOT}/preflight-result.json"
          preflight_events="${QA_PRIVATE_ROOT}/raw-codex/preflight-events.jsonl"
          preflight_stderr="${QA_PRIVATE_ROOT}/raw-codex/preflight-stderr.log"
          python - <<'PY' "$preflight_schema"
          import json
          import os
          import sys

          schema = {
              "type": "object",
              "additionalProperties": False,
              "required": ["ok", "profile_id"],
              "properties": {
                  "ok": {"type": "boolean", "enum": [True]},
                  "profile_id": {"type": "string", "enum": ["official-deepseek"]},
              },
          }
          path = sys.argv[1]
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
              json.dump(schema, handle, separators=(",", ":"))
              handle.write("\n")
          PY
          env -i \
            HOME="${QA_WORKER_ROOT}/profile_official_deepseek/home" \
            PATH="$PATH" \
            CODEX_HOME="$QA_CODEX_HOME" \
            LANG="C.UTF-8" \
            TMPDIR="$worker_tmp" \
            "$codex_bin" exec \
              -p profile_official_deepseek \
              -c 'default_permissions="io-e2e-agent-driven-test-official-deepseek"' \
              --ignore-rules \
              --strict-config \
              --skip-git-repo-check \
              --cd "$worker_work" \
              --output-schema "$preflight_schema" \
              --output-last-message "$preflight_result" \
              --color never \
              --json \
              'Return only {"ok":true,"profile_id":"official-deepseek"}. Do not call any tool.' \
              > "$preflight_events" 2> "$preflight_stderr"
          python - <<'PY' "$preflight_result" "$preflight_events"
          import json
          import sys
          from pathlib import Path

          from qa.verify_codex_orchestration import parse_exec_events

          result_path, events_path = map(Path, sys.argv[1:])
          if json.loads(result_path.read_text()) != {
              "ok": True,
              "profile_id": "official-deepseek",
          }:
              raise SystemExit("Codex profile preflight returned the wrong result")
          parse_exec_events(events_path)
          PY
          for root in \
            "${QA_WORKER_ROOT}/profile_official_deepseek/home" \
            "${QA_WORKER_ROOT}/profile_official_deepseek/tmp" \
            "${QA_WORKER_ROOT}/profile_official_deepseek/work"
          do
            if [ -n "$(find "$root" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              echo "::error::Codex preflight polluted an isolated worker root"
              exit 1
            fi
          done

          # The semantic judge is a separate top-level profile. It receives
          # blinded requests on stdin and has no deployment/source/manifest
          # access or tool-network egress.
          judge_home="${QA_PERSONA_JUDGE_ROOT}/home"
          judge_tmp="${QA_PERSONA_JUDGE_ROOT}/tmp"
          judge_work="${QA_PERSONA_JUDGE_ROOT}/work"
          env -i \
            HOME="$judge_home" \
            PATH="$PATH" \
            CODEX_HOME="$QA_CODEX_HOME" \
            LANG="C.UTF-8" \
            TMPDIR="$judge_tmp" \
            "$codex_bin" sandbox -p persona_memory_judge \
              -P io-e2e-agent-driven-test-persona-memory-judge \
              --include-managed-config -C "$judge_work" -- \
              /bin/sh -eu -c '
                command -v curl >/dev/null 2>&1
                printf "judge\n" > "$1"
                test -r "$1"
                rm -f "$1"
                for denied in "$2" "$3" "$4" "$5" "$6" "$7" "$8"; do
                  test ! -r "$denied"
                done
                if curl --silent --show-error --proto "=https" \
                  --max-redirs 0 --connect-timeout 5 --max-time 10 \
                  --output /dev/null https://test-api.feedling.app/; then
                  exit 1
                fi
              ' feedling-persona-judge-preflight \
              "${judge_work}/.preflight" \
              "$GITHUB_WORKSPACE/qa/SOP.md" \
              "$QA_MANIFEST" \
              "$QA_PROFILE_MANIFEST_DIR" \
              "$QA_WORKER_OUTPUT_ROOT" \
              "$QA_AGGREGATION_INPUT_ROOT" \
              "$QA_PERSONA_JUDGE_SCRATCH_ROOT" \
              "$QA_CODEX_HOME/auth.json"

          {
            echo "codex_bin=$codex_bin"
            echo "codex_auth=${QA_CODEX_HOME}/auth.json"
          } >> "$GITHUB_OUTPUT"

      # This is the only setup step that receives provider credentials. No
      # provider or admin credential is ever passed to a Codex process.
      - name: Provision eight isolated API-key profiles
        id: provision
        env:
          IO_E2E_BASE_URL: https://test-api.feedling.app
          QA_RUN_ID: ${{ steps.context.outputs.run_id }}
          IO_E2E_ADMIN_TOKEN: ${{ secrets.IO_E2E_ADMIN_TOKEN }}
          QA_DEEPSEEK_API_KEY: ${{ secrets.QA_DEEPSEEK_API_KEY }}
          QA_ANTHROPIC_API_KEY: ${{ secrets.QA_ANTHROPIC_API_KEY }}
          QA_OPENAI_PROVIDER_API_KEY: ${{ secrets.QA_OPENAI_PROVIDER_API_KEY }}
          QA_OPENROUTER_API_KEY: ${{ secrets.QA_OPENROUTER_API_KEY }}
          QA_GEMINI_API_KEY: ${{ secrets.QA_GEMINI_API_KEY }}
          QA_KONGBEIQIE_API_KEY: ${{ secrets.QA_KONGBEIQIE_API_KEY }}
          QA_DEEPSEEK_MODEL: ${{ vars.QA_DEEPSEEK_MODEL }}
          QA_ANTHROPIC_MODEL: ${{ vars.QA_ANTHROPIC_MODEL }}
          QA_OPENAI_MODEL: ${{ vars.QA_OPENAI_MODEL }}
          QA_GEMINI_MODEL: ${{ vars.QA_GEMINI_MODEL }}
          QA_OPENROUTER_CLAUDE_MODEL: ${{ vars.QA_OPENROUTER_CLAUDE_MODEL }}
          QA_OPENROUTER_OPENAI_MODEL: ${{ vars.QA_OPENROUTER_OPENAI_MODEL }}
          QA_OPENROUTER_GLM_MODEL: ${{ vars.QA_OPENROUTER_GLM_MODEL }}
          QA_KONGBEIQIE_MODEL: ${{ vars.QA_KONGBEIQIE_MODEL }}
          QA_KONGBEIQIE_BASE_URL: ${{ vars.QA_KONGBEIQIE_BASE_URL }}
          QA_EXPECTED_RUNTIME: ${{ inputs.runtime_target }}
        run: |
          set -euo pipefail
          umask 077
          runtime_flag="--baseline-runtime"
          if [ "$QA_EXPECTED_RUNTIME" = "hosted_resident" ]; then
            runtime_flag="--require-runtime-v2"
          fi
          python qa/provision_profiles.py provision \
            --coverage qa/coverage-lock.json \
            --manifest "${{ steps.context.outputs.manifest }}" \
            "$runtime_flag"

      - name: Split credentials into isolated one-profile manifests
        id: split_manifests
        if: steps.provision.outcome == 'success'
        run: |
          set -euo pipefail
          umask 077
          python qa/split_profile_manifests.py \
            --manifest "${{ steps.context.outputs.manifest }}" \
            --output-dir "${{ steps.context.outputs.profile_manifest_dir }}" \
            --memory-output "${{ steps.context.outputs.memory_manifest }}"

      - name: Verify every profile manifest permission boundary
        id: manifest_isolation
        if: steps.split_manifests.outcome == 'success'
        env:
          CODEX_BIN: ${{ steps.codex_preflight.outputs.codex_bin }}
          QA_CODEX_HOME: ${{ steps.context.outputs.codex_home }}
          QA_PRIVATE_MANIFEST: ${{ steps.context.outputs.manifest }}
          QA_PROFILE_MANIFEST_DIR: ${{ steps.context.outputs.profile_manifest_dir }}
          QA_MEMORY_MANIFEST: ${{ steps.context.outputs.memory_manifest }}
          QA_WORKER_ROOT: ${{ steps.context.outputs.worker_root }}
          QA_WORKER_OUTPUT_ROOT: ${{ steps.context.outputs.worker_output_root }}
          QA_AGGREGATION_INPUT_ROOT: ${{ steps.context.outputs.aggregation_input_root }}
          QA_ORCHESTRATION_RECEIPT: ${{ steps.context.outputs.orchestration_receipt }}
          QA_PRIVATE_RESULT: ${{ steps.context.outputs.private_result }}
          QA_ARTIFACT_DIR: ${{ steps.context.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          profiles=(
            official-deepseek
            official-anthropic
            official-openai
            official-gemini
            openrouter-claude
            openrouter-openai
            openrouter-glm
            relay-kongbeiqie
          )
          agent_types=(
            profile_official_deepseek
            profile_official_anthropic
            profile_official_openai
            profile_official_gemini
            profile_openrouter_claude
            profile_openrouter_openai
            profile_openrouter_glm
            profile_relay_kongbeiqie
          )
          for index in "${!profiles[@]}"; do
            profile_id="${profiles[$index]}"
            agent_type="${agent_types[$index]}"
            own_manifest="${QA_PROFILE_MANIFEST_DIR}/${profile_id}.json"
            own_home="${QA_WORKER_ROOT}/${agent_type}/home"
            own_tmp="${QA_WORKER_ROOT}/${agent_type}/tmp"
            own_work="${QA_WORKER_ROOT}/${agent_type}/work"
            denied_paths=(
              "$QA_PRIVATE_MANIFEST"
              "$QA_WORKER_OUTPUT_ROOT"
              "$QA_AGGREGATION_INPUT_ROOT"
              "$QA_ORCHESTRATION_RECEIPT"
              "$QA_PRIVATE_RESULT"
              "$QA_MEMORY_MANIFEST"
            )
            for other_profile in "${profiles[@]}"; do
              if [ "$other_profile" != "$profile_id" ]; then
                denied_paths+=("${QA_PROFILE_MANIFEST_DIR}/${other_profile}.json")
              fi
            done

            env -i \
              HOME="$own_home" \
              PATH="$PATH" \
              CODEX_HOME="$QA_CODEX_HOME" \
              LANG="C.UTF-8" \
              TMPDIR="$own_tmp" \
              "$CODEX_BIN" sandbox -p "$agent_type" \
                -P "io-e2e-agent-driven-test-${profile_id}" \
                --include-managed-config -C "$own_work" -- \
                /bin/sh -eu -c '
                  own="$1"
                  own_tmp="$2"
                  own_work="$3"
                  artifact_canary="$4"
                  source_canary="$5"
                  shift 5
                  test -f "$own"
                  test -r "$own"
                  test "$(stat -c "%a" "$own")" = "600"
                  if python -c "import os, sys; fd = os.open(sys.argv[1], os.O_WRONLY | os.O_APPEND); os.close(fd)" "$own" 2>/dev/null; then
                    exit 1
                  fi
                  for denied in "$@"; do
                    test ! -r "$denied"
                  done
                  printf "tmp\n" > "${own_tmp}/.sandbox-canary"
                  rm -f "${own_tmp}/.sandbox-canary"
                  printf "work\n" > "${own_work}/.sandbox-canary"
                  rm -f "${own_work}/.sandbox-canary"
                  if printf "forbidden\n" > "$artifact_canary" 2>/dev/null; then
                    rm -f "$artifact_canary"
                    exit 1
                  fi
                  if printf "forbidden\n" > "$source_canary" 2>/dev/null; then
                    rm -f "$source_canary"
                    exit 1
                  fi
                ' sh \
                "$own_manifest" \
                "$own_tmp" \
                "$own_work" \
                "${QA_ARTIFACT_DIR}/.worker-write-must-fail" \
                "$GITHUB_WORKSPACE/qa/.source-write-must-fail" \
                "${denied_paths[@]}"
          done

      - name: Run eight independent headless Codex profile agents
        id: profile_workers
        if: steps.manifest_isolation.outcome == 'success'
        timeout-minutes: 200
        env:
          QA_CODEX_HOME: ${{ steps.context.outputs.codex_home }}
          QA_ARTIFACT_DIR: ${{ steps.context.outputs.artifact_dir }}
          QA_PROFILE_MANIFEST_DIR: ${{ steps.context.outputs.profile_manifest_dir }}
          QA_WORKER_ROOT: ${{ steps.context.outputs.worker_root }}
          QA_WORKER_OUTPUT_ROOT: ${{ steps.context.outputs.worker_output_root }}
          QA_AGGREGATION_INPUT_ROOT: ${{ steps.context.outputs.aggregation_input_root }}
          QA_ORCHESTRATION_RECEIPT: ${{ steps.context.outputs.orchestration_receipt }}
          QA_RUN_ID: ${{ steps.context.outputs.run_id }}
          QA_EXPECTED_DEPLOYMENT_SHA: ${{ steps.context.outputs.expected_sha }}
          QA_EXPECTED_RUNTIME: ${{ inputs.runtime_target }}
        run: |
          set -euo pipefail
          umask 077
          python qa/run_codex_profile_workers.py \
            --codex-bin "$(command -v codex)" \
            --codex-home "$QA_CODEX_HOME" \
            --source-root "$GITHUB_WORKSPACE" \
            --artifact-root "$QA_ARTIFACT_DIR" \
            --profile-manifest-dir "$QA_PROFILE_MANIFEST_DIR" \
            --worker-root "$QA_WORKER_ROOT" \
            --worker-output-root "$QA_WORKER_OUTPUT_ROOT" \
            --aggregation-input-root "$QA_AGGREGATION_INPUT_ROOT" \
            --authoring-schema "$GITHUB_WORKSPACE/qa/schemas/codex-run-result.schema.json" \
            --receipt "$QA_ORCHESTRATION_RECEIPT" \
            --run-id "$QA_RUN_ID" \
            --base-url https://test-api.feedling.app \
            --expected-sha "$QA_EXPECTED_DEPLOYMENT_SHA" \
            --expected-runtime "$QA_EXPECTED_RUNTIME" \
            --worker-python "$(python -c 'import pathlib, sys; print(pathlib.Path(sys.executable).resolve())')" \
            --timeout-seconds 3600

      - name: Verify independent Codex worker lifecycle and canonical inputs
        id: orchestration
        if: steps.profile_workers.outcome == 'success'
        run: |
          set -euo pipefail
          python qa/verify_codex_orchestration.py \
            --receipt "${{ steps.context.outputs.orchestration_receipt }}" \
            --worker-output-root "${{ steps.context.outputs.worker_output_root }}" \
            --aggregation-input-root "${{ steps.context.outputs.aggregation_input_root }}"

      # This deterministic probe owns a ninth synthetic account. It never
      # receives provider keys, the admin token, or Codex OAuth material. It
      # runs before the post-deployment receipt so the receipt pair brackets
      # every product-facing qualification probe.
      # Exit 2 means migration is disabled and is adjudicated by the checked-in
      # release policy; the final deterministic gate remains authoritative.
      - name: Run deterministic memory contract on isolated synthetic account
        id: memory_contract
        if: always() && steps.split_manifests.outcome == 'success' && steps.orchestration.outcome == 'success'
        continue-on-error: true
        env:
          QA_MEMORY_MANIFEST: ${{ steps.context.outputs.memory_manifest }}
          QA_MEMORY_RECEIPT: ${{ steps.context.outputs.memory_receipt }}
        run: |
          set -euo pipefail
          umask 077
          python qa/memory_contract_smoke.py \
            --manifest "$QA_MEMORY_MANIFEST" \
            --output "$QA_MEMORY_RECEIPT"

      # A formal persona-memory arm is valid only when the deployed worker can
      # be proven to be Hosted Runtime V2. Provisioning and import are trusted,
      # deterministic code; no Codex process runs in this secret-bearing step.
      - name: Provision and prepare persona-memory account pool
        id: persona_prepare
        if: inputs.runtime_target == 'hosted_resident' && steps.orchestration.outcome == 'success'
        timeout-minutes: 60
        env:
          IO_E2E_BASE_URL: https://test-api.feedling.app
          QA_RUN_ID: ${{ steps.context.outputs.run_id }}-persona-memory
          IO_E2E_ADMIN_TOKEN: ${{ secrets.IO_E2E_ADMIN_TOKEN }}
          QA_OPENAI_PROVIDER_API_KEY: ${{ secrets.QA_OPENAI_PROVIDER_API_KEY }}
          QA_OPENAI_MODEL: ${{ vars.QA_OPENAI_MODEL }}
          QA_EXPECTED_DEPLOYMENT_SHA: ${{ steps.context.outputs.expected_sha }}
          PERSONA_REPETITIONS: ${{ steps.context.outputs.persona_repetitions }}
          PERSONA_POOL_MANIFEST: ${{ steps.context.outputs.persona_pool_manifest }}
          PERSONA_IMPORT_WORK: ${{ steps.context.outputs.persona_import_work }}
          PERSONA_READINESS_RECEIPT: ${{ steps.context.outputs.persona_readiness_receipt }}
          PERSONA_IMPORT_PRE_RECEIPT: ${{ steps.context.outputs.persona_import_pre_receipt }}
          PERSONA_IMPORT_POST_RECEIPT: ${{ steps.context.outputs.persona_import_post_receipt }}
          PERSONA_RUN_PRE_RECEIPT: ${{ steps.context.outputs.persona_run_pre_receipt }}
          QA_ARTIFACT_DIR: ${{ steps.context.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          umask 077
          account_count=$((PERSONA_REPETITIONS * 8))
          python qa/provision_profiles.py provision-pool \
            --coverage qa/coverage-lock.json \
            --manifest "$PERSONA_POOL_MANIFEST" \
            --profile official-openai \
            --count "$account_count" \
            --require-runtime-v2
          python qa/verify_deployment.py \
            --expected-sha "$QA_EXPECTED_DEPLOYMENT_SHA" \
            --expected-runtime hosted_resident \
            --receipt "$PERSONA_IMPORT_PRE_RECEIPT"
          python qa/prepare_persona_memory_accounts.py prepare \
            --account-pool "$PERSONA_POOL_MANIFEST" \
            --build-sha "$QA_EXPECTED_DEPLOYMENT_SHA" \
            --deployment-receipt "$PERSONA_IMPORT_PRE_RECEIPT" \
            --post-deployment-receipt "$PERSONA_IMPORT_POST_RECEIPT" \
            --work-dir "$PERSONA_IMPORT_WORK" \
            --artifact-dir "$QA_ARTIFACT_DIR" \
            --readiness-receipt "$PERSONA_READINESS_RECEIPT" \
            --concurrency 3
          python qa/verify_deployment.py \
            --expected-sha "$QA_EXPECTED_DEPLOYMENT_SHA" \
            --expected-runtime hosted_resident \
            --receipt "$PERSONA_RUN_PRE_RECEIPT"

      # The live driver reads only the synthetic account pool and locked
      # fixtures. Its semantic evaluator reuses the same run-scoped ChatGPT
      # OAuth and QA_CODEX_MODEL as the qualification agents. `env -i` proves
      # that provider/admin secrets cannot reach this process or Codex.
      - name: Run OAuth-backed Codex persona-memory qualification
        id: persona_live
        if: inputs.runtime_target == 'hosted_resident' && steps.persona_prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 120
        env:
          CODEX_BIN: ${{ steps.codex_preflight.outputs.codex_bin }}
          QA_CODEX_HOME: ${{ steps.context.outputs.codex_home }}
          QA_CODEX_MODEL: ${{ vars.QA_CODEX_MODEL }}
          QA_PERSONA_JUDGE_ROOT: ${{ steps.context.outputs.persona_judge_root }}
          QA_PERSONA_JUDGE_SCRATCH_ROOT: ${{ steps.context.outputs.persona_judge_scratch_root }}
          QA_EXPECTED_DEPLOYMENT_SHA: ${{ steps.context.outputs.expected_sha }}
          QA_RUN_ID: ${{ steps.context.outputs.run_id }}-persona-memory
          PERSONA_REPETITIONS: ${{ steps.context.outputs.persona_repetitions }}
          PERSONA_POOL_MANIFEST: ${{ steps.context.outputs.persona_pool_manifest }}
          PERSONA_READINESS_RECEIPT: ${{ steps.context.outputs.persona_readiness_receipt }}
          PERSONA_RUN_PRE_RECEIPT: ${{ steps.context.outputs.persona_run_pre_receipt }}
          PERSONA_RESULT: ${{ steps.context.outputs.persona_result }}
        run: |
          set -euo pipefail
          umask 077
          env -i \
            HOME="${QA_PERSONA_JUDGE_ROOT}/home" \
            PATH="$PATH" \
            CODEX_HOME="$QA_CODEX_HOME" \
            LANG="C.UTF-8" \
            TMPDIR="${QA_PERSONA_JUDGE_ROOT}/tmp" \
            PYTHONDONTWRITEBYTECODE="1" \
            PYTHONPATH="$GITHUB_WORKSPACE" \
            IO_E2E_BASE_URL="https://test-api.feedling.app" \
            QA_RUN_ID="$QA_RUN_ID" \
            python qa/run_persona_memory_regression.py run-live \
              --target-id "current-test-${QA_EXPECTED_DEPLOYMENT_SHA}" \
              --target-label candidate \
              --build-sha "$QA_EXPECTED_DEPLOYMENT_SHA" \
              --deployment-receipt "$PERSONA_RUN_PRE_RECEIPT" \
              --account-pool "$PERSONA_POOL_MANIFEST" \
              --readiness-receipt "$PERSONA_READINESS_RECEIPT" \
              --external-cleanup-guaranteed \
              --repetitions "$PERSONA_REPETITIONS" \
              --concurrency 3 \
              --codex-bin "$CODEX_BIN" \
              --codex-home "$QA_CODEX_HOME" \
              --judge-work-root "${QA_PERSONA_JUDGE_ROOT}/work" \
              --judge-model "$QA_CODEX_MODEL" \
              --judge-id codex-oauth-persona-memory-v1 \
              --judge-configuration-id persona-memory-rubric-v1 \
              --judge-codex-profile persona_memory_judge \
              --judge-permission-profile io-e2e-agent-driven-test-persona-memory-judge \
              --judge-reasoning-effort medium \
              --judge-timeout 180 \
              --allow-private-judge-egress \
              --output "$PERSONA_RESULT"

      - name: Record non-formal persona qualification skip
        id: persona_nonformal_skip
        if: inputs.runtime_target == 'deployed_current'
        env:
          PERSONA_REPETITIONS: ${{ steps.context.outputs.persona_repetitions }}
          QA_ARTIFACT_DIR: ${{ steps.context.outputs.artifact_dir }}
          QA_EXPECTED_DEPLOYMENT_SHA: ${{ steps.context.outputs.expected_sha }}
        run: |
          set -euo pipefail
          python qa/publish_persona_memory_summary.py \
            --nonformal-skip \
            --build-sha "$QA_EXPECTED_DEPLOYMENT_SHA" \
            --repetitions "$PERSONA_REPETITIONS" \
            --artifact-dir "$QA_ARTIFACT_DIR"
          echo "::notice::persona-memory qualification is not formal for deployed_current; the mandatory eight-provider P0 matrix still ran"
          {
            echo "### Persona-memory qualification"
            echo
            echo "Not formally qualified: deployed_current cannot attest the Hosted Runtime V2 worker."
            echo "Requested repetitions: ${PERSONA_REPETITIONS}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed endpoint and selected runtime target after profile testing
        id: deployment_post
        if: always() && steps.orchestration.outcome == 'success'
        env:
          IO_E2E_BASE_URL: https://test-api.feedling.app
          IO_E2E_ADMIN_TOKEN: ${{ secrets.IO_E2E_ADMIN_TOKEN }}
          QA_EXPECTED_DEPLOYMENT_SHA: ${{ steps.context.outputs.expected_sha }}
          QA_EXPECTED_RUNTIME: ${{ inputs.runtime_target }}
        run: |
          set -euo pipefail
          umask 077
          python qa/verify_deployment.py \
            --expected-sha "$QA_EXPECTED_DEPLOYMENT_SHA" \
            --expected-runtime "$QA_EXPECTED_RUNTIME" \
            --receipt "${{ steps.context.outputs.post_deployment_receipt }}"

      - name: Run intelligent Codex qualification aggregator
        id: supervisor
        if: steps.deployment_post.outcome == 'success'
        timeout-minutes: 20
        env:
          CODEX_BIN: ${{ steps.codex_preflight.outputs.codex_bin }}
          QA_CODEX_HOME: ${{ steps.context.outputs.codex_home }}
          QA_SUPERVISOR_HOME: ${{ steps.context.outputs.supervisor_home }}
          QA_SUPERVISOR_TMP: ${{ steps.context.outputs.supervisor_tmp }}
          QA_SUPERVISOR_WORK: ${{ steps.context.outputs.supervisor_work }}
          QA_AGGREGATION_INPUT_ROOT: ${{ steps.context.outputs.aggregation_input_root }}
          QA_ORCHESTRATION_RECEIPT: ${{ steps.context.outputs.orchestration_receipt }}
          QA_PRIVATE_ROOT: ${{ steps.context.outputs.private_root }}
          QA_PRIVATE_RESULT: ${{ steps.context.outputs.private_result }}
          QA_RUN_ID: ${{ steps.context.outputs.run_id }}
          QA_EXPECTED_DEPLOYMENT_SHA: ${{ steps.context.outputs.expected_sha }}
          QA_EXPECTED_RUNTIME: ${{ inputs.runtime_target }}
        run: |
          set -euo pipefail
          umask 077
          prompt_file="${QA_PRIVATE_ROOT}/aggregation-prompt.txt"
          raw_stdout="${QA_PRIVATE_ROOT}/raw-codex/aggregation-events.jsonl"
          raw_stderr="${QA_PRIVATE_ROOT}/raw-codex/aggregation-stderr.log"
          cat > "$prompt_file" <<PROMPT
          Act as the final intelligent Feedling API-key qualification supervisor.

          Read and obey ${GITHUB_WORKSPACE}/qa/SOP.md,
          ${GITHUB_WORKSPACE}/qa/coverage-lock.json, and
          ${GITHUB_WORKSPACE}/qa/scenarios/api-key-journey.md. Trusted code has
          already run exactly eight independent profile agents through one fixed
          three-slot queue that immediately backfilled each freed slot, with a
          concurrency cap of three. Read only the eight
          schema-validated profile JSON files in
          ${QA_AGGREGATION_INPUT_ROOT} and the trusted lifecycle receipt at
          ${QA_ORCHESTRATION_RECEIPT}. Never read raw worker events/stderr,
          provisioning manifests, credentials, or public artifacts; never run
          another product probe or launch another agent.

          Copy all eight profile objects exactly, in locked matrix order. Do not
          weaken or rewrite any failed assertion, retry observation, persona
          finalizer receipt or qualification-agent semantic judgment,
          reasoning/COT evidence, trace correlation, per-turn five-stage latency,
          or cleanup result. Build the canonical run object for run
          ${QA_RUN_ID}. Set environment test, base URL
          https://test-api.feedling.app, expected deployment SHA
          ${QA_EXPECTED_DEPLOYMENT_SHA}, and expected runtime
          ${QA_EXPECTED_RUNTIME}. When expected runtime is hosted_resident,
          every profile's trusted provisioning readback and live scenario
          receipts must prove hosted_resident version 2. The pre/post checks
          prove the backend image identity at the expected SHA; no deployed
          endpoint currently attests the separate worker image SHA. For both
          runtime targets, set observed_backend_sha to
          ${QA_EXPECTED_DEPLOYMENT_SHA} and observed_worker_sha to null.

          Set supervisor_count=1, configured concurrency=3, observed concurrency
          and each profile/worker assignment exactly from the trusted receipt.
          profiles_expected and profiles_completed are both 8. Compute the seven
          summary counts from the exact profile statuses; they must sum to eight.
          Compute overall_status from those statuses without turning a blocked
          or failed profile into PASS. Use the earliest scenario start and latest
          scenario finish as run timestamps. Use only the schema-fixed artifact
          references and redaction booleans. Return only canonical JSON matching
          the supplied schema.
          PROMPT

          env -i \
            HOME="$QA_SUPERVISOR_HOME" \
            PATH="$PATH" \
            CODEX_HOME="$QA_CODEX_HOME" \
            LANG="C.UTF-8" \
            TMPDIR="$QA_SUPERVISOR_TMP" \
            PYTHONDONTWRITEBYTECODE="1" \
            PYTHONPATH="$GITHUB_WORKSPACE" \
            QA_SOURCE_ROOT="$GITHUB_WORKSPACE" \
            QA_RUN_ID="$QA_RUN_ID" \
            QA_AGGREGATION_INPUT_ROOT="$QA_AGGREGATION_INPUT_ROOT" \
            QA_ORCHESTRATION_RECEIPT="$QA_ORCHESTRATION_RECEIPT" \
            QA_EXPECTED_DEPLOYMENT_SHA="$QA_EXPECTED_DEPLOYMENT_SHA" \
            QA_EXPECTED_RUNTIME="$QA_EXPECTED_RUNTIME" \
            IO_E2E_BASE_URL="https://test-api.feedling.app" \
            "$CODEX_BIN" exec \
              --ignore-rules \
              --strict-config \
              --disable multi_agent \
              --disable network_proxy \
              --skip-git-repo-check \
              --cd "$QA_SUPERVISOR_WORK" \
              --output-schema "$GITHUB_WORKSPACE/qa/schemas/codex-run-result.schema.json" \
              --output-last-message "$QA_PRIVATE_RESULT" \
              --color never \
              --json - \
              < "$prompt_file" > "$raw_stdout" 2> "$raw_stderr"

      - name: Publish canonical result without following agent-created links
        id: publish_result
        if: steps.supervisor.outcome == 'success'
        run: |
          set -euo pipefail
          python qa/publish_agent_result.py \
            --source "${{ steps.context.outputs.private_result }}" \
            --destination "${{ steps.context.outputs.artifact_dir }}/run-result.json"

      - name: Render trusted derived artifacts
        id: render
        if: steps.publish_result.outcome == 'success'
        env:
          QA_ARTIFACT_DIR: ${{ steps.context.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          python qa/render_artifacts.py \
            --schema qa/schemas/run-result.schema.json \
            --result "$QA_ARTIFACT_DIR/run-result.json" \
            --artifacts "$QA_ARTIFACT_DIR"

      - name: Validate complete release result
        id: validate
        if: always()
        env:
          QA_ARTIFACT_DIR: ${{ steps.context.outputs.artifact_dir }}
          QA_EXPECTED_DEPLOYMENT_SHA: ${{ steps.context.outputs.expected_sha }}
          QA_EXPECTED_RUNTIME: ${{ inputs.runtime_target }}
        run: |
          set -euo pipefail
          python qa/validate_run.py \
            --coverage qa/coverage-lock.json \
            --schema qa/schemas/run-result.schema.json \
            --result "$QA_ARTIFACT_DIR/run-result.json" \
            --artifacts "$QA_ARTIFACT_DIR" \
            --provisioning-manifest "${{ steps.context.outputs.manifest }}" \
            --orchestration-receipt "${{ steps.context.outputs.orchestration_receipt }}" \
            --deployment-receipt "${{ steps.context.outputs.pre_deployment_receipt }}" \
            --post-deployment-receipt "${{ steps.context.outputs.post_deployment_receipt }}" \
            --expected-runtime "$QA_EXPECTED_RUNTIME" \
            --expected-sha "$QA_EXPECTED_DEPLOYMENT_SHA"

      - name: Cleanup every synthetic account with deterministic evidence
        id: cleanup
        if: always()
        env:
          QA_ARTIFACT_DIR: ${{ steps.context.outputs.artifact_dir }}
          IO_E2E_ADMIN_TOKEN: ${{ secrets.IO_E2E_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python qa/provision_profiles.py cleanup \
            --manifest "${{ steps.context.outputs.manifest }}" \
            --receipt "$QA_ARTIFACT_DIR/cleanup-receipt.json" \
            --run-id "${{ steps.context.outputs.run_id }}" \
            --retain-manifest

      # This step deliberately receives the admin token but no provider keys
      # or Codex OAuth. It always attempts every pool lease and preserves the
      # atomic cleanup-pending recovery manifest on any incomplete absence
      # attestation.
      - name: Cleanup persona-memory pool with authoritative absence evidence
        id: persona_cleanup
        if: always() && inputs.runtime_target == 'hosted_resident' && steps.persona_prepare.outcome != 'skipped'
        timeout-minutes: 30
        env:
          IO_E2E_BASE_URL: https://test-api.feedling.app
          IO_E2E_ADMIN_TOKEN: ${{ secrets.IO_E2E_ADMIN_TOKEN }}
          QA_EXPECTED_DEPLOYMENT_SHA: ${{ steps.context.outputs.expected_sha }}
          PERSONA_POOL_MANIFEST: ${{ steps.context.outputs.persona_pool_manifest }}
          PERSONA_RUN_POST_RECEIPT: ${{ steps.context.outputs.persona_run_post_receipt }}
          PERSONA_CLEANUP_RECEIPT: ${{ steps.context.outputs.persona_cleanup_receipt }}
        run: |
          set -uo pipefail
          umask 077
          failed=0
          python qa/verify_deployment.py \
            --expected-sha "$QA_EXPECTED_DEPLOYMENT_SHA" \
            --expected-runtime hosted_resident \
            --receipt "$PERSONA_RUN_POST_RECEIPT" || failed=1
          if ! python qa/prepare_persona_memory_accounts.py cleanup \
            --account-pool "$PERSONA_POOL_MANIFEST" \
            --receipt "$PERSONA_CLEANUP_RECEIPT"
          then
            failed=1
            # An interrupted provision may leave an incomplete pool that
            # cannot satisfy the formal receipt contract. Delete any accounts
            # immediately with the lower-level cleanup path, but keep this
            # step failed so no release evidence can be uploaded.
            pending="$(dirname "$PERSONA_POOL_MANIFEST")/.${PERSONA_POOL_MANIFEST##*/}.cleanup-pending"
            for recovery_manifest in "$PERSONA_POOL_MANIFEST" "$pending"; do
              if [ -f "$recovery_manifest" ]; then
                python qa/provision_profiles.py cleanup \
                  --manifest "$recovery_manifest" || true
              fi
            done
          fi
          exit "$failed"

      - name: Validate persona-memory cleanup and finalize arm evidence
        id: persona_finalize
        if: always() && inputs.runtime_target == 'hosted_resident' && steps.persona_cleanup.outcome == 'success' && steps.persona_live.outcome != 'skipped'
        env:
          PERSONA_RESULT: ${{ steps.context.outputs.persona_result }}
          PERSONA_READINESS_RECEIPT: ${{ steps.context.outputs.persona_readiness_receipt }}
          PERSONA_IMPORT_PRE_RECEIPT: ${{ steps.context.outputs.persona_import_pre_receipt }}
          PERSONA_IMPORT_POST_RECEIPT: ${{ steps.context.outputs.persona_import_post_receipt }}
          PERSONA_RUN_PRE_RECEIPT: ${{ steps.context.outputs.persona_run_pre_receipt }}
          PERSONA_RUN_POST_RECEIPT: ${{ steps.context.outputs.persona_run_post_receipt }}
          PERSONA_CLEANUP_RECEIPT: ${{ steps.context.outputs.persona_cleanup_receipt }}
          PERSONA_ARM_RECEIPT: ${{ steps.context.outputs.persona_arm_receipt }}
          PERSONA_REPETITIONS: ${{ steps.context.outputs.persona_repetitions }}
          QA_ARTIFACT_DIR: ${{ steps.context.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          umask 077
          python qa/run_persona_memory_regression.py finalize-arm \
            --result "$PERSONA_RESULT" \
            --readiness-receipt "$PERSONA_READINESS_RECEIPT" \
            --import-pre-deployment-receipt "$PERSONA_IMPORT_PRE_RECEIPT" \
            --import-post-deployment-receipt "$PERSONA_IMPORT_POST_RECEIPT" \
            --pre-deployment-receipt "$PERSONA_RUN_PRE_RECEIPT" \
            --post-deployment-receipt "$PERSONA_RUN_POST_RECEIPT" \
            --cleanup-receipt "$PERSONA_CLEANUP_RECEIPT" \
            --output "$PERSONA_ARM_RECEIPT"
          python qa/publish_persona_memory_summary.py \
            --result "$PERSONA_RESULT" \
            --arm-receipt "$PERSONA_ARM_RECEIPT" \
            --artifact-dir "$QA_ARTIFACT_DIR"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["PERSONA_ARM_RECEIPT"]).read_text())
          status = receipt.get("result_status")
          if status not in {"PASS", "FAIL", "BLOCKED_EVIDENCE", "INFRA_ERROR"}:
              raise SystemExit("persona-memory arm receipt status is invalid")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("### Persona-memory qualification\n\n")
              summary.write(f"Status: {status}. Repetitions: {os.environ['PERSONA_REPETITIONS']}. ")
              summary.write("Judge: Codex OAuth / QA_CODEX_MODEL.\n")
          PY

      - name: Validate deterministic cleanup receipt
        id: cleanup_receipt
        if: always()
        env:
          QA_ARTIFACT_DIR: ${{ steps.context.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          python qa/validate_cleanup_receipt.py \
            --receipt "$QA_ARTIFACT_DIR/cleanup-receipt.json" \
            --result "$QA_ARTIFACT_DIR/run-result.json"

      # Retain the private manifests until the scanner has compared every
      # public byte, including the cleanup receipt, against real secret values.
      - name: Scan public artifacts for secrets and raw evidence
        id: secret_scan
        if: always()
        env:
          QA_ARTIFACT_DIR: ${{ steps.context.outputs.artifact_dir }}
          QA_PRIVATE_MANIFEST: ${{ steps.context.outputs.manifest }}
          QA_MEMORY_MANIFEST: ${{ steps.context.outputs.memory_manifest }}
          IO_E2E_ADMIN_TOKEN: ${{ secrets.IO_E2E_ADMIN_TOKEN }}
          QA_DEEPSEEK_API_KEY: ${{ secrets.QA_DEEPSEEK_API_KEY }}
          QA_ANTHROPIC_API_KEY: ${{ secrets.QA_ANTHROPIC_API_KEY }}
          QA_OPENAI_PROVIDER_API_KEY: ${{ secrets.QA_OPENAI_PROVIDER_API_KEY }}
          QA_OPENROUTER_API_KEY: ${{ secrets.QA_OPENROUTER_API_KEY }}
          QA_GEMINI_API_KEY: ${{ secrets.QA_GEMINI_API_KEY }}
          QA_KONGBEIQIE_API_KEY: ${{ secrets.QA_KONGBEIQIE_API_KEY }}
          QA_CODEX_AUTH_JSON_B64: ${{ secrets.QA_CODEX_AUTH_JSON_B64 }}
        run: |
          set -euo pipefail
          python qa/scan_artifacts.py \
            --artifacts "$QA_ARTIFACT_DIR" \
            --manifest "$QA_PRIVATE_MANIFEST" \
            --memory-manifest "$QA_MEMORY_MANIFEST" \
            --codex-auth "${{ steps.codex_preflight.outputs.codex_auth }}" \
            --fixture qa/fixtures/persona-import-v1.json

      - name: Upload sanitized public qualification artifacts
        id: upload
        if: always() && steps.secret_scan.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.cleanup_receipt.outcome == 'success' && (inputs.runtime_target != 'hosted_resident' || (steps.persona_cleanup.outcome == 'success' && steps.persona_finalize.outcome == 'success'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: io-e2e-agent-driven-test-${{ steps.context.outputs.run_id }}
          path: ${{ steps.context.outputs.artifact_dir }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
          compression-level: 6

      - name: Remove public scratch after upload decision
        id: public_cleanup
        if: always()
        env:
          QA_ARTIFACT_DIR: ${{ steps.context.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path

          raw = os.environ.get("QA_ARTIFACT_DIR", "")
          if not raw:
              raise SystemExit(0)
          root = Path(raw).absolute()
          expected_parent = (
              Path(os.environ["GITHUB_WORKSPACE"]) / "qualification-artifacts"
          ).resolve()
          if root.parent.resolve() != expected_parent or not root.name.startswith(
              "api-key-e2e-"
          ):
              print("::error::refusing unsafe public scratch cleanup path", file=sys.stderr)
              raise SystemExit(1)
          if root.is_symlink():
              root.unlink()
          elif root.exists():
              shutil.rmtree(root)
          print("public qualification scratch removed")
          PY

      - name: Remove private scratch after account cleanup
        id: private_cleanup
        if: always()
        env:
          QA_PRIVATE_ROOT: ${{ steps.context.outputs.private_root }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path

          raw = os.environ.get("QA_PRIVATE_ROOT", "")
          if not raw:
              raise SystemExit(0)
          root = Path(raw).absolute()
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          if root.parent.resolve() != runner_temp or not root.name.startswith(
              "api-key-e2e-"
          ):
              print("::error::refusing unsafe private scratch cleanup path", file=sys.stderr)
              raise SystemExit(1)
          if root.is_symlink():
              root.unlink()
          elif root.exists():
              shutil.rmtree(root)
          print("private qualification scratch removed")
          PY

      - name: Enforce fail-closed qualification outcome
        if: always()
        env:
          CODEX_PREFLIGHT: ${{ steps.codex_preflight.outcome }}
          DEPLOYMENT_PRE: ${{ steps.deployment_pre.outcome }}
          DEPLOYMENT_POST: ${{ steps.deployment_post.outcome }}
          PROVISION: ${{ steps.provision.outcome }}
          SPLIT_MANIFESTS: ${{ steps.split_manifests.outcome }}
          MANIFEST_ISOLATION: ${{ steps.manifest_isolation.outcome }}
          PROFILE_WORKERS: ${{ steps.profile_workers.outcome }}
          ORCHESTRATION: ${{ steps.orchestration.outcome }}
          SUPERVISOR: ${{ steps.supervisor.outcome }}
          PUBLISH_RESULT: ${{ steps.publish_result.outcome }}
          RENDER: ${{ steps.render.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          SECRET_SCAN: ${{ steps.secret_scan.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
          CLEANUP_RECEIPT: ${{ steps.cleanup_receipt.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          PUBLIC_CLEANUP: ${{ steps.public_cleanup.outcome }}
          PRIVATE_CLEANUP: ${{ steps.private_cleanup.outcome }}
          PERSONA_PREPARE: ${{ steps.persona_prepare.outcome }}
          PERSONA_LIVE: ${{ steps.persona_live.outcome }}
          PERSONA_CLEANUP: ${{ steps.persona_cleanup.outcome }}
          PERSONA_FINALIZE: ${{ steps.persona_finalize.outcome }}
          PERSONA_NONFORMAL_SKIP: ${{ steps.persona_nonformal_skip.outcome }}
          QA_EXPECTED_RUNTIME: ${{ inputs.runtime_target }}
          PERSONA_REPETITIONS: ${{ steps.context.outputs.persona_repetitions }}
        run: |
          set -euo pipefail
          failed=0
          for item in \
            "codex-preflight:$CODEX_PREFLIGHT" \
            "deployment-pre:$DEPLOYMENT_PRE" \
            "deployment-post:$DEPLOYMENT_POST" \
            "provision:$PROVISION" \
            "split-manifests:$SPLIT_MANIFESTS" \
            "manifest-isolation:$MANIFEST_ISOLATION" \
            "profile-workers:$PROFILE_WORKERS" \
            "orchestration:$ORCHESTRATION" \
            "supervisor:$SUPERVISOR" \
            "publish-result:$PUBLISH_RESULT" \
            "render:$RENDER" \
            "validate:$VALIDATE" \
            "secret-scan:$SECRET_SCAN" \
            "cleanup:$CLEANUP" \
            "cleanup-receipt:$CLEANUP_RECEIPT" \
            "upload:$UPLOAD" \
            "public-cleanup:$PUBLIC_CLEANUP" \
            "private-cleanup:$PRIVATE_CLEANUP"
          do
            name="${item%%:*}"
            outcome="${item#*:}"
            if [ "$outcome" != "success" ]; then
              echo "::error::$name outcome was $outcome"
              failed=1
            fi
          done
          if [ "$QA_EXPECTED_RUNTIME" = "hosted_resident" ]; then
            for item in \
              "persona-prepare:$PERSONA_PREPARE" \
              "persona-live:$PERSONA_LIVE" \
              "persona-cleanup:$PERSONA_CLEANUP" \
              "persona-finalize:$PERSONA_FINALIZE"
            do
              name="${item%%:*}"
              outcome="${item#*:}"
              if [ "$outcome" != "success" ]; then
                echo "::error::$name outcome was $outcome"
                failed=1
              fi
            done
          elif [ "$PERSONA_NONFORMAL_SKIP" != "success" ]; then
            echo "::error::persona non-formal skip was not recorded"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "release qualification: FAIL"
            exit 1
          fi
          echo "release qualification: PASS (persona repetitions: $PERSONA_REPETITIONS)"

  # Manifest-local cleanup is the evidence path for a passing qualification.
  # This independent hosted sweep is the durability path: it still runs if the
  # disposable evaluator crashes, loses a registration response before writing
  # a manifest, or is cancelled during local cleanup.
  cleanup-synthetic-accounts:
    name: authoritatively remove synthetic QA accounts
    if: ${{ always() && needs.validate-dispatch.result == 'success' }}
    needs: [validate-dispatch, qualify-api-key-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: io-e2e-agent-driven-test
    permissions:
      contents: read
    steps:
      - name: Check out immutable trusted account cleanup controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted account cleanup controller checkout
        env:
          CONTROLLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD)"
          if [ "$checked_out_sha" != "$CONTROLLER_SHA" ]; then
            echo "::error::account cleanup controller checkout moved"
            exit 1
          fi

      - name: Set up Python for authoritative account cleanup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qa/requirements.lock

      - name: Install hash-locked account cleanup dependencies
        run: python -m pip install --require-hashes -r qa/requirements.lock

      - name: Sweep exact base and persona run IDs with bounded retries
        id: sweep
        env:
          IO_E2E_BASE_URL: https://test-api.feedling.app
          IO_E2E_ADMIN_TOKEN: ${{ secrets.IO_E2E_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          cleanup_root="${RUNNER_TEMP}/io-e2e-account-cleanup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$cleanup_root"

          remove_cleanup_root() {
            python - "$cleanup_root" <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).absolute()
          expected_parent = Path(os.environ["RUNNER_TEMP"]).resolve()
          if (
              root.parent.resolve() != expected_parent
              or not root.name.startswith("io-e2e-account-cleanup-")
          ):
              raise SystemExit("refusing unsafe hosted cleanup scratch path")
          if root.is_symlink():
              root.unlink()
          elif root.exists():
              shutil.rmtree(root)
          PY
          }
          trap remove_cleanup_root EXIT

          base_run_id="api-key-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          persona_run_id="${base_run_id}-persona-memory"
          if [ "${#base_run_id}" -gt 48 ] || [ "${#persona_run_id}" -gt 48 ]; then
            echo "::error::derived synthetic cleanup run ID exceeds the backend contract"
            exit 1
          fi

          cleanup_one_run() {
            local run_id="$1"
            local scope="$2"
            local output_variable="$3"
            local succeeded=0
            local attempt receipt
            for attempt in 1 2; do
              receipt="${cleanup_root}/${scope}-${attempt}.run-cleanup.json"
              if python qa/provision_profiles.py cleanup-run \
                  --run-id "$run_id" \
                  --receipt "$receipt" \
                && python - "$receipt" "$run_id" <<'PY'
          import hashlib
          import json
          import sys

          receipt_path, run_id = sys.argv[1:]
          with open(receipt_path, encoding="utf-8") as handle:
              payload = json.load(handle)
          expected_keys = {
              "schema_version",
              "kind",
              "run_id_sha256",
              "label_prefix_sha256",
              "database_authoritative",
              "matched_count",
              "deleted_count",
              "already_absent_count",
              "operation_failure_count",
              "remaining_count",
              "complete",
          }
          if set(payload) != expected_keys:
              raise SystemExit("authoritative cleanup receipt shape is invalid")
          counts = (
              "matched_count",
              "deleted_count",
              "already_absent_count",
              "operation_failure_count",
              "remaining_count",
          )
          if any(type(payload.get(name)) is not int or payload[name] < 0 for name in counts):
              raise SystemExit("authoritative cleanup receipt counts are invalid")
          expected_run_hash = hashlib.sha256(run_id.encode()).hexdigest()
          expected_label_hash = hashlib.sha256(
              f"agent-e2e-{run_id}-".encode()
          ).hexdigest()
          if (
              payload.get("schema_version") != 1
              or payload.get("kind") != "qa_synthetic_run_cleanup"
              or payload.get("run_id_sha256") != expected_run_hash
              or payload.get("label_prefix_sha256") != expected_label_hash
              or payload.get("database_authoritative") is not True
              or payload.get("matched_count")
              != payload.get("deleted_count")
              + payload.get("already_absent_count")
              + payload.get("operation_failure_count")
              or payload.get("operation_failure_count") != 0
              or payload.get("remaining_count") != 0
              or payload.get("complete") is not True
          ):
              raise SystemExit("authoritative cleanup did not prove zero remaining accounts")
          PY
              then
                succeeded=1
                printf -v "$output_variable" '%s' "$receipt"
                break
              fi
              echo "::warning::authoritative cleanup attempt ${attempt}/2 did not prove zero remaining accounts"
              if [ "$attempt" -lt 2 ]; then
                sleep $((attempt * 2))
              fi
            done
            if [ "$succeeded" -ne 1 ]; then
              echo "::error::authoritative synthetic cleanup exhausted bounded retries"
              return 1
            fi
          }

          base_receipt=""
          persona_receipt=""
          failed=0
          cleanup_one_run "$base_run_id" base base_receipt || failed=1
          cleanup_one_run "$persona_run_id" persona persona_receipt || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more authoritative synthetic cleanup scopes failed"
            exit "$failed"
          fi

          artifact_root="${GITHUB_WORKSPACE}/hosted-cleanup-artifacts"
          if [ -e "$artifact_root" ] || [ -L "$artifact_root" ]; then
            echo "::error::refusing occupied hosted cleanup artifact path"
            exit 1
          fi
          mkdir -m 700 "$artifact_root"
          python - "$base_receipt" "$persona_receipt" \
            "$artifact_root/synthetic-cleanup-summary.json" \
            "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import os
          import sys

          base_path, persona_path, output_path, step_summary_path = sys.argv[1:]
          rows = []
          for scope, path in (("base", base_path), ("persona", persona_path)):
              with open(path, encoding="utf-8") as handle:
                  receipt = json.load(handle)
              rows.append(
                  {
                      "scope": scope,
                      "run_id_sha256": receipt["run_id_sha256"],
                      "label_prefix_sha256": receipt["label_prefix_sha256"],
                      "database_authoritative": receipt["database_authoritative"],
                      "matched_count": receipt["matched_count"],
                      "deleted_count": receipt["deleted_count"],
                      "already_absent_count": receipt["already_absent_count"],
                      "operation_failure_count": receipt["operation_failure_count"],
                      "remaining_count": receipt["remaining_count"],
                      "complete": receipt["complete"],
                  }
              )
          summary = {
              "schema_version": 1,
              "kind": "qa_synthetic_cleanup_summary",
              "database_authoritative": True,
              "complete": True,
              "runs": rows,
          }
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          if hasattr(os, "O_NOFOLLOW"):
              flags |= os.O_NOFOLLOW
          descriptor = os.open(output_path, flags, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
              json.dump(summary, handle, sort_keys=True, indent=2)
              handle.write("\n")
              handle.flush()
              os.fsync(handle.fileno())
          with open(step_summary_path, "a", encoding="utf-8") as handle:
              handle.write("## Authoritative synthetic account cleanup\n\n")
              handle.write(
                  "| Scope | Matched | Deleted | Already absent | Failures | Remaining | Complete | Run hash | Label hash |\n"
              )
              handle.write("|---|---:|---:|---:|---:|---:|---|---|---|\n")
              for row in rows:
                  handle.write(
                      "| {scope} | {matched_count} | {deleted_count} | "
                      "{already_absent_count} | {operation_failure_count} | "
                      "{remaining_count} | {complete} | `{run_id_sha256}` | "
                      "`{label_prefix_sha256}` |\n".format(**row)
                  )
          PY
          echo "authoritative synthetic account cleanup proved zero remaining accounts for both run IDs"

      - name: Upload sanitized authoritative account cleanup proof
        if: ${{ success() && steps.sweep.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: io-e2e-synthetic-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/hosted-cleanup-artifacts
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
          compression-level: 6

      - name: Remove hosted cleanup artifact scratch
        if: always()
        env:
          CLEANUP_ARTIFACT_ROOT: ${{ github.workspace }}/hosted-cleanup-artifacts
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path

          root = Path(os.environ["CLEANUP_ARTIFACT_ROOT"]).absolute()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if (
              root.parent.resolve() != workspace
              or root.name != "hosted-cleanup-artifacts"
          ):
              print("::error::refusing unsafe hosted cleanup artifact path", file=sys.stderr)
              raise SystemExit(1)
          if root.is_symlink():
              root.unlink()
          elif root.exists():
              shutil.rmtree(root)
          print("hosted cleanup artifact scratch removed")
          PY

  # A skipped provision never received JIT/AWS credentials because deployment
  # resolution failed first. Failed or cancelled provisioning may have created
  # either resource, so every non-skipped attempt still reaches hosted cleanup.
  cleanup-aws-runner:
    name: terminate disposable AWS evaluator
    if: ${{ always() && needs.validate-dispatch.result == 'success' && needs.provision-aws-runner.result != 'skipped' }}
    needs: [validate-dispatch, provision-aws-runner, qualify-api-key-runtime, cleanup-synthetic-accounts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: io-e2e-agent-driven-test
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out immutable trusted cleanup controller
        id: cleanup_checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted cleanup controller checkout
        id: verify_cleanup
        env:
          CONTROLLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD)"
          if [ "$checked_out_sha" != "$CONTROLLER_SHA" ]; then
            echo "::error::cleanup controller checkout moved"
            exit 1
          fi

      - name: Configure short-lived AWS credentials for cleanup
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.0
        with:
          role-to-assume: ${{ vars.QA_AWS_ROLE_ARN }}
          aws-region: ${{ vars.QA_AWS_REGION }}
          role-session-name: io-e2e-agent-driven-test-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          mask-aws-account-id: true

      - name: Terminate exact managed evaluator for this attempt
        env:
          AWS_REGION: ${{ vars.QA_AWS_REGION }}
          INSTANCE_ID: ${{ needs.provision-aws-runner.outputs.instance_id }}
        run: |
          set -euo pipefail
          args=(
            --region "$AWS_REGION"
            --repository "$GITHUB_REPOSITORY"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          )
          if [ -n "$INSTANCE_ID" ]; then
            args+=(--instance-id "$INSTANCE_ID")
          fi
          python3 qa/aws/terminate.py "${args[@]}"

      - name: Mint fresh GitHub App token for registration cleanup
        id: github_cleanup_app
        if: ${{ always() && steps.verify_cleanup.outcome == 'success' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.1
        with:
          app-id: ${{ vars.QA_RUNNER_GITHUB_APP_ID }}
          private-key: ${{ secrets.QA_RUNNER_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Delete exact stale JIT runner registration
        if: ${{ always() && steps.github_cleanup_app.outcome == 'success' }}
        env:
          EXPECTED_RUNNER_ID: ${{ needs.provision-aws-runner.outputs.runner_id }}
          EXPECTED_RUNNER_LABEL: ${{ needs.provision-aws-runner.outputs.runner_label }}
          EXPECTED_RUNNER_NAME: ${{ needs.provision-aws-runner.outputs.runner_name }}
          GH_APP_TOKEN: ${{ steps.github_cleanup_app.outputs.token }}
        run: |
          set -euo pipefail
          umask 077
          derived_name="io-e2e-agent-driven-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -n "$EXPECTED_RUNNER_NAME" ] && [ "$EXPECTED_RUNNER_NAME" != "$derived_name" ]; then
            echo "::error::refusing unexpected runner cleanup name"
            exit 1
          fi
          if [ -n "$EXPECTED_RUNNER_LABEL" ] && [ "$EXPECTED_RUNNER_LABEL" != "$derived_name" ]; then
            echo "::error::refusing unexpected runner cleanup label"
            exit 1
          fi
          if [ -n "$EXPECTED_RUNNER_ID" ] && ! [[ "$EXPECTED_RUNNER_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::refusing invalid runner cleanup id"
            exit 1
          fi
          if [ -n "$EXPECTED_RUNNER_ID" ] && { [ "$EXPECTED_RUNNER_NAME" != "$derived_name" ] || [ "$EXPECTED_RUNNER_LABEL" != "$derived_name" ]; }; then
            echo "::error::runner cleanup outputs are incomplete or inconsistent"
            exit 1
          fi

          response_path="${RUNNER_TEMP}/io-e2e-runner-cleanup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          delete_response_path="${response_path}.delete"
          trap 'rm -f -- "$response_path" "$delete_response_path"' EXIT
          if [ -n "$EXPECTED_RUNNER_ID" ]; then
            # This id came directly from the validated JIT response and was
            # emitted before the eventually-consistent membership proof. Use
            # it directly so cleanup cannot silently miss a fresh registration.
            runner_id="$EXPECTED_RUNNER_ID"
          else
            curl --fail --silent --show-error \
              --proto '=https' \
              --connect-timeout 5 \
              --max-time 20 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_APP_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$response_path" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?name=${derived_name}&per_page=100"

            runner_id="$(python3 - "$response_path" <<'PY'
          import json
          import os
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  response = json.load(handle)
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit("GitHub returned an invalid runner cleanup response") from exc
          runners = response.get("runners")
          if not isinstance(runners, list) or any(not isinstance(item, dict) for item in runners):
              raise SystemExit("GitHub returned an invalid runner cleanup response")
          expected_name = f"io-e2e-agent-driven-test-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          matches = [runner for runner in runners if runner.get("name") == expected_name]
          if len(matches) > 1:
              raise SystemExit("GitHub returned duplicate exact-name runners")
          if not matches:
              print("")
              raise SystemExit(0)
          runner = matches[0]
          runner_id = runner.get("id")
          if not isinstance(runner_id, int) or isinstance(runner_id, bool) or runner_id <= 0:
              raise SystemExit("GitHub returned an invalid runner cleanup id")
          supplied_id = os.environ.get("EXPECTED_RUNNER_ID", "")
          if supplied_id and runner_id != int(supplied_id):
              raise SystemExit("exact-name runner id differs from the provisioned runner")
          labels = runner.get("labels")
          if not isinstance(labels, list) or any(not isinstance(item, dict) for item in labels):
              raise SystemExit("GitHub returned invalid runner cleanup labels")
          label_names = {item.get("name") for item in labels}
          expected_label = os.environ.get("EXPECTED_RUNNER_LABEL") or expected_name
          if expected_label not in label_names:
              raise SystemExit("exact-name runner is missing its unique label")
          print(runner_id)
          PY
            )"
          fi
          if [ -z "$runner_id" ]; then
            echo "JIT runner registration is already absent"
            exit 0
          fi
          if ! [[ "$runner_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GitHub returned an invalid runner cleanup id"
            exit 1
          fi

          status="$(curl --silent --show-error \
            --request DELETE \
            --proto '=https' \
            --connect-timeout 5 \
            --max-time 20 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_APP_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$delete_response_path" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/${runner_id}")"
          case "$status" in
            204)
              echo "stale JIT runner registration removed"
              ;;
            404)
              echo "JIT runner registration was already removed"
              ;;
            *)
              echo "::error::GitHub runner deletion failed with HTTP $status"
              exit 1
              ;;
          esac
