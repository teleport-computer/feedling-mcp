# docker-compose.phala.pre.runner.yaml — Pre V1 agent-runner worker CVM
#
# Dual-runtime coexistence (2026-07-21 design doc §7, §8 P1): this CVM runs
# ONLY the V1 agent-runner supervisor — no backend, no enclave, no ingress, no
# pooled Runtime V2 serve-worker. The serve-worker that used to live here moved
# onto the main Pre CVM (deploy/docker-compose.phala.pre.yaml) as a second
# container sharing the backend's image; a runner-side serve-worker AND a
# main-CVM serve-worker would double-pool the same job queue, so this file
# reverts to the V1-only form to let P1 validate dual-fleet coexistence
# (one resident CVM here, one pooled worker on the main CVM) before P3 touches
# production. Adapted from origin/test:deploy/docker-compose.phala.runner.yaml
# (the test V1 runner template, pre-Runtime-V2 migration) with pre-specific
# naming (app name, container/volume names) — the env VAR NAMES themselves are
# unchanged, only which secrets/vars CI maps into them differs (pre reuses
# several TEST_-prefixed GitHub secrets/vars, same convention as the main pre
# CVM's deploy job).
#
# Required encrypted env (must match the main Pre CVM where noted):
#   DATABASE_URL                  same external PostgreSQL as the backend
#   FEEDLING_RUNTIME_TOKEN_SECRET same value as the main backend
#   FEEDLING_API_URL              main CVM public ingress URL
#   FEEDLING_ENCLAVE_URL          main CVM enclave gateway-passthrough URL
#   FEEDLING_HOST_ALL=1           mirror the backend
#   AGENT_MAX_CHILDREN            per-runner capacity ceiling (must cover the
#                                 user count or some users go unserved)

name: feedling-pre-runner

x-agent-runner-env: &agent-runner-env
  FEEDLING_API_URL: "${FEEDLING_API_URL:-}"          # main pre CVM ingress URL
  FEEDLING_ENCLAVE_URL: "${FEEDLING_ENCLAVE_URL:-}"  # main pre CVM enclave passthrough URL
  AGENT_DATA_ROOT: "/agent-data"
  AGENT_LEASE_TTL_SEC: "${AGENT_LEASE_TTL_SEC:-300}"
  AGENT_TICK_INTERVAL_SEC: "${AGENT_TICK_INTERVAL_SEC:-15}"
  AGENT_ENVELOPE_REFETCH_SEC: "${AGENT_ENVELOPE_REFETCH_SEC:-300}"
  AGENT_RESOLVE_CONCURRENCY: "${AGENT_RESOLVE_CONCURRENCY:-8}"
  AGENT_RUNTIME_ISOLATION: "process"
  DATABASE_URL: "${DATABASE_URL:-}"
  AGENT_RUNTIME_USERS: "${AGENT_RUNTIME_USERS:-}"
  AGENT_RUNTIME_AUTODISCOVER: "${AGENT_RUNTIME_AUTODISCOVER:-}"
  FEEDLING_RUNTIME_TOKEN_SECRET: "${FEEDLING_RUNTIME_TOKEN_SECRET:-}"
  FEEDLING_HOST_ALL: "${FEEDLING_HOST_ALL:-}"
  FEEDLING_MIGRATE_ENABLE: "${FEEDLING_MIGRATE_ENABLE:-}"
  # Genesis import worker: dual-runtime routes V1-desired users' genesis jobs
  # here. Claim is FOR UPDATE SKIP LOCKED, so it stays correct alongside the
  # main CVM's own serve-worker genesis thread (both drain the same queue).
  FEEDLING_GENESIS_WORKER_ENABLED: "1"
  FEEDLING_GENESIS_WORKER_INTERVAL_SEC: "${FEEDLING_GENESIS_WORKER_INTERVAL_SEC:-10}"
  FEEDLING_GENESIS_RUNTIME_TOKEN_TTL_SEC: "${FEEDLING_GENESIS_RUNTIME_TOKEN_TTL_SEC:-7200}"

services:
  # Single runner per CVM (mirrors prod/test). One data volume → a user's
  # per-user home + chat checkpoint always live in one place, so a lease that
  # re-acquires here resumes from a consistent cursor (no cross-runner
  # stale-checkpoint wedge).
  agent-runner:
    image: ghcr.io/teleport-computer/feedling-agent-runner:0bc75d8   # CI pins the sha
    container_name: agent-runner
    command: ["python", "-u", "backend/agent_runtime/supervisor.py"]
    restart: unless-stopped
    environment:
      <<: *agent-runner-env
      AGENT_MAX_CHILDREN: "${AGENT_MAX_CHILDREN:-16}"
    volumes:
      - feedling_agent_runtime_pre_runner:/agent-data

volumes:
  feedling_agent_runtime_pre_runner:
    name: feedling_agent_runtime_pre_runner
