# docker-compose.phala.pre.runner.yaml — Pre Hosted Runtime V2 worker CVM
#
# This separate Phala CVM runs only the pooled Runtime V2 worker.  The retired
# hosted resident supervisor is deliberately absent: Pre has no per-user CLI
# child processes, leases, homes, checkpoints, static roster, or resident
# rollback service.  All turn state lives in PostgreSQL and the worker calls the
# main CVM's API/decrypt service with short-lived, user-bound runtime tokens.
#
# Required encrypted env (must match the main Pre CVM where noted):
#   DATABASE_URL                  same external PostgreSQL as the backend
#   FEEDLING_RUNTIME_TOKEN_SECRET same value as the main backend
#   FEEDLING_API_URL              main CVM public ingress URL
#   FEEDLING_ENCLAVE_URL          main CVM enclave gateway-passthrough URL
# Optional encrypted sandbox env (required together when provider=e2b):
#   FEEDLING_V2_SANDBOX_PROVIDER  disabled (default) or e2b
#   E2B_API_KEY                   E2B project API key
#   FEEDLING_V2_E2B_TEMPLATE      audited Runtime V2 extractor template tag

name: feedling-pre-runner

x-serve-worker-env: &serve-worker-env
  FEEDLING_API_URL: "${FEEDLING_API_URL:-}"
  FEEDLING_ENCLAVE_URL: "${FEEDLING_ENCLAVE_URL:-}"
  DATABASE_URL: "${DATABASE_URL:-}"
  FEEDLING_RUNTIME_TOKEN_SECRET: "${FEEDLING_RUNTIME_TOKEN_SECRET:-}"
  FEEDLING_V2_FLEET_IDENTITY_REQUIRED: "1"
  FEEDLING_V2_RUNNER_CVM_ID: "${FEEDLING_V2_RUNNER_CVM_ID:-}"
  FEEDLING_V2_DEPLOYED_BUILD: "${FEEDLING_V2_DEPLOYED_BUILD:-}"
  FEEDLING_V2_TRAJECTORY_REVIEW_ENABLED: "${FEEDLING_V2_TRAJECTORY_REVIEW_ENABLED:-0}"
  FEEDLING_V2_TRAJECTORY_REVIEW_MAX_ACTIVE: "${FEEDLING_V2_TRAJECTORY_REVIEW_MAX_ACTIVE:-64}"
  FEEDLING_V2_SANDBOX_PROVIDER: "${FEEDLING_V2_SANDBOX_PROVIDER:-disabled}"
  E2B_API_KEY: "${E2B_API_KEY:-}"
  FEEDLING_V2_E2B_TEMPLATE: "${FEEDLING_V2_E2B_TEMPLATE:-}"
  FEEDLING_V2_E2B_ALLOW_INTERNET: "${FEEDLING_V2_E2B_ALLOW_INTERNET:-0}"
  # Genesis import is a queue worker hosted by Runtime V2. It never depended on
  # the resident CLI process; claim uses FOR UPDATE SKIP LOCKED and has its own
  # heartbeat kind on /v1/admin/v2-metrics.
  FEEDLING_GENESIS_WORKER_ENABLED: "1"
  FEEDLING_GENESIS_WORKER_INTERVAL_SEC: "${FEEDLING_GENESIS_WORKER_INTERVAL_SEC:-10}"
  FEEDLING_GENESIS_RUNTIME_TOKEN_TTL_SEC: "${FEEDLING_GENESIS_RUNTIME_TOKEN_TTL_SEC:-7200}"

services:
  serve-worker:
    image: ghcr.io/teleport-computer/feedling-agent-runner:e57c108   # CI pins the sha
    container_name: serve-worker
    command: ["python", "-u", "backend/model_api_runtime/v2/serve_worker.py"]
    restart: unless-stopped
    environment:
      <<: *serve-worker-env
      FEEDLING_V2_MAX_WORKERS: "${FEEDLING_V2_MAX_WORKERS:-4}"
      # Must cover base64 length ceil(n/3)*4 for the 2,000,000-byte ingest cap.
      FEEDLING_V2_IMAGE_MAX_B64_CHARS: "${FEEDLING_V2_IMAGE_MAX_B64_CHARS:-2700000}"
