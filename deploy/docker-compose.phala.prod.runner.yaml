# docker-compose.phala.prod.runner.yaml — Production Runtime V2 worker CVM
#
# Deploy this identical compose to each CVM listed in prod-runner-cvm-ids.txt.
# PostgreSQL's queue claim provides horizontal coordination. There is no hosted
# resident supervisor, per-user child process, lease, checkpoint, home, roster,
# or resident rollback service in the production topology.

name: feedling-prod-runner

services:
  serve-worker:
    image: ghcr.io/teleport-computer/feedling-agent-runner:164c64b   # CI pins the sha
    command: ["python", "-u", "backend/model_api_runtime/v2/serve_worker.py"]
    restart: unless-stopped
    environment:
      FEEDLING_API_URL: "${FEEDLING_API_URL:-}"
      FEEDLING_ENCLAVE_URL: "${FEEDLING_ENCLAVE_URL:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      FEEDLING_RUNTIME_TOKEN_SECRET: "${FEEDLING_RUNTIME_TOKEN_SECRET:-}"
      FEEDLING_V2_SANDBOX_PROVIDER: "${FEEDLING_V2_SANDBOX_PROVIDER:-disabled}"
      E2B_API_KEY: "${E2B_API_KEY:-}"
      FEEDLING_V2_E2B_TEMPLATE: "${FEEDLING_V2_E2B_TEMPLATE:-}"
      FEEDLING_V2_E2B_ALLOW_INTERNET: "${FEEDLING_V2_E2B_ALLOW_INTERNET:-0}"
      FEEDLING_V2_MAX_WORKERS: "${FEEDLING_V2_MAX_WORKERS:-4}"
      FEEDLING_V2_IMAGE_MAX_B64_CHARS: "${FEEDLING_V2_IMAGE_MAX_B64_CHARS:-2700000}"
      FEEDLING_GENESIS_WORKER_ENABLED: "1"
      FEEDLING_GENESIS_WORKER_INTERVAL_SEC: "${FEEDLING_GENESIS_WORKER_INTERVAL_SEC:-10}"
      FEEDLING_GENESIS_RUNTIME_TOKEN_TTL_SEC: "${FEEDLING_GENESIS_RUNTIME_TOKEN_TTL_SEC:-7200}"
