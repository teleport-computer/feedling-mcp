# Local Hosted Runtime V2 worker overlay.
#
# This overlay is intentionally NOT a resident supervisor. Managed and local
# hosted model-API accounts use the same pooled Runtime V2 queue. Operators who
# want an independently controlled resident agent use the documented
# `feedling-chat-resident` consumer with the `/v1/chat/*` protocol instead.

name: feedling-enclave

services:
  serve-worker:
    image: ghcr.io/teleport-computer/feedling-agent-runner:dev
    command: ["python", "-u", "backend/model_api_runtime/v2/serve_worker.py"]
    restart: unless-stopped
    environment:
      FEEDLING_API_URL: "http://backend:5001"
      FEEDLING_ENCLAVE_URL: "https://enclave:5003"
      DATABASE_URL: "${DATABASE_URL:-}"
      FEEDLING_RUNTIME_TOKEN_SECRET: "${FEEDLING_RUNTIME_TOKEN_SECRET:-}"
      FEEDLING_V2_MAX_WORKERS: "${FEEDLING_V2_MAX_WORKERS:-4}"
      FEEDLING_V2_TRAJECTORY_REVIEW_ENABLED: "${FEEDLING_V2_TRAJECTORY_REVIEW_ENABLED:-0}"
      FEEDLING_V2_TRAJECTORY_REVIEW_MAX_ACTIVE: "${FEEDLING_V2_TRAJECTORY_REVIEW_MAX_ACTIVE:-64}"
      FEEDLING_V2_SANDBOX_PROVIDER: "${FEEDLING_V2_SANDBOX_PROVIDER:-disabled}"
      E2B_API_KEY: "${E2B_API_KEY:-}"
      FEEDLING_V2_E2B_TEMPLATE: "${FEEDLING_V2_E2B_TEMPLATE:-}"
      FEEDLING_V2_E2B_ALLOW_INTERNET: "${FEEDLING_V2_E2B_ALLOW_INTERNET:-0}"
      FEEDLING_GENESIS_WORKER_ENABLED: "${FEEDLING_GENESIS_WORKER_ENABLED:-1}"
    depends_on:
      backend:
        condition: service_started
      enclave:
        condition: service_healthy
