# Feedling — Phala TDX CVM compose (CVM-only, post-VPS migration).
#
# VPS is gone. This compose is the whole production stack:
#   - dstack-ingress: WebPKI TLS for api.feedling.app and enclave.feedling.app
#   - backend:        ASGI (HTTP+WS) — sole source of truth for user data
#   - enclave:        decrypt proxy + /attestation with its own TLS on :5003,
#                     reachable directly via dstack-gateway `-5003s.` passthrough
#   - enclave-domain: internal HTTP :5004 entrypoint, reachable only through
#                     the ingress-backed enclave.feedling.app custom domain
#   - serve-worker:   pooled Runtime V2 worker
#
# IMPORTANT: this replaces the prior VPS+CVM split. DNS for `api.feedling.app`
# is migrated off the retired VPS host and onto Phala's dstack-gateway.
# Existing prod users re-onboard from scratch (per user direction 2026-04-21).
#
# REQUIRED CVM NODE: prod9 (dstack-pha-prod9). Multi-domain TXT routing
# via `_dstack-app-address.<domain>` only works on the prod9 gateway;
# prod5/prod7 do not support it. This is why we redeploy to a new CVM
# rather than updating the existing one on prod5 — new node → new
# app_id → new compose_hash authorization required.
#
# DNS records dstack-ingress manages automatically (needs CF token with
# Zone.DNS:Edit on feedling.app):
#   CNAME api.feedling.app → <app-id>.dstack-pha-prod9.phala.network
#   TXT   _dstack-app-address.api.feedling.app → <app-id>:443
#   CAA   api.feedling.app pinned to Let's Encrypt
#   CNAME enclave.feedling.app → <app-id>.dstack-pha-prod9.phala.network
#   TXT   _dstack-app-address.enclave.feedling.app → <app-id>:443
#   CAA   enclave.feedling.app pinned to Let's Encrypt
#
# Enclave entrypoints intentionally coexist:
#   direct: https://<app-id>-5003s.dstack-pha-prod9.phala.network → enclave:5003
#           (enclave-owned TLS and certificate pinning)
#   custom: https://enclave.feedling.app → ingress:443 → enclave-domain:5004
#           (ingress evidence plus enclave application attestation; no host port)
#
# Deploy flow:
#   1. `phala deploy -c deploy/docker-compose.phala.yaml -n feedling-enclave-v2 \
#         --node-id <prod9-node-id> -e CF_API_TOKEN=... -e CF_ZONE_ID=...`
#   2. Wait for ingress to issue LE certs (first-time boot ~2–3 min).
#   3. Update CF DNS: A record for api → the public IP printed by
#      `phala cvms get feedling-enclave-v2` (or the CNAME target above).
#   4. Compute compose_hash; publish on-chain via FeedlingAppAuth.addComposeHash.
#   5. Verify both entrypoints and their distinct evidence bindings before
#      enabling clients to use the custom-domain path.
#
# CRITICAL: every literal in this file becomes part of the compose_hash.
# Any ${VAR} below must be category (A) — cosmetic / non-security.
# See deploy/docker-compose.yaml for the full env-var hygiene rules.

name: feedling-enclave

services:
  # --- Public TLS termination for the API and enclave custom domains. ---
  # HAProxy-based L4/L7 ingress inside the TDX CVM. Issues LE certs via
  # CF DNS-01, routes by SNI. Key material stays inside the enclave
  # volume `letsencrypt` — the CF token only has DNS-edit scope, not
  # certificate authority.
  ingress:
    image: dstacktee/dstack-ingress:2.2@sha256:d05a7b343c37c1cca1bba8dbf7e8f3c6d2118158af2d41c455103796db4f67f0
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      DNS_PROVIDER: "cloudflare"
      GATEWAY_DOMAIN: "_.dstack-pha-prod9.phala.network"
      SET_CAA: "true"
      CERTBOT_EMAIL: "security@feedling.app"
      DOMAINS: |
        api.feedling.app
        enclave.feedling.app
      ROUTING_MAP: |
        api.feedling.app=backend:5001
        enclave.feedling.app=enclave-domain:5004
      # CF_API_TOKEN must be injected via `phala deploy -e` (encrypted
      # env channel, NOT baked into compose_hash). Required scopes:
      # Zone.DNS:Edit on the feedling.app zone (for DNS-01 challenge +
      # TXT _dstack-app-address records + CAA pinning).
      CLOUDFLARE_API_TOKEN: "${CF_API_TOKEN}"
    volumes:
      # dstack-ingress 2.2 talks to the host's dstack daemon via tappd.sock
      # (older API socket). Key generation, quote derivation, and the
      # _dstack-app-address TXT record binding all go through this.
      - /var/run/tappd.sock:/var/run/tappd.sock
      - feedling_ingress_letsencrypt:/etc/letsencrypt
      - feedling_ingress_evidences:/evidences
    depends_on:
      backend:
        condition: service_started
      enclave-domain:
        condition: service_started

  # --- Attestation service + decrypt proxy. ---
  # Keeps its own in-enclave TLS on :5003. NOT routed through ingress —
  # iOS reaches it via dstack-gateway passthrough at
  #   https://<app-id>-5003s.dstack-pha-prod9.phala.network/attestation
  # so the audit card can pin sha256(cert.DER) against the fingerprint
  # baked into REPORT_DATA. Moving this behind ingress would break the
  # Phase 3 pinning guarantee.
  enclave:
    image: &enclave-image ghcr.io/teleport-computer/feedling:6b4eb07
    command: &enclave-command ["python", "-u", "backend/enclave_app.py"]
    restart: unless-stopped
    environment:
      <<: &enclave-environment
        FEEDLING_DATA_DIR: "/data"
        FEEDLING_FLASK_URL: "http://backend:5001"
        # Stage-D runtime token secret. The enclave uses it to verify a caller's
        # runtime token LOCALLY (core/runtime_token.py) in _whoami_cached and
        # /v1/envelope/decrypt, SKIPPING the reentrant backend /v1/users/whoami
        # round-trip (backend/enclave_app.py, commit fdb528a). MUST match the
        # backend's + pooled V2 worker's secret. Empty = falls back to the backend
        # round-trip (old behavior, no regression). Encrypted env, not baked into
        # compose_hash. Without this line the local-verify code is dead and every
        # Runtime V2 decrypt reentrantly hits the backend.
        FEEDLING_RUNTIME_TOKEN_SECRET: "${FEEDLING_RUNTIME_TOKEN_SECRET:-}"
        # gunicorn worker (process) count for the enclave (enclave_app.py
        # _enclave_worker_count, default 1). Prod CVM is 8 vCPU so >1 parallelizes
        # the GIL-bound envelope-decrypt crypto across processes. No :9998 bind in
        # the enclave (that's the backend's), so N>1 is safe here. Encrypted env,
        # not baked into compose_hash — flip via var without on-chain re-auth.
        # 2026-07-15 2→4：enclave 是全部 iOS 读路径的解密代理（GIL 密集 crypto），
        # 实测 2 worker 仅 223MB/7% CPU——4 worker 让解密并行度翻倍、单 worker 忙时
        # 尾延迟更稳，资源代价可忽略（每 worker ~100-200MB，无 PG 连接、无端口单例）。
        FEEDLING_ENCLAVE_WORKERS: "${FEEDLING_ENCLAVE_WORKERS:-4}"
        # model_api reads from the memory read-side (mirrors the test enclave).
        MEMORY_READSIDE_FOR_MODEL_API: "true"
        # NOTE: intentionally NOT setting DSTACK_SIMULATOR_ENDPOINT.
        # dstack-sdk treats "is this env var PRESENT?" as "use simulator"
        # even when the value is empty, so an empty string would make it
        # try to connect to "" and fail with EINVAL. Leaving the var unset
        # lets dstack-sdk fall through to /var/run/dstack.sock (mounted
        # below). Only set this on dev laptops running the simulator.
      FEEDLING_ENCLAVE_PORT: "5003"
      FEEDLING_ENCLAVE_TLS: "true"
      FEEDLING_ENCLAVE_TRANSPORT_MODE: "direct_tls"
    ports:
      - "5003:5003"
    volumes: &enclave-volumes
      - feedling_enclave_data:/data
      - /var/run/dstack.sock:/var/run/dstack.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -o /dev/null -w '%{http_code}' https://127.0.0.1:5003/healthz | grep -qE '^(200|503)$'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  enclave-domain:
    image: *enclave-image
    command: *enclave-command
    restart: unless-stopped
    environment:
      <<: *enclave-environment
      FEEDLING_ENCLAVE_PORT: "5004"
      FEEDLING_ENCLAVE_TLS: "false"
      FEEDLING_ENCLAVE_TRANSPORT_MODE: "attested_ingress"
    expose:
      - "5004"
    volumes: *enclave-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5004/healthz | grep -qE '^(200|503)$'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  # --- ASGI backend — the ONLY backend. ---
  # Serves plain HTTP on :5001 (TLS terminated by ingress for
  # api.feedling.app). Also runs the WebSocket ingest on :9998 for the
  # iOS broadcast extension; that port is exposed via dstack-gateway
  # TLS-terminated route `wss://<app-id>-9998.dstack-pha-prod9...` —
  # frames are app-layer encrypted (FrameEnvelope v1) so gateway TLS
  # is sufficient for transport hygiene.
  # NOTE: the one-shot `migrate` service was removed after the file→Postgres
  # migration completed (server_config.migration_done is set on the RDS, all
  # users/data are present). It is intentionally NOT here because a `restart:no`
  # container that exits can leave dstack's stack status stuck in updating/
  # starting. The migrate_to_pg.py script itself was deleted 2026-07 (recover
  # it from git history if a re-migration is ever needed) — the marker makes it
  # a safe no-op unless invoked with --force.

  backend:
    image: ghcr.io/teleport-computer/feedling:6b4eb07
    # gunicorn (uvicorn ASGI worker) = production server (the Werkzeug dev server stalls on large
    # responses under TDX). Worker count now comes from FEEDLING_BACKEND_WORKERS
    # (backend/gunicorn_conf.py, default 1) — NOT a `-w` flag — so the default is
    # the historical single-worker behavior. -w N is code-supported (leader-elected
    # :9998 WS ingest + Postgres LISTEN/NOTIFY wake bus — see core/leader.py /
    # core/wake_bus.py). To enable: set FEEDLING_BACKEND_WORKERS=N via the
    # encrypted env channel IN A DEPLOY whose image contains the leader-election
    # patch (a pre-patch image binds :9998 at import → N>1 would double-bind; the
    # default 1 stays safe on any image). Sizing: ~18 DB conns/worker (pool 16 +
    # 1 listener + 1 election), so N×18 must stay under the RDS max_connections.
    command: ["gunicorn", "--chdir", "backend", "--config", "backend/gunicorn_conf.py", "-k", "asgi.worker.FeedlingUvicornWorker", "--timeout", "120", "-b", "0.0.0.0:5001", "asgi_app:app"]
    restart: unless-stopped
    # One fd per live client connection. Now that keep-alive connections survive
    # 75s idle (backend/gunicorn_conf.py) instead of 2s, each online app parks a
    # few pooled sockets here rather than reconnecting per request — so the
    # steady-state fd count is (online apps x pool size), not (in-flight requests).
    # Docker's default soft limit is 1024, which gunicorn does not raise on its
    # own; the container's hard limit is 524288, so lifting this is free headroom.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      FEEDLING_API_KEY: ""
      FEEDLING_ADMIN_TOKEN: "${FEEDLING_ADMIN_TOKEN:-}"
      # Password login for the admin data-track page. Inject only through the
      # encrypted deploy env channel; the legacy admin-token routes stay valid.
      FEEDLING_ADMIN_PASSWORD: "${FEEDLING_ADMIN_PASSWORD:-}"
      FEEDLING_DATA_DIR: "/data"
      FEEDLING_WS_PORT: "9998"
      # ASGI backend: start the per-worker background services (the :9998 WS
      # ingest server, bound by ONE leader-elected worker via core/leader.py, +
      # the cross-worker wake bus). Default is OFF (asgi/settings.py) so ad-hoc
      # dev instances never contend for WS leadership; a REAL deploy MUST turn
      # it on or the iOS broadcast-extension frame ingest on :9998 never binds.
      # Changing this literal alters compose_hash → re-publish on-chain.
      # See asgi/lifespan.py.
      FEEDLING_ASGI_BACKGROUND: "true"
      FEEDLING_ENCLAVE_URL: "https://enclave:5003"
      # Public HTTPS origin returned by POST /v1/voice/sessions for the
      # ElevenLabs Custom LLM callback. Keep this literal aligned with ingress
      # ROUTING_MAP above: the callback host is a trust decision and therefore
      # belongs in the measured compose_hash, not the mutable encrypted env.
      FEEDLING_VOICE_GATEWAY_PUBLIC_URL: "https://api.feedling.app"
      # External Postgres holding all (E2E-encrypted) user data + plaintext
      # metadata. Injected via the encrypted env channel (`phala deploy -e
      # DATABASE_URL=...`) because it carries DB credentials. MUST include
      # sslmode=require. SECURITY CAVEAT: because it is interpolated (not baked)
      # it does not change compose_hash — an operator can in principle point the
      # backend at a different Postgres without re-attesting. The data at rest
      # is ciphertext, but the DB endpoint sees plaintext metadata; disclose
      # this in the deployment trust docs. Defaulted to empty (not `:?`) so
      # compose synthesis / build never aborts on an unset var; the backend
      # still fails fast at startup (db.py) if it ends up empty at runtime.
      DATABASE_URL: "${DATABASE_URL:-}"
      # TEE 明文影子库（feedling-io-db-prod，独立 pg CVM）。best-effort 双写：
      # db.py 写主库后镜像到这里，tee_shadow.mirror 永不 raise、失败只计数，绝不
      # 拖垮主路径。两个都为空 = 双写 OFF（mirror.enabled() 需 FEEDLING_TEE_DUAL_WRITE=1
      # 且 TEE_DATABASE_URL 非空）。DSN 用 app 角色（无 DDL）、sslnegotiation=direct、
      # sslmode=require（与 test 一致，无 CA 分发故非 verify-full；两端同在 Phala prod9
      # 内网，连接仍 TLS 加密，日后加 CA 分发再升 verify-full）。与 DATABASE_URL 同为
      # 加密 env 注入、不烧 compose_hash。
      # ⚠️ 开启后后台调度器会全量回填（reconcile 明文表 + 经 prod enclave 解密复制
      # 密文表）——首次回填量大、打 prod enclave，建议先以 FEEDLING_TEE_DUAL_WRITE 空
      # 部署确认健康，再挑低峰翻开（改 PROD_FEEDLING_TEE_DUAL_WRITE + 重部署）。
      TEE_DATABASE_URL: "${TEE_DATABASE_URL:-}"
      FEEDLING_TEE_DUAL_WRITE: "${FEEDLING_TEE_DUAL_WRITE:-}"
      # Cloudflare R2 (S3-compatible) offload for the heavy frame ciphertext
      # (backend/object_storage.py). Injected via `phala deploy -e R2_*=...`
      # (encrypted env channel). Empty default = feature OFF (body_ct stays
      # inline in Postgres, legacy shape). The token MUST be scoped to the
      # frames bucket. Adding these keys changes compose_hash once (the normal
      # on-chain publish re-auths); rotating the values later is free.
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_FRAMES_BUCKET: "${R2_FRAMES_BUCKET:-}"
      # Dedicated bucket for heavy chat FILE ciphertext (content_type=file),
      # offloaded off the chat_messages row. Non-secret name defaults on;
      # activates whenever the R2 credentials above are present. The R2 token
      # MUST also be scoped to this bucket (else PUT 403 → graceful inline
      # Postgres fallback, exactly like today).
      R2_CHAT_FILES_BUCKET: "${R2_CHAT_FILES_BUCKET:-io-user-attachments}"
      # Dedicated bucket for client diagnostic logs (backend/diagnostics/),
      # separate from frames. Plaintext logs (user-initiated upload). Bucket
      # name is non-secret so it defaults on; activates whenever the R2
      # credentials above are present. The R2 token MUST also be scoped to this
      # bucket (else PUT 403 → graceful inline Postgres fallback). Set a short
      # lifecycle (7d) on the bucket.
      R2_USER_LOGS_BUCKET: "${R2_USER_LOGS_BUCKET:-io-user-logs}"
      # APNs developer key for push (Dynamic Island / Live Activity).
      # Injected via `phala deploy -e APNS_KEY_P8_B64=...` (encrypted env
      # channel, NOT baked into compose_hash). Empty default keeps dev
      # deploys + CI compose-build healthy — code falls through to
      # "logged_only" mode when unset. KEY_ID + TEAM_ID are also overridable
      # but default to the Apple dev team's ids in backend/push/apns.py.
      APNS_KEY_P8_B64: "${APNS_KEY_P8_B64:-}"
      APNS_KEY_ID: "${APNS_KEY_ID:-}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
      # Production push gateway (api.push.apple.com). apns.py defaults to the
      # SANDBOX gateway when unset, which silently fails for App Store / TestFlight
      # device tokens — prod must pin this to "false". (Test deploy keeps the
      # sandbox default for its sandbox-provisioned tokens.)
      APNS_SANDBOX: "false"
      # Optional: proactive admin dashboard's debug translation
      # (backend/proactive/dashboard.py). Unset = translation disabled.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # Baseline-ON for the perception/resident V2 rollout flags
      # (perception_ingress / resident_wake / resident_chat). Prod users run V2
      # by default; an explicit per-user blob value still wins, so rollback for a
      # single user is a blob toggle (not a code revert) and the env can be
      # flipped to "false" to revert the whole fleet. See
      # core/util.runtime_v2_default_on().
      FEEDLING_RUNTIME_V2_DEFAULT_ON: "true"
      # Dual-runtime coexistence (2026-07-21 design): hosted accounts default to
      # the V1 resident runtime (per-user allowlist promotes individual users to
      # pooled Runtime V2, served by the serve-worker container below). This is a
      # literal measured-compose value, not an encrypted-env rollback selector —
      # see backend/hosted/config_store.py HOSTED_RUNTIME_POLICY_ENV.
      FEEDLING_HOSTED_RUNTIME_POLICY: "dual"
      # Per-user allowlist fence default for accounts with no explicit runtime
      # row yet (backend/hosted/runtime_reconciler.py _DEFAULT_DESIRED_ENV).
      # "resident" keeps day-1 behavior identical to pre-dual-runtime prod;
      # allowlisted users' desired state overrides this default.
      FEEDLING_RUNTIME_DEFAULT_DESIRED: "resident"
      # UTC registration cutoff for automatic new Model API -> Runtime V2
      # admission. Empty preserves resident-default behavior for every account.
      FEEDLING_V2_NEW_USER_CUTOFF: "${FEEDLING_V2_NEW_USER_CUTOFF:-}"
      # Backend owns capture admission/triggers; serve-worker executes the lane.
      # Keep both deployment gates aligned. User consent remains independent.
      FEEDLING_V2_CAPTURE_ENABLED: "${FEEDLING_V2_CAPTURE_ENABLED:-1}"
      # Backend owns the V2-cutover profile trigger; serve-worker executes it.
      # Keep both copies default-off until profile generation is enabled.
      FEEDLING_V2_PROFILE_ENABLED: "${FEEDLING_V2_PROFILE_ENABLED:-0}"
      # Unaudited-route context-window default — keep in sync with serve-worker
      # (the setup path resolves/validates the same limit). See the serve-worker
      # block for the rationale. ${VAR:-} form → tunable without a new compose_hash.
      FEEDLING_V2_UNAUDITED_DEFAULT_CONTEXT_WINDOW_TOKENS: "${FEEDLING_V2_UNAUDITED_DEFAULT_CONTEXT_WINDOW_TOKENS:-131072}"
      # Genesis v2 (foreground-fast onboarding): greet on 3-5 core + identity
      # baseline, push the heavy reduce (the old ~37% failure surface) to the
      # background. Validated on test; flip to "false" to revert to the v1
      # one-shot path. Read in worker.genesis_v2_enabled().
      FEEDLING_GENESIS_V2_ENABLED: "true"
      # Genesis Round2 combined-map — one per-chunk call extracts fact+voice
      # together (fewer LLM calls) + voice/persona to foreground. Validated on
      # test (real-device quality comparison); flip off to revert to the exact
      # old split-map path. Read in worker.genesis_combined_map_enabled().
      FEEDLING_GENESIS_COMBINED_MAP: "true"
      # Legacy memory migration is opt-in. Empty = off; set to 1 only after
      # seeded Garden verification passes. Mirror the pooled V2 worker.
      FEEDLING_MIGRATE_ENABLE: "${FEEDLING_MIGRATE_ENABLE:-}"
      # Runtime-token secret shared by backend, enclave, and pooled V2 worker.
      # Empty = off. Encrypted env, not baked into compose_hash.
      FEEDLING_RUNTIME_TOKEN_SECRET: "${FEEDLING_RUNTIME_TOKEN_SECRET:-}"
      FEEDLING_RUNTIME_TOKEN_SECRET_PREVIOUS: "${FEEDLING_RUNTIME_TOKEN_SECRET_PREVIOUS:-}"
      FEEDLING_PERCEPTION_REBASELINE_UNKNOWN_KEYS: "${FEEDLING_PERCEPTION_REBASELINE_UNKNOWN_KEYS:-0}"
      FEEDLING_EXPECTED_RUNNER_COUNT: "${FEEDLING_EXPECTED_RUNNER_COUNT:-}"
      # gunicorn worker (process) count (backend/gunicorn_conf.py _worker_count,
      # default 1). N>1 is code-supported: leader-elected :9998 WS bind
      # (core/leader.py run_singleton, in the deployed image) + Postgres
      # LISTEN/NOTIFY wake bus (core/wake_bus.py). Needed because each hosted
      # clients can park /v1/chat/poll threads for up to 30s. Sizing:
      # ~18 DB conns/worker; prod RDS max_connections=402 so 4 workers (~72) is
      # safe. Encrypted env, not baked into compose_hash — flip via var without
      # on-chain re-auth. Default 4 here since the deployed image has the leader
      # patch; set to 1 if ever deploying a pre-leader-election image.
      # 2026-07-15 4→6：实测容量支持（prod RDS max_connections=402、当前仅用 ~82，
      # +2 worker ≈ +36 连接仍宽裕；CVM 8 核、available ~12GB，worker 峰值 RSS 被
      # max_requests 回收 + MALLOC_ARENA_MAX 封在 ~1GB，6×1GB 预算内）。收益：长轮询
      # 并发摊薄 + 单 worker 回收时容量只降 1/6。注意 wake-bus fan-out 随 worker 数
      # 线性放大（每条 chat NOTIFY 多 2 个 worker 的 store 刷新），当前消息速率下可忽略。
      FEEDLING_BACKEND_WORKERS: "${FEEDLING_BACKEND_WORKERS:-6}"
      # TEE 影子库 per-worker 连接池预算（tee_shadow/mirror.py，代码默认 max=32
      # 是按 4 worker 算的：4×32=128 < 200）。worker 提到 6 后必须显式下调：
      # 6×24=144 + 非 app 角色 ~10 + superuser 保留 3 ≈ 157 < TEE PG
      # max_connections=200（2026-07-15 实测），留 ~40 余量。min 同步 8→4：
      # 6 worker × 4 = 24 条热连接（直连 TLS 走 Phala 网关，闲置越多被网关
      # 静默掐断的暴露面越大，见 mirror._pool_max_lifetime 注释）。
      # 有 tests/test_gunicorn_conf.py 的预算守卫测试联动。
      FEEDLING_TEE_POOL_MAX: "24"
      FEEDLING_TEE_POOL_MIN: "4"
      # glibc per-thread malloc arena 数量封顶。不设时 64 位默认 8×核数（8 核=64
      # 个），与 anyio 线程池 40 线程相乘的结果是 2026-07-14 prod 实测形态：每个
      # worker ~60 个 64MiB arena 近乎全驻留、占 RSS 80%+、12h 涨到 2-3GB/worker
      # 不自趋稳（arena 高水位只涨不还）。封顶 4 让分配集中到少数 arena、可复用，
      # 配合 gunicorn max_requests 回收（backend/gunicorn_conf.py）双保险。取 4
      # 而非 2：保留一点并发分配空间，锁竞争代价可忽略（瓶颈在 DB/enclave I/O）。
      # 明文配置、烘进 compose_hash（这是行为参数，不是密钥）。
      MALLOC_ARENA_MAX: "4"
    ports:
      - "5001:5001"
      - "9998:9998"
    volumes:
      - feedling_backend_data:/data
    depends_on:
      enclave:
        condition: service_healthy

  # --- Pooled Runtime V2 worker (dual-runtime coexistence, in-CVM). ---
  # Same image as backend — the release-pin script (deploy/pin-runtime-release.sh)
  # retargets whichever `ghcr.io/…/feedling:<sha>` refs exist in this file, so
  # backend and serve-worker are pinned to the same commit automatically. This
  # container serves ONLY the per-user allowlist's v2/draining accounts (see
  # docs/superpowers/specs/2026-07-21-dual-runtime-v1-v2-coexistence-design.md
  # §7a); V1 resident hosting for the rest of the fleet still runs on the
  # separate agent-runner CVM(s) (deploy/docker-compose.phala.prod.runner.yaml),
  # which this compose change does NOT touch (§7b: "runner CVM: 不动").
  serve-worker:
    image: ghcr.io/teleport-computer/feedling:6b4eb07
    container_name: serve-worker
    command: ["python", "-u", "backend/model_api_runtime/v2/serve_worker.py"]
    restart: unless-stopped
    environment:
      # Compose-internal URLs — NOT the public gateway. Mirrors backend's own
      # FEEDLING_ENCLAVE_URL above; the ingress ROUTING_MAP entry
      # (api.feedling.app=backend:5001) is the source of the backend port.
      FEEDLING_API_URL: "http://backend:5001"
      FEEDLING_ENCLAVE_URL: "https://enclave:5003"
      DATABASE_URL: "${DATABASE_URL:-}"
      FEEDLING_RUNTIME_TOKEN_SECRET: "${FEEDLING_RUNTIME_TOKEN_SECRET:-}"
      FEEDLING_V2_MAX_WORKERS: "4"
      FEEDLING_V2_FLEET_IDENTITY_REQUIRED: "1"
      FEEDLING_V2_RUNNER_CVM_ID: "${FEEDLING_V2_RUNNER_CVM_ID:-main-cvm}"
      FEEDLING_V2_DEPLOYED_BUILD: "${FEEDLING_V2_DEPLOYED_BUILD:-}"
      FEEDLING_GENESIS_WORKER_ENABLED: "1"
      # Runtime V2 background memory lanes execute in this worker, not backend.
      FEEDLING_V2_CAPTURE_ENABLED: "${FEEDLING_V2_CAPTURE_ENABLED:-1}"
      FEEDLING_V2_DREAM_ENABLED: "${FEEDLING_V2_DREAM_ENABLED:-1}"
      # CVM-local in-process sandbox: PDF/DOCX/XLSX materialize + extract inside
      # the serve-worker (no E2B), staying within the TDX trust boundary.
      FEEDLING_V2_SANDBOX_PROVIDER: "local"
      FEEDLING_V2_IMAGE_MAX_B64_CHARS: "2700000"
      # Unaudited-route (custom relay / unknown model) context-window default.
      # Prod's custom-relay users all back >=128k-context models, so 131072 gives
      # a persona/world-book-sized REQUIRED prompt real headroom instead of the
      # code default's conservative 32768 (which was itself raised from 16384
      # after world-book users hit prompt_frontier_exhausted before any provider
      # call). ${VAR:-} form: tunable later via encrypted env WITHOUT a new
      # compose_hash; "0" restores strict fail-closed.
      FEEDLING_V2_UNAUDITED_DEFAULT_CONTEXT_WINDOW_TOKENS: "${FEEDLING_V2_UNAUDITED_DEFAULT_CONTEXT_WINDOW_TOKENS:-131072}"
      # web_fetch article extraction (trafilatura, runs in this serve-worker).
      # Default ON — a rollback lever, not a feature gate. Set to "0" to fall back
      # to the plain tag-strip; takes effect on the next serve-worker restart.
      FEEDLING_WEB_EXTRACT_ARTICLE: "${FEEDLING_WEB_EXTRACT_ARTICLE:-1}"
      # Break-glass trajectory inspection (audited, runner-local CLI — never an
      # HTTP route). Default OFF: enabling it lets an operator inside this
      # container decrypt one user's one job. Turn it on via encrypted env for
      # the duration of an incident and back to "0" afterwards — the ${VAR:-}
      # form means neither flip needs a new compose_hash / on-chain publish.
      FEEDLING_V2_TRAJECTORY_INSPECT_ENABLED: "${FEEDLING_V2_TRAJECTORY_INSPECT_ENABLED:-0}"
      # Prompt catch-up compaction budgets. Declared here (rather than left to
      # the code defaults) so a stuck summary frontier can be unwedged by
      # shrinking the batch from an encrypted env instead of shipping a build:
      # a batch is folded all-or-nothing, so a batch whose summary the model
      # cannot render as valid bullets never advances the watermark and blocks
      # every later message for that user (usr_7f30…, 2026-07-24 → 07-27).
      # Values below are the code defaults — this is wiring, not a change.
      # 200 -> 50 (2026-07-28). Both prod stalls were the SAME oversized
      # batch in different clothes: usr_7f30 could not render 200 rows as
      # valid bullets under the 500-token output budget (folds refused,
      # then a deadlock), and usr_90184 could not get 200 rows answered
      # inside compaction's 60s provider timeout (transient every turn).
      # A quarter-size request is both easier to summarize and faster to
      # return; the cost is more fold calls per backlog, which is bounded.
      FEEDLING_V2_COMPACTION_BATCH_MSGS: "${FEEDLING_V2_COMPACTION_BATCH_MSGS:-50}"
      FEEDLING_V2_COMPACTION_BATCH_CHARS: "${FEEDLING_V2_COMPACTION_BATCH_CHARS:-120000}"
      # Generation may be enabled for M4 validation; prompt replacement stays
      # locked until M5 has deployed and been verified.
      FEEDLING_V2_PROFILE_ENABLED: "${FEEDLING_V2_PROFILE_ENABLED:-0}"
      # DO NOT set to 1 before M5 MEMORY/USER prompt injection is deployed.
      FEEDLING_V2_PROFILE_COVERAGE_DETERMINISTIC: "${FEEDLING_V2_PROFILE_COVERAGE_DETERMINISTIC:-0}"
      FEEDLING_V2_PROMPT_CATCHUP_DEADLINE_SEC: "${FEEDLING_V2_PROMPT_CATCHUP_DEADLINE_SEC:-600}"
      # 20 -> 50 (2026-07-28). This threshold decides whether a turn enters
      # the catch-up fold path AT ALL: a backlog at or under it fits in the
      # verbatim tail and nothing is folded. At 20 nearly every active user
      # folds every turn; the two prod users who stayed healthy through all
      # of this (21/21 and 13/15) were healthy precisely because their
      # history never reached it. A few dozen more verbatim rows is cheap
      # against a >=128k input budget.
      FEEDLING_V2_TAIL_BUDGET_MSGS: "${FEEDLING_V2_TAIL_BUDGET_MSGS:-50}"
      # Head-of-line escape hatch: after shrinking the batch all the way to a
      # single message the catch-up still cannot fold it, cover that ONE row
      # with a deterministic stand-in segment and advance past it. Losing
      # summary coverage of one row beats blocking every later message for
      # that user indefinitely; `chat_messages` still holds the transcript.
      # "0" restores the strict fail-closed behaviour (turn fails instead).
      FEEDLING_V2_COMPACTION_QUARANTINE_ENABLED: "${FEEDLING_V2_COMPACTION_QUARANTINE_ENABLED:-1}"
      FEEDLING_HOSTED_RUNTIME_POLICY: "dual"
      FEEDLING_RUNTIME_DEFAULT_DESIRED: "resident"
    depends_on:
      enclave:
        condition: service_healthy

volumes:
  feedling_enclave_data:
    name: feedling_enclave_data
  feedling_backend_data:
    name: feedling_backend_data
  feedling_ingress_letsencrypt:
    name: feedling_ingress_letsencrypt
  feedling_ingress_evidences:
    name: feedling_ingress_evidences

# Deploy trigger: this comment touches a path in the deploy-cvm paths-filter
# (deploy/docker-compose.phala.yaml) so `detect-cvm-changes` sees a CVM change
# and runs deploy-cvm. It activates the already-present worker config:
# FEEDLING_BACKEND_WORKERS=4 / FEEDLING_ENCLAVE_WORKERS=2 + the enclave-side
# FEEDLING_RUNTIME_TOKEN_SECRET wiring (local whoami verify). Safe no-op.
